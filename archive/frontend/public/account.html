<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAWRADISE — My Account</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --surface2: #1a1a2a;
    --border: #2a2a3a;
    --text: #e0e0e0;
    --text2: #8888aa;
    --cyan: #00d4ff;
    --magenta: #ff0066;
    --green: #00ff88;
    --mono: Consolas, 'Courier New', monospace;
    --sans: -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  header {
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: bold;
    color: var(--cyan);
    letter-spacing: 2px;
    text-decoration: none;
  }
  .logo span { color: var(--magenta); }
  nav { display: flex; gap: 24px; align-items: center; }
  nav a {
    color: var(--text2);
    text-decoration: none;
    font-size: 14px;
    transition: color 0.2s;
  }
  nav a:hover { color: var(--cyan); }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  .page-title {
    font-family: var(--mono);
    font-size: 24px;
    color: var(--text);
    margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .page-title span { color: var(--magenta); }

  .user-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .user-name {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .user-email {
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 12px;
  }
  .user-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    font-size: 13px;
  }
  .user-field {
    padding: 8px 12px;
    background: var(--surface2);
    border-radius: 4px;
    border: 1px solid var(--border);
  }
  .user-field-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text2);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .user-field-value {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    word-break: break-all;
  }
  .btn-disconnect {
    margin-top: 12px;
    padding: 6px 12px;
    background: transparent;
    border: 1px solid var(--magenta);
    color: var(--magenta);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    border-radius: 3px;
  }
  .btn-disconnect:hover { background: var(--magenta); color: var(--bg); }

  .section-title {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--cyan);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .count {
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    color: var(--text2);
  }

  .order-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .order-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .order-id {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
  }
  .order-date {
    font-size: 11px;
    color: var(--text2);
    font-family: var(--mono);
  }
  .order-status {
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 3px;
    text-transform: uppercase;
  }
  .order-status.pending { background: #ffaa0022; color: #ffaa00; border: 1px solid #ffaa0044; }
  .order-status.paid { background: #00ff8822; color: #00ff88; border: 1px solid #00ff8844; }

  .order-items-list {
    margin-bottom: 10px;
  }
  .order-item-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .order-item-row:last-child { border-bottom: none; }
  .order-item-title { flex: 1; }
  .order-item-qty { color: var(--text2); font-size: 12px; margin-left: 8px; }
  .order-item-price { font-family: var(--mono); color: var(--green); }

  .order-total-row {
    display: flex;
    justify-content: space-between;
    padding-top: 10px;
    border-top: 2px solid var(--border);
    font-size: 14px;
  }
  .order-total-label { color: var(--text2); }
  .order-total-value { font-family: var(--mono); font-weight: bold; color: var(--green); }

  .download-btn {
    display: inline-block;
    margin-top: 8px;
    padding: 6px 14px;
    background: transparent;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    border-radius: 3px;
    text-decoration: none;
    transition: all 0.2s;
  }
  .download-btn:hover { background: var(--cyan); color: var(--bg); }
  .download-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .empty-state {
    text-align: center;
    padding: 48px 0;
    color: var(--text2);
  }
  .empty-state .icon {
    font-size: 40px;
    margin-bottom: 12px;
    opacity: 0.3;
  }

  .logout-btn {
    padding: 8px 16px;
    background: transparent;
    border: 1px solid var(--magenta);
    color: var(--magenta);
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    border-radius: 3px;
  }
  .logout-btn:hover { background: var(--magenta); color: var(--bg); }

  .env-badge {
    display: none;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text2);
    margin-left: 16px;
  }

  @media (max-width: 768px) {
    .container { padding: 16px; }
    .user-fields { grid-template-columns: 1fr; }
  }
</style>
</head>
<body data-page="account">

<header>
  <a data-link="/" class="logo">PAW<span>RADISE</span></a>
  <div style="display:flex;align-items:center;">
    <nav style="margin-right:24px;">
      <a data-link="/" data-nav="shop">SHOP</a>
      <a data-link="/community" data-nav="community">COMMUNITY</a>
      <a data-link="/account" data-nav="account">ACCOUNT</a>
    </nav>
    <button id="authBtn" style="background:transparent;border:1px solid var(--cyan);color:var(--cyan);font-family:var(--mono);font-size:12px;padding:6px 14px;border-radius:4px;cursor:pointer;margin-right:12px;letter-spacing:1px;">LOGIN</button>
    <span id="envBadge" class="env-badge"></span>
  </div>
</header>

<div class="container">
  <div class="page-title"><span style="color:var(--magenta)">/</span> my account</div>

  <div id="loadingState">
    <div class="order-summary" style="text-align:center;padding:32px 0;">
      <div class="status-spinner active" style="margin:0 auto 12px;"></div>
      <div style="font-family:var(--mono);font-size:12px;color:var(--text2);">loading your account...</div>
    </div>
  </div>

  <div id="accountContent" style="display:none;">
    <div class="user-panel">
      <div class="user-name" id="userName"></div>
      <div class="user-email" id="userEmail"></div>
      <div class="user-fields">
        <div class="user-field">
          <div class="user-field-label">Wallet</div>
          <div class="user-field-value" id="userWallet">not connected</div>
        </div>
        <div class="user-field">
          <div class="user-field-label">Joined</div>
          <div class="user-field-value" id="userJoined"></div>
        </div>
      </div>
      <button class="btn-disconnect" onclick="disconnectWallet()">DISCONNECT WALLET</button>
    </div>

    <div class="section-title">
      Purchases
      <span class="count" id="purchaseCount">0</span>
    </div>

    <div id="ordersList"></div>
  </div>
</div>

<div style="border-top:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;">
  <span style="font-size:11px;color:var(--text2);font-family:var(--mono);">
    PAWRADISE &copy; 2026 &mdash; <span id="envText">production</span>
  </span>
  <button class="logout-btn" onclick="logout()">LOGOUT</button>
</div>

<script>
  const path = window.location.pathname;
  const isStaging = path.startsWith('/staging');
  const API_BASE = isStaging ? '/staging/api/v1' : '/api/v1';
  const LINK_BASE = isStaging ? '/staging' : '';
  // staging-aware nav links: data-link="/community" -> "/staging/community" on staging
  document.querySelectorAll('[data-link]').forEach(a => { a.href = LINK_BASE + a.getAttribute('data-link'); });
  // highlight current page in nav
  (function(){ const pg = document.body.getAttribute('data-page'); const el = document.querySelector('[data-nav="'+pg+'"]'); if(el) el.style.color = 'var(--cyan)'; })();
  // auth-aware LOGIN/LOGOUT button
  (function(){ const b=document.getElementById('authBtn'); if(!b) return;
    const t=localStorage.getItem('pawradise_token');
    if(t){ b.textContent='LOGOUT'; b.onclick=function(){ localStorage.removeItem('pawradise_token'); window.location.href=LINK_BASE+'/'; }; }
    else { b.textContent='LOGIN'; b.onclick=function(){ window.location.href=LINK_BASE+'/login?redirect='+encodeURIComponent(window.location.pathname+window.location.search); }; }
  })();
  document.getElementById('envBadge').textContent = isStaging ? 'ENV: staging' : 'ENV: production';
  document.getElementById('envText').textContent = isStaging ? 'staging' : 'production';

  function getToken() {
    return localStorage.getItem('pawradise_token') || '';
  }

  function isLoggedIn() {
    return !!getToken();
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  async function loadAccount() {
    if (!isLoggedIn()) {
      window.location.href = LINK_BASE + '/login?redirect=' + encodeURIComponent(LINK_BASE + '/account');
      return;
    }

    try {
      // Load user profile
      const userRes = await fetch(`${API_BASE}/me`, {
        headers: { 'Authorization': 'Bearer ' + getToken() }
      });
      if (!userRes.ok) {
        logout();
        return;
      }
      const userData = await userRes.json();
      const user = userData.user || userData;

      document.getElementById('userName').textContent = user.name || 'User';
      document.getElementById('userEmail').textContent = user.email;
      document.getElementById('userJoined').textContent = formatDate(user.created_at);
      document.getElementById('userWallet').textContent = user.wallet_address || 'not connected';

      // Load orders
      const ordersRes = await fetch(`${API_BASE}/orders`, {
        headers: { 'Authorization': 'Bearer ' + getToken() }
      });
      if (!ordersRes.ok) {
        document.getElementById('ordersList').innerHTML = '<div class="empty-state"><div class="icon">ERR</div><div>Failed to load orders</div></div>';
      } else {
        const ordersData = await ordersRes.json();
        renderOrders(ordersData.orders || [], ordersData.total || 0);
      }

      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('accountContent').style.display = 'block';
    } catch (e) {
      console.error(e);
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('accountContent').style.display = 'block';
    }
  }

  function renderOrders(orders, total) {
    document.getElementById('purchaseCount').textContent = total;

    if (orders.length === 0) {
      document.getElementById('ordersList').innerHTML = `
        <div class="empty-state">
          <div class="icon">$(echo 'NO PURCHASES')</div>
          <div>no purchases yet</div>
          <div style="margin-top:8px;font-size:12px;">head to the <a href="${LINK_BASE}/" style="color:var(--cyan)">shop</a> to buy something</div>
        </div>
      `;
      return;
    }

    const html = orders.map(order => `
      <div class="order-card">
        <div class="order-card-header">
          <div>
            <div class="order-id">ORDER #${order.id}</div>
            <div class="order-date">${formatDate(order.created_at)}</div>
          </div>
          <span class="order-status ${order.status}">${order.status}</span>
        </div>
        <div class="order-items-list">
          ${order.items.map(item => `
            <div class="order-item-row">
              <span class="order-item-title">
                ${escapeHtml(item.product.title)}
                <span class="order-item-qty">x${item.quantity}</span>
              </span>
              <span class="order-item-price">$${item.price_usd}</span>
            </div>
          `).join('')}
        </div>
        <div class="order-total-row">
          <span class="order-total-label">TOTAL</span>
          <span class="order-total-value">$${order.total_usd}</span>
        </div>
        ${order.status === 'paid' ? renderDownloads(order) : ''}
      </div>
    `).join('');
    document.getElementById('ordersList').innerHTML = html;
  }

  function renderDownloads(order) {
    const itemsWithDL = order.items.filter(item => item.product && item.product.slug);
    if (itemsWithDL.length === 0) return '';

    return `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
      <div style="font-size:11px;color:var(--text2);margin-bottom:6px;font-family:var(--mono);">DOWNLOADS</div>
      ${itemsWithDL.map(item => {
        const canDownload = order.status === 'paid' && (item.max_downloads === 0 || item.download_count < item.max_downloads);
        return `<a class="download-btn" href="${API_BASE}/orders/download/${item.id}" ${canDownload ? '' : 'disabled'}>
          ${item.product.title} (${item.download_count}/${item.max_downloads || '∞'})
        </a>`;
      }).join('')}
    </div>`;
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    try {
      const d = new Date(dateStr);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    } catch {
      return dateStr;
    }
  }

  async function disconnectWallet() {
    if (!confirm('Disconnect your wallet? This will not affect your orders.')) return;
    try {
      await fetch(`${API_BASE}/me`, {
        method: 'PUT',
        headers: {
          'Authorization': 'Bearer ' + getToken(),
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ wallet_address: '' })
      });
      location.reload();
    } catch (e) {
      console.error(e);
    }
  }

  async function logout() {
    try {
      await fetch(`${API_BASE}/logout`, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + getToken() }
      });
    } catch (e) {}
    localStorage.removeItem('pawradise_token');
    window.location.href = LINK_BASE + '/';
  }

  loadAccount();
</script>
</body>
</html>
