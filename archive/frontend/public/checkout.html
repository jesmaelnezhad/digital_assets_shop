<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAWRADISE — Checkout</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --surface2: #1a1a2a;
    --border: #2a2a3a;
    --text: #e0e0e0;
    --text2: #8888aa;
    --cyan: #00d4ff;
    --magenta: #ff0066;
    --green: #00ff88;
    --mono: Consolas, 'Courier New', monospace;
    --sans: -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }
  .terminal-line {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    user-select: none;
  }
  .terminal-line .prompt { color: var(--cyan); }
  .terminal-line .cmd { color: var(--text); }

  header {
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: bold;
    color: var(--cyan);
    letter-spacing: 2px;
    text-decoration: none;
  }
  .logo span { color: var(--magenta); }
  nav { display: flex; gap: 24px; align-items: center; }
  nav a {
    color: var(--text2);
    text-decoration: none;
    font-size: 14px;
    transition: color 0.2s;
  }
  nav a:hover { color: var(--cyan); }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  .page-title {
    font-family: var(--mono);
    font-size: 24px;
    color: var(--text);
    margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .page-title span { color: var(--magenta); }

  .order-summary {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .order-id {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text2);
  }
  .order-status {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 3px;
    text-transform: uppercase;
  }
  .order-status.pending { background: #ffaa0022; color: #ffaa00; border: 1px solid #ffaa0044; }
  .order-status.paid { background: #00ff8822; color: #00ff88; border: 1px solid #00ff8844; }

  .order-items { margin-bottom: 16px; }
  .order-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .order-item:last-child { border-bottom: none; }
  .item-info { flex: 1; }
  .item-title {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 2px;
  }
  .item-qty {
    font-size: 11px;
    color: var(--text2);
    font-family: var(--mono);
  }
  .item-price {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--green);
  }

  .order-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 16px;
    border-top: 2px solid var(--border);
    margin-top: 8px;
  }
  .order-total-label {
    font-size: 14px;
    color: var(--text2);
    font-family: var(--mono);
  }
  .order-total-value {
    font-family: var(--mono);
    font-size: 24px;
    font-weight: bold;
    color: var(--green);
  }

  .payment-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .section-title {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--cyan);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .wallet-address {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    word-break: break-all;
    margin-bottom: 8px;
    user-select: all;
  }
  .wallet-label {
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 4px;
    font-family: var(--mono);
  }
  .crypto-amount {
    font-family: var(--mono);
    font-size: 18px;
    color: var(--magenta);
    font-weight: bold;
    margin-bottom: 4px;
  }
  .memo-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 12px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    word-break: break-all;
    margin-bottom: 8px;
    user-select: all;
  }
  .memo-label {
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 4px;
    font-family: var(--mono);
  }
  .instructions {
    font-size: 12px;
    color: var(--text2);
    line-height: 1.6;
    margin-top: 12px;
    padding: 12px;
    background: var(--surface2);
    border-radius: 4px;
    border-left: 3px solid var(--cyan);
  }
  .instructions code {
    font-family: var(--mono);
    color: var(--cyan);
    background: var(--surface);
    padding: 2px 6px;
    border-radius: 2px;
  }

  .actions {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 10px 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
    text-decoration: none;
    display: inline-block;
    text-align: center;
  }
  .btn:hover { border-color: var(--cyan); color: var(--cyan); }
  .btn-primary {
    background: var(--cyan);
    color: var(--bg);
    border-color: var(--cyan);
    font-weight: bold;
  }
  .btn-primary:hover { background: transparent; color: var(--cyan); }
  .btn-magenta {
    background: transparent;
    border-color: var(--magenta);
    color: var(--magenta);
  }
  .btn-magenta:hover { background: var(--magenta); color: var(--bg); }

  .status-check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
  }
  .status-spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--cyan);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    display: none;
  }
  .status-spinner.active { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-text {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text2);
  }
  .status-text.confirmed { color: var(--green); }
  .status-text.failed { color: var(--magenta); }

  .back-link {
    display: inline-block;
    margin-top: 16px;
    color: var(--text2);
    font-size: 13px;
    text-decoration: none;
    font-family: var(--mono);
  }
  .back-link:hover { color: var(--cyan); }

  .env-badge {
    display: none;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text2);
    margin-left: 16px;
  }

  @media (max-width: 768px) {
    .container { padding: 16px; }
    .order-total-value { font-size: 20px; }
  }
</style>
</head>
<body data-page="checkout">

<header>
  <a data-link="/" class="logo">PAW<span>RADISE</span></a>
  <div style="display:flex;align-items:center;">
    <nav style="margin-right:24px;">
      <a data-link="/" data-nav="shop">SHOP</a>
      <a data-link="/community" data-nav="community">COMMUNITY</a>
      <a data-link="/account" data-nav="account">ACCOUNT</a>
    </nav>
    <button id="authBtn" style="background:transparent;border:1px solid var(--cyan);color:var(--cyan);font-family:var(--mono);font-size:12px;padding:6px 14px;border-radius:4px;cursor:pointer;margin-right:12px;letter-spacing:1px;">LOGIN</button>
    <span id="envBadge" class="env-badge"></span>
  </div>
</header>

<div class="container">
  <div class="page-title"><span style="color:var(--magenta)">/</span> checkout</div>

  <div id="checkoutContent">
    <div class="order-summary" id="orderSummary" style="display:none;">
      <div class="order-header">
        <span class="order-id" id="orderId"></span>
        <span class="order-status pending" id="orderStatus">PENDING PAYMENT</span>
      </div>
      <div class="order-items" id="orderItems"></div>
      <div class="order-total">
        <span class="order-total-label">TOTAL</span>
        <span class="order-total-value" id="orderTotal"></span>
      </div>
    </div>

    <div class="payment-section" id="paymentSection" style="display:none;">
      <div class="section-title">_ payment instructions</div>
      <div class="wallet-label">DESTINATION ADDRESS (BSC)</div>
      <div class="wallet-address" id="walletAddress"></div>
      <div class="crypto-amount" id="cryptoAmount"></div>
      <div class="memo-label">MEMO / TRANSACTION DATA</div>
      <div class="memo-box" id="memoBox"></div>
      <div class="instructions" id="instructions"></div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="checkPaymentBtn" style="display:none;" onclick="checkPayment()">CHECK PAYMENT STATUS</button>
      <a class="btn" data-link="/account" id="backToAccount">BACK TO ACCOUNT</a>
    </div>

    <div class="status-check" id="statusCheck" style="display:none;">
      <div class="status-spinner" id="statusSpinner"></div>
      <span class="status-text" id="statusText">checking blockchain...</span>
    </div>
  </div>

  <div id="loadingState">
    <div class="order-summary">
      <div style="text-align:center;padding:32px 0;color:var(--text2);">
        <div style="font-family:var(--mono);font-size:14px;color:var(--cyan);margin-bottom:8px;">loading order...</div>
        <div class="status-spinner active" style="margin:0 auto;"></div>
      </div>
    </div>
  </div>
</div>

<div style="border-top:1px solid var(--border);padding:16px;text-align:center;font-size:11px;color:var(--text2);font-family:var(--mono);">
  PAWRADISE &copy; 2026 — <span id="envText">production</span>
</div>

<script>
  const path = window.location.pathname;
  const isStaging = path.startsWith('/staging');
  const API_BASE = isStaging ? '/staging/api/v1' : '/api/v1';
  const LINK_BASE = isStaging ? '/staging' : '';
  // staging-aware nav links: data-link="/community" -> "/staging/community" on staging
  document.querySelectorAll('[data-link]').forEach(a => { a.href = LINK_BASE + a.getAttribute('data-link'); });
  // highlight current page in nav
  (function(){ const pg = document.body.getAttribute('data-page'); const el = document.querySelector('[data-nav="'+pg+'"]'); if(el) el.style.color = 'var(--cyan)'; })();
  // auth-aware LOGIN/LOGOUT button
  (function(){ const b=document.getElementById('authBtn'); if(!b) return;
    const t=localStorage.getItem('pawradise_token');
    if(t){ b.textContent='LOGOUT'; b.onclick=function(){ localStorage.removeItem('pawradise_token'); window.location.href=LINK_BASE+'/'; }; }
    else { b.textContent='LOGIN'; b.onclick=function(){ window.location.href=LINK_BASE+'/login?redirect='+encodeURIComponent(window.location.pathname+window.location.search); }; }
  })();
  document.getElementById('envBadge').textContent = isStaging ? 'ENV: staging' : 'ENV: production';
  document.getElementById('envText').textContent = isStaging ? 'staging' : 'production';

  const params = new URLSearchParams(window.location.search);
  const orderID = params.get('order');

  if (!orderID) {
    window.location.href = LINK_BASE + '/account';
  }

  let pollInterval = null;
  const POLL_INTERVAL_MS = 15000; // 15 seconds

  // Load order details
  async function loadOrder() {
    try {
      const res = await fetch(`${API_BASE}/orders/${orderID}`, {
        headers: { 'Authorization': 'Bearer ' + getToken() }
      });
      if (!res.ok) {
        if (res.status === 401) { window.location.href = LINK_BASE + '/login?redirect=' + encodeURIComponent(LINK_BASE + '/checkout?order=' + orderID); return; }
        if (res.status === 404) { showError('Order not found'); return; }
        throw new Error('Failed to load order');
      }
      const data = await res.json();
      renderOrder(data.order);
      loadPaymentInfo(data.order);
      // Start auto-polling if order is pending and not already paid
      if (data.order.status === 'pending') {
        startAutoPoll();
      }
    } catch (e) {
      console.error(e);
      showError('Failed to load order. <a href="'+LINK_BASE+'/account" style="color:var(--cyan)">back to account</a>');
    }
  }

  function startAutoPoll() {
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(async () => {
      try {
        const res = await fetch(`${API_BASE}/orders/${orderID}/status`, {
          headers: { 'Authorization': 'Bearer ' + getToken() }
        });
        if (!res.ok) return;
        const data = await res.json();
        if (data.status === 'paid') {
          clearInterval(pollInterval);
          pollInterval = null;
          // Show paid state - reload to refresh download buttons
          showAutoPollConfirmed(data);
        }
      } catch (e) {
        console.error('Auto-poll error:', e);
      }
    }, POLL_INTERVAL_MS);
    // Show polling indicator on first poll start
    showPollingActive();
  }

  function showPollingActive() {
    const statusCheck = document.getElementById('statusCheck');
    const statusText = document.getElementById('statusText');
    statusCheck.style.display = 'flex';
    statusText.textContent = 'auto-polling every ' + (POLL_INTERVAL_MS/1000) + 's — waiting for blockchain confirmation...';
    statusText.className = 'status-text';
    const spinner = document.getElementById('statusSpinner');
    if (spinner) spinner.classList.add('active');
  }

  function showAutoPollConfirmed(data) {
    const statusCheck = document.getElementById('statusCheck');
    const statusText = document.getElementById('statusText');
    const spinner = document.getElementById('statusSpinner');
    statusCheck.style.display = 'flex';
    statusText.textContent = 'PAYMENT CONFIRMED! (tx: ' + (data.payment_tx_hash ? data.payment_tx_hash.substring(0, 20) + '...' : 'n/a') + ')';
    statusText.className = 'status-text confirmed';
    if (spinner) spinner.classList.remove('active');
    // Reload page to show download buttons
    setTimeout(() => location.reload(), 3000);
  }

  function renderOrder(order) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('orderSummary').style.display = 'block';
    document.getElementById('paymentSection').style.display = 'block';

    document.getElementById('orderId').textContent = 'ORDER #' + order.id;
    const statusEl = document.getElementById('orderStatus');
    statusEl.textContent = order.status.toUpperCase();
    statusEl.className = 'order-status ' + order.status;

    const itemsHtml = order.items.map(item => `
      <div class="order-item">
        <div class="item-info">
          <div class="item-title">${escapeHtml(item.product.title)}</div>
          <div class="item-qty">qty: ${item.quantity}</div>
        </div>
        <div class="item-price">$${item.price_usd}</div>
      </div>
    `).join('');

    document.getElementById('orderItems').innerHTML = itemsHtml;
    document.getElementById('orderTotal').textContent = '$' + order.total_usd;
  }

  async function loadPaymentInfo(order) {
    if (order.status === 'paid') {
      document.getElementById('paymentSection').style.display = 'none';
      document.getElementById('checkPaymentBtn').style.display = 'none';
      showPaidState(order);
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/orders/${order.id}/payment`, {
        headers: { 'Authorization': 'Bearer ' + getToken() }
      });
      if (!res.ok) { return; }
      const payment = await res.json();
      renderPayment(payment);
    } catch (e) {
      console.error(e);
    }
  }

  function renderPayment(payment) {
    document.getElementById('walletAddress').textContent = payment.payment_address;
    document.getElementById('cryptoAmount').textContent = payment.amount_crypto + ' ' + payment.crypto_chain.toUpperCase();
    document.getElementById('memoBox').textContent = payment.memo;
    document.getElementById('instructions').innerHTML = `
      <strong>How to pay:</strong><br>
      1. Open your BSC-compatible wallet (MetaMask, Trust Wallet, etc.)<br>
      2. Send <code>${payment.amount_crypto}</code> BNB to <code>${payment.payment_address}</code><br>
      3. Include this memo in the transaction data: <code>${payment.memo}</code><br>
      4. Wait for confirmations, then click "Check Payment Status"<br><br>
      <em>Your order will be activated automatically once payment is confirmed.</em>
    `;
    document.getElementById('checkPaymentBtn').style.display = 'inline-block';
    document.getElementById('checkPaymentBtn').onclick = function() {
      // Manual check still works, but auto-poll is running
      checkPayment();
    };
  }

  function showPaidState(order) {
    document.getElementById('checkPaymentBtn').style.display = 'none';
    document.getElementById('paymentSection').style.display = 'none';
    document.getElementById('orderStatus').textContent = 'PAID';
    document.getElementById('orderStatus').className = 'order-status paid';

    const itemsHtml = order.items.map(item => `
      <div class="order-item">
        <div class="item-info">
          <div class="item-title">${escapeHtml(item.product.title)}</div>
          <div class="item-qty">qty: ${item.quantity} | downloads: ${item.download_count}/${item.max_downloads || 'unlimited'}</div>
        </div>
        <a class="btn btn-primary" href="${API_BASE}/orders/download/${item.id}" download>DOWNLOAD</a>
      </div>
    `).join('');

    document.getElementById('orderItems').innerHTML = itemsHtml;
  }

  function showError(msg) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('checkoutContent').innerHTML = `
      <div class="order-summary" style="text-align:center;padding:48px 0;">
        <div style="color:var(--magenta);font-family:var(--mono);margin-bottom:12px;">ERROR</div>
        ${msg}
      </div>
    `;
  }

  let checkInterval;

  async function checkPayment() {
    const spinner = document.getElementById('statusSpinner');
    const statusText = document.getElementById('statusText');
    spinner.classList.add('active');
    statusText.textContent = 'checking blockchain...';
    statusText.className = 'status-text';

    try {
      const res = await fetch(`${API_BASE}/orders/${orderID}/status`, {
        headers: { 'Authorization': 'Bearer ' + getToken() }
      });
      if (!res.ok) { throw new Error('check failed'); }
      const data = await res.json();

      if (data.status === 'paid') {
        statusText.textContent = 'PAYMENT CONFIRMED!';
        statusText.className = 'status-text confirmed';
        spinner.classList.remove('active');
        clearInterval(checkInterval);
        document.getElementById('checkPaymentBtn').style.display = 'none';
        // Reload to show download buttons
        setTimeout(() => location.reload(), 1500);
      } else {
        statusText.textContent = 'status: ' + data.status + ' (confirmations: ' + (data.payment_confirmations || 0) + ')';
        statusText.className = 'status-text';
      }
    } catch (e) {
      statusText.textContent = 'check failed — retry';
      statusText.className = 'status-text failed';
      spinner.classList.remove('active');
    }
  }

  function getToken() {
    return localStorage.getItem('pawradise_token') || '';
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  loadOrder();
</script>
</body>
</html>
