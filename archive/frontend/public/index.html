<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAWRADISE — Digital Asset Shop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --surface2: #1a1a2a;
    --border: #2a2a3a;
    --text: #e0e0e0;
    --text2: #8888aa;
    --cyan: #00d4ff;
    --magenta: #ff0066;
    --green: #00ff88;
    --mono: Consolas, 'Courier New', monospace;
    --sans: -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    line-height: 1.6;
  }
  .terminal-line {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    user-select: none;
  }
  .terminal-line .prompt { color: var(--cyan); }
  .terminal-line .cmd { color: var(--text); }
  .terminal-line .cursor {
    display: inline-block;
    width: 8px; height: 14px;
    background: var(--cyan);
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  header {
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: bold;
    color: var(--cyan);
    letter-spacing: 2px;
    text-decoration: none;
  }
  .logo span { color: var(--magenta); }
  nav { display: flex; gap: 24px; align-items: center; }
  nav a {
    color: var(--text2);
    text-decoration: none;
    font-size: 14px;
    transition: color 0.2s;
  }
  nav a:hover { color: var(--cyan); }
  .nav-link.active { color: var(--cyan); }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  .hero {
    text-align: center;
    padding: 48px 0 32px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }
  .hero h1 {
    font-family: var(--mono);
    font-size: 32px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .hero h1 span { color: var(--magenta); }
  .hero p {
    color: var(--text2);
    font-size: 14px;
    max-width: 500px;
    margin: 0 auto;
  }

  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .search-box {
    flex: 1;
    min-width: 200px;
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0 12px;
  }
  .search-box .icon {
    color: var(--text2);
    font-family: var(--mono);
    font-size: 14px;
  }
  .search-box input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 10px 8px;
    font-size: 14px;
    outline: none;
    font-family: var(--mono);
  }
  .search-box input::placeholder { color: var(--text2); }
  .search-box input:focus { color: var(--cyan); }

  .filter-tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    padding: 4px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }
  .filter-tab {
    padding: 8px 16px;
    border: none;
    background: transparent;
    color: var(--text2);
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .filter-tab:hover { color: var(--text); }
  .filter-tab.active {
    background: var(--cyan);
    color: var(--bg);
    font-weight: bold;
  }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .product-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
    cursor: pointer;
  }
  .product-card:hover {
    border-color: var(--cyan);
    transform: translateY(-2px);
  }
  .product-image {
    width: 100%;
    height: 160px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .product-image .placeholder {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text2);
    text-align: center;
    padding: 16px;
  }
  .product-body { padding: 12px 16px; }
  .product-category {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--cyan);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .product-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .product-desc {
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .product-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .product-price {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: bold;
    color: var(--green);
  }
  .btn-buy {
    padding: 6px 14px;
    background: transparent;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.2s;
  }
  .btn-buy:hover {
    background: var(--cyan);
    color: var(--bg);
  }

  .empty-state {
    text-align: center;
    padding: 48px 0;
    color: var(--text2);
  }
  .empty-state .icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.3;
  }

  .footer {
    border-top: 1px solid var(--border);
    padding: 24px;
    text-align: center;
    font-size: 12px;
    color: var(--text2);
    font-family: var(--mono);
  }

  .env-badge {
    display: none;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text2);
    margin-left: 16px;
  }

  @media (max-width: 768px) {
    .container { padding: 16px; }
    .hero h1 { font-size: 24px; }
    .controls { flex-direction: column; }
    .filter-tabs { overflow-x: auto; }
  }
</style>
</head>
<body data-page="shop">

<header>
  <a data-link="/" class="logo">PAW<span>RADISE</span></a>
  <div style="display:flex;align-items:center;">
    <nav style="margin-right:24px;">
      <a data-link="/" data-nav="shop">SHOP</a>
      <a data-link="/community" data-nav="community">COMMUNITY</a>
      <a data-link="/account" data-nav="account">ACCOUNT</a>
    </nav>
    <button id="authBtn" style="background:transparent;border:1px solid var(--cyan);color:var(--cyan);font-family:var(--mono);font-size:12px;padding:6px 14px;border-radius:4px;cursor:pointer;margin-right:12px;letter-spacing:1px;">LOGIN</button>
    <span id="envBadge" class="env-badge"></span>
  </div>
</header>

<div class="container">
  <div class="hero">
    <h1>DIGITAL <span>ASSET</span> SHOP</h1>
    <p>Download high-quality digital goods — code, design, audio, 3D models, and more. Pay with crypto. Instant delivery.</p>
  </div>

  <div class="controls">
    <div class="search-box">
      <span class="icon">&gt;_</span>
      <input type="text" id="searchInput" placeholder="search products..." autocomplete="off">
    </div>
    <div class="filter-tabs" id="categoryTabs">
      <button class="filter-tab active" data-category="">ALL</button>
    </div>
  </div>

  <div id="productGrid" class="product-grid">
    <div class="empty-state">
      <div class="icon">LOADING</div>
      <div>fetching products...</div>
    </div>
  </div>
</div>

<div class="footer">
  PAWRADISE &copy; 2026 — <span id="envText">production</span> environment
</div>

<script>
  // Detect environment and set API base URL
  const path = window.location.pathname;
  const isStaging = path.startsWith('/staging');
  const API_BASE = isStaging ? '/staging/api/v1' : '/api/v1';
  const LINK_BASE = isStaging ? '/staging' : '';
  // staging-aware nav links: data-link="/community" -> "/staging/community" on staging
  document.querySelectorAll('[data-link]').forEach(a => { a.href = LINK_BASE + a.getAttribute('data-link'); });
  // highlight current page in nav
  (function(){ const pg = document.body.getAttribute('data-page'); const el = document.querySelector('[data-nav="'+pg+'"]'); if(el) el.style.color = 'var(--cyan)'; })();
  // auth-aware LOGIN/LOGOUT button
  (function(){ const b=document.getElementById('authBtn'); if(!b) return;
    const t=localStorage.getItem('pawradise_token');
    if(t){ b.textContent='LOGOUT'; b.onclick=function(){ localStorage.removeItem('pawradise_token'); window.location.href=LINK_BASE+'/'; }; }
    else { b.textContent='LOGIN'; b.onclick=function(){ window.location.href=LINK_BASE+'/login?redirect='+encodeURIComponent(window.location.pathname+window.location.search); }; }
  })();

  // Update env badge
  document.getElementById('envBadge').textContent = isStaging ? 'ENV: staging' : 'ENV: production';
  document.getElementById('envText').textContent = isStaging ? 'staging' : 'production';

  // State
  let products = [];
  let categories = [];
  let currentCategory = '';
  let currentSearch = '';

  // DOM elements
  const grid = document.getElementById('productGrid');
  const searchInput = document.getElementById('searchInput');
  const categoryTabs = document.getElementById('categoryTabs');

  // Fetch products
  async function fetchProducts(category, search, page = 1, perPage = 12) {
    let url = `${API_BASE}/products?page=${page}&per_page=${perPage}`;
    if (category) url += `&category=${encodeURIComponent(category)}`;
    if (search) url += `&search=${encodeURIComponent(search)}`;

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Failed to fetch products');
      const data = await res.json();
      products = data.products || [];
      renderProducts(products);
      return data.total || 0;
    } catch (e) {
      grid.innerHTML = `<div class="empty-state"><div class="icon">ERR</div><div>Failed to load products. <button class="btn-buy" onclick="fetchProducts()">retry</button></div></div>`;
      console.error(e);
    }
  }

  // Fetch categories
  async function fetchCategories() {
    try {
      const res = await fetch(`${API_BASE}/categories`);
      if (!res.ok) throw new Error('Failed to fetch categories');
      const data = await res.json();
      categories = data.categories || [];

      // Build category tabs
      const tabs = categoryTabs.querySelectorAll('.filter-tab');
      tabs.forEach(t => { if (t.dataset.category !== '') t.remove(); });

      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-tab' + (cat.slug === currentCategory ? ' active' : '');
        btn.textContent = cat.name;
        btn.dataset.category = cat.slug;
        btn.onclick = () => {
          document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = cat.slug;
          fetchProducts(currentCategory, currentSearch);
        };
        categoryTabs.appendChild(btn);
      });
    } catch (e) {
      console.error(e);
    }
  }

  // Render products
  function renderProducts(products) {
    if (products.length === 0) {
      grid.innerHTML = `<div class="empty-state">
        <div class="icon">$(echo 'NO RESULTS')</div>
        <div>no products found${currentSearch ? ' for "' + currentSearch + '"' : ''}</div>
        <div style="margin-top:8px;font-size:11px;">try a different search or category</div>
      </div>`;
      return;
    }

    grid.innerHTML = products.map(p => {
      const primaryImage = (p.images && p.images.length > 0) ? p.images.find(i => i.is_primary) : null;
      const imgHtml = primaryImage
        ? `<img src="${primaryImage.url}" alt="${p.title}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
           <div class="placeholder" style="display:none">[${p.slug}]</div>`
        : `<div class="placeholder">${p.slug}</div>`;

      return `
        <div class="product-card" onclick="window.location.href=LINK_BASE+'/product/${p.slug}'">
          <div class="product-image">${imgHtml}</div>
          <div class="product-body">
            <div class="product-category">${p.category_name || 'uncategorized'}</div>
            <div class="product-title">${escapeHtml(p.title)}</div>
            <div class="product-desc">${escapeHtml(p.description)}</div>
            <div class="product-footer">
              <span class="product-price">$${p.price_usd}</span>
              <button class="btn-buy" onclick="event.stopPropagation();buyProduct('${p.slug}')">BUY</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // Buy product — go to detail page (order is created there after login)
  function buyProduct(slug) {
    window.location.href = LINK_BASE + '/product/' + slug;
  }

  // Check if user is logged in
  function isLoggedIn() {
    const token = localStorage.getItem('pawradise_token');
    return !!token;
  }

  // Search on input
  let searchTimeout;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      currentSearch = searchInput.value.trim();
      fetchProducts(currentCategory, currentSearch);
    }, 300);
  });

  // Init
  fetchCategories();
  fetchProducts();
</script>
</body>
</html>
