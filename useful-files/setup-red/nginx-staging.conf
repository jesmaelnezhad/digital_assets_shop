server {
    listen 80;
    server_name server-ad5ae8ea-5132-4cd3-b11f-5cb0f43bdc53.eu-west1-a.arvancompute.ir;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name server-ad5ae8ea-5132-4cd3-b11f-5cb0f43bdc53.eu-west1-a.arvancompute.ir;

    ssl_certificate     /etc/ssl/certs/pawradise.crt;
    ssl_certificate_key /etc/ssl/private/pawradise.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        proxy_pass http://127.0.0.1:30758;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control public;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:30758;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /staging/api/ {
        proxy_pass http://127.0.0.1:30758;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /auth/    { proxy_pass http://127.0.0.1:30758; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /shop/    { proxy_pass http://127.0.0.1:30758; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /product/ { proxy_pass http://127.0.0.1:30758; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /account/ { proxy_pass http://127.0.0.1:30758; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /checkout/{ proxy_pass http://127.0.0.1:30758; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /community/{ proxy_pass http://127.0.0.1:30758; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /admin/   { proxy_pass http://127.0.0.1:30758; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

    location / {
        proxy_pass http://127.0.0.1:30758;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
