server {
    listen 80;
    server_name server-ad5ae8ea-5132-4cd3-b11f-5cb0f43bdc53.eu-west1-a.arvancompute.ir pawradise.ir;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name server-ad5ae8ea-5132-4cd3-b11f-5cb0f43bdc53.eu-west1-a.arvancompute.ir pawradise.ir;

    ssl_certificate     /etc/ssl/certs/pawradise.crt;
    ssl_certificate_key /etc/ssl/private/pawradise.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    # Static assets - served from /var/www/production/assets/
    # Only matches /assets/ exactly (not /assetsomething)
    location ^~ /assets/ {
        alias /var/www/production/assets/;
        expires 30d;
        add_header Cache-Control public;
    }

    # Proxy everything to k3s ingress - domain-based routing inside k3s
    location / {
        proxy_pass http://127.0.0.1:30758;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }
}
