server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ============ 생산 페이지 (페이지당 하나의 위치) ============
    location = / { root /var/www/production; try_files /index.html =404; }
    location = /community { root /var/www/production; try_files /community.html =404; }
    location = /account { root /var/www/production; try_files /account.html =404; }
    location = /checkout { root /var/www/production; try_files /checkout.html =404; }
    location = /login { root /var/www/production; try_files /login.html =404; }
    location ~ ^/product/ { root /var/www/production; try_files /product.html =404; }
    location ~ ^/profile/ { root /var/www/production; try_files /profile.html =404; }
    location ~ ^/post/ { root /var/www/production; try_files /post.html =404; }

    # ============ 스테이지 페이지 (페이지당 하나의 위치) ============
    location = /staging { return 301 /staging/; }
    location = /staging/ { root /var/www/staging; try_files /index.html =404; }
    location = /staging/community { root /var/www/staging; try_files /community.html =404; }
    location = /staging/account { root /var/www/staging; try_files /account.html =404; }
    location = /staging/checkout { root /var/www/staging; try_files /checkout.html =404; }
    location = /staging/login { root /var/www/staging; try_files /login.html =404; }
    location ~ ^/staging/product/ { root /var/www/staging; try_files /product.html =404; }
    location ~ ^/staging/profile/ { root /var/www/staging; try_files /profile.html =404; }
    location ~ ^/staging/post/ { root /var/www/staging; try_files /post.html =404; }

    # ============ 생산 API 라우팅 (서비스 DNS 사용) ============
    # identity-service (port 8081)
    location /api/v1/register      { proxy_pass http://identity-service.staging.svc.cluster.local:8081/api/v1/register; }
    location /api/v1/login         { proxy_pass http://identity-service.staging.svc.cluster.local:8081/api/v1/login; }
    location /api/v1/logout        { proxy_pass http://identity-service.staging.svc.cluster.local:8081/api/v1/logout; }
    location /api/v1/me            { proxy_pass http://identity-service.staging.svc.cluster.local:8081/api/v1/me; }
    location /api/v1/profile       { proxy_pass http://identity-service.staging.svc.cluster.local:8081/api/v1/profile; }
    location /api/v1/profile/      { proxy_pass http://identity-service.staging.svc.cluster.local:8081/api/v1/profile/; }
    location /api/v1/referrals     { proxy_pass http://identity-service.staging.svc.cluster.local:8081/api/v1/referrals; }
    location /api/v1/commissions   { proxy_pass http://identity-service.staging.svc.cluster.local:8081/api/v1/commissions; }
    location /api/v1/referrals/track { proxy_pass http://identity-service.staging.svc.cluster.local:8081/api/v1/referrals/track; }
    location /api/v1/commissions/record { proxy_pass http://identity-service.staging.svc.cluster.local:8081/api/v1/commissions/record; }

    # product-service (port 8082)
    location /api/v1/products      { proxy_pass http://product-service.staging.svc.cluster.local:8082/api/v1/products; }
    location ~ ^/api/v1/products/  { proxy_pass http://product-service.staging.svc.cluster.local:8082; }
    location /api/v1/categories    { proxy_pass http://product-service.staging.svc.cluster.local:8082/api/v1/categories; }
    location /api/v1/bundles       { proxy_pass http://product-service.staging.svc.cluster.local:8082/api/v1/bundles; }
    location ~ ^/api/v1/bundles/   { proxy_pass http://product-service.staging.svc.cluster.local:8082; }
    location /api/v1/recommendations { proxy_pass http://product-service.staging.svc.cluster.local:8082/api/v1/recommendations; }
    location /api/v1/recommendations/ { proxy_pass http://product-service.staging.svc.cluster.local:8082/api/v1/recommendations/; }

    # commerce-service (port 8083)
    location /api/v1/guest-orders  { proxy_pass http://commerce-service.staging.svc.cluster.local:8083/api/v1/guest-orders; }
    location ~ ^/api/v1/guest-orders/ { proxy_pass http://commerce-service.staging.svc.cluster.local:8083; }
    location /api/v1/coupons       { proxy_pass http://commerce-service.staging.svc.cluster.local:8083/api/v1/coupons; }
    location ~ ^/api/v1/coupons/   { proxy_pass http://commerce-service.staging.svc.cluster.local:8083; }
    location /api/v1/orders        { proxy_pass http://commerce-service.staging.svc.cluster.local:8083/api/v1/orders; }
    location ~ ^/api/v1/orders/    { proxy_pass http://commerce-service.staging.svc.cluster.local:8083; }
    location /api/v1/cart          { proxy_pass http://commerce-service.staging.svc.cluster.local:8083/api/v1/cart; }
    location /api/v1/cart/items    { proxy_pass http://commerce-service.staging.svc.cluster.local:8083/api/v1/cart/items; }
    location ~ ^/api/v1/cart/items/ { proxy_pass http://commerce-service.staging.svc.cluster.local:8083; }
    location /api/v1/wishlist      { proxy_pass http://commerce-service.staging.svc.cluster.local:8083/api/v1/wishlist; }
    location /api/v1/wishlist/toggle { proxy_pass http://commerce-service.staging.svc.cluster.local:8083/api/v1/wishlist/toggle; }
    location /api/v1/recently-viewed { proxy_pass http://commerce-service.staging.svc.cluster.local:8083/api/v1/recently-viewed; }
    location /api/v1/compare       { proxy_pass http://commerce-service.staging.svc.cluster.local:8083/api/v1/compare; }
    location /api/v1/compare/toggle { proxy_pass http://commerce-service.staging.svc.cluster.local:8083/api/v1/compare/toggle; }

    # community-service (port 8084)
    location /api/v1/community/    { proxy_pass http://community-service.staging.svc.cluster.local:8084/api/v1/community/; }
    location /api/v1/profile       { proxy_pass http://community-service.staging.svc.cluster.local:8084/api/v1/profile; }
    location /api/v1/profile/      { proxy_pass http://community-service.staging.svc.cluster.local:8084/api/v1/profile/; }
    location ~ ^/api/v1/community/posts/ { proxy_pass http://community-service.staging.svc.cluster.local:8084; }
    location ~ ^/api/v1/community/users/ { proxy_pass http://community-service.staging.svc.cluster.local:8084; }
    location ~ ^/api/v1/community/follow/ { proxy_pass http://community-service.staging.svc.cluster.local:8084; }

    # review-service (port 8085)
    location /api/v1/reviews/      { proxy_pass http://review-service.staging.svc.cluster.local:8085/api/v1/reviews/; }
    location /api/v1/reviews       { proxy_pass http://review-service.staging.svc.cluster.local:8085/api/v1/reviews; }

    # payment-service (port 8086)
    location /api/v1/exchange-rates { proxy_pass http://payment-service.staging.svc.cluster.local:8086/api/v1/exchange-rates; }
    location /api/v1/exchange-rates/ { proxy_pass http://payment-service.staging.svc.cluster.local:8086/api/v1/exchange-rates/; }
    location /api/v1/payments/     { proxy_pass http://payment-service.staging.svc.cluster.local:8086/api/v1/payments/; }
    location /api/v1/settings      { proxy_pass http://payment-service.staging.svc.cluster.local:8086/api/v1/settings; }
    location /api/v1/settings/     { proxy_pass http://payment-service.staging.svc.cluster.local:8086/api/v1/settings/; }

    # admin-service (port 8087)
    location /api/v1/admin/        { proxy_pass http://admin-service.staging.svc.cluster.local:8087/api/v1/admin/; }

    # media-service (port 8088)
    location /api/v1/media/        { proxy_pass http://media-service.staging.svc.cluster.local:8088/api/v1/media/; }

    # ============ 스테이지 API 라우팅 (서비스 DNS 사용) ============
    # identity-service (port 8081)
    location /staging/api/v1/register      { proxy_pass http://identity-service.staging.svc.cluster.local:8081/api/v1/register; }
    location /staging/api/v1/login         { proxy_pass http://identity-service.staging.svc.cluster.local:8081/api/v1/login; }
    location /staging/api/v1/logout        { proxy_pass http://identity-service.staging.svc.cluster.local:8081/api/v1/logout; }
    location /staging/api/v1/me            { proxy_pass http://identity-service.staging.svc.cluster.local:8081/api/v1/me; }
    location /staging/api/v1/profile       { proxy_pass http://identity-service.staging.svc.cluster.local:8081/api/v1/profile; }
    location /staging/api/v1/profile/      { proxy_pass http://identity-service.staging.svc.cluster.local:8081/api/v1/profile/; }
    location /staging/api/v1/referrals     { proxy_pass http://identity-service.staging.svc.cluster.local:8081/api/v1/referrals; }
    location /staging/api/v1/commissions   { proxy_pass http://identity-service.staging.svc.cluster.local:8081/api/v1/commissions; }
    location /staging/api/v1/referrals/track { proxy_pass http://identity-service.staging.svc.cluster.local:8081/api/v1/referrals/track; }
    location /staging/api/v1/commissions/record { proxy_pass http://identity-service.staging.svc.cluster.local:8081/api/v1/commissions/record; }

    # product-service (port 8082)
    location /staging/api/v1/products      { proxy_pass http://product-service.staging.svc.cluster.local:8082/api/v1/products; }
    location ~ ^/staging/api/v1/products/  { proxy_pass http://product-service.staging.svc.cluster.local:8082; }
    location /staging/api/v1/categories    { proxy_pass http://product-service.staging.svc.cluster.local:8082/api/v1/categories; }
    location /staging/api/v1/bundles       { proxy_pass http://product-service.staging.svc.cluster.local:8082/api/v1/bundles; }
    location ~ ^/staging/api/v1/bundles/   { proxy_pass http://product-service.staging.svc.cluster.local:8082; }
    location /staging/api/v1/recommendations { proxy_pass http://product-service.staging.svc.cluster.local:8082/api/v1/recommendations; }
    location /staging/api/v1/recommendations/ { proxy_pass http://product-service.staging.svc.cluster.local:8082/api/v1/recommendations/; }

    # commerce-service (port 8083)
    location /staging/api/v1/guest-orders  { proxy_pass http://commerce-service.staging.svc.cluster.local:8083/api/v1/guest-orders; }
    location ~ ^/staging/api/v1/guest-orders/ { proxy_pass http://commerce-service.staging.svc.cluster.local:8083; }
    location /staging/api/v1/coupons       { proxy_pass http://commerce-service.staging.svc.cluster.local:8083/api/v1/coupons; }
    location ~ ^/staging/api/v1/coupons/   { proxy_pass http://commerce-service.staging.svc.cluster.local:8083; }
    location /staging/api/v1/orders        { proxy_pass http://commerce-service.staging.svc.cluster.local:8083/api/v1/orders; }
    location ~ ^/staging/api/v1/orders/    { proxy_pass http://commerce-service.staging.svc.cluster.local:8083; }
    location /staging/api/v1/cart          { proxy_pass http://commerce-service.staging.svc.cluster.local:8083/api/v1/cart; }
    location /staging/api/v1/cart/items    { proxy_pass http://commerce-service.staging.svc.cluster.local:8083/api/v1/cart/items; }
    location ~ ^/staging/api/v1/cart/items/ { proxy_pass http://commerce-service.staging.svc.cluster.local:8083; }
    location /staging/api/v1/wishlist      { proxy_pass http://commerce-service.staging.svc.cluster.local:8083/api/v1/wishlist; }
    location /staging/api/v1/wishlist/toggle { proxy_pass http://commerce-service.staging.svc.cluster.local:8083/api/v1/wishlist/toggle; }
    location /staging/api/v1/recently-viewed { proxy_pass http://commerce-service.staging.svc.cluster.local:8083/api/v1/recently-viewed; }
    location /staging/api/v1/compare       { proxy_pass http://commerce-service.staging.svc.cluster.local:8083/api/v1/compare; }
    location /staging/api/v1/compare/toggle { proxy_pass http://commerce-service.staging.svc.cluster.local:8083/api/v1/compare/toggle; }

    # community-service (port 8084)
    location /staging/api/v1/community/    { proxy_pass http://community-service.staging.svc.cluster.local:8084/api/v1/community/; }
    location /staging/api/v1/profile       { proxy_pass http://community-service.staging.svc.cluster.local:8084/api/v1/profile; }
    location /staging/api/v1/profile/      { proxy_pass http://community-service.staging.svc.cluster.local:8084/api/v1/profile/; }
    location ~ ^/staging/api/v1/community/posts/ { proxy_pass http://community-service.staging.svc.cluster.local:8084; }
    location ~ ^/staging/api/v1/community/users/ { proxy_pass http://community-service.staging.svc.cluster.local:8084; }
    location ~ ^/staging/api/v1/community/follow/ { proxy_pass http://community-service.staging.svc.cluster.local:8084; }

    # review-service (port 8085)
    location /staging/api/v1/reviews/      { proxy_pass http://review-service.staging.svc.cluster.local:8085/api/v1/reviews/; }
    location /staging/api/v1/reviews       { proxy_pass http://review-service.staging.svc.cluster.local:8085/api/v1/reviews; }

    # payment-service (port 8086)
    location /staging/api/v1/exchange-rates { proxy_pass http://payment-service.staging.svc.cluster.local:8086/api/v1/exchange-rates; }
    location /staging/api/v1/exchange-rates/ { proxy_pass http://payment-service.staging.svc.cluster.local:8086/api/v1/exchange-rates/; }
    location /staging/api/v1/payments/     { proxy_pass http://payment-service.staging.svc.cluster.local:8086/api/v1/payments/; }
    location /staging/api/v1/settings      { proxy_pass http://payment-service.staging.svc.cluster.local:8086/api/v1/settings; }
    location /staging/api/v1/settings/     { proxy_pass http://payment-service.staging.svc.cluster.local:8086/api/v1/settings/; }

    # admin-service (port 8087)
    location /staging/api/v1/admin/        { proxy_pass http://admin-service.staging.svc.cluster.local:8087/api/v1/admin/; }

    # media-service (port 8088)
    location /staging/api/v1/media/        { proxy_pass http://media-service.staging.svc.cluster.local:8088/api/v1/media/; }

    # ============ 헬시 체크 ============
    location = /health { proxy_pass http://identity-service.staging.svc.cluster.local:8081/health; }
    location = /staging/health { proxy_pass http://identity-service.staging.svc.cluster.local:8081/health; }

    # ============ 공통 프록시 설정 ============
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
