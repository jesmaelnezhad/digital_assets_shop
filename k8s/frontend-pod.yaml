apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-pod
  namespace: pawradise
  labels:
    app: frontend-pod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-pod
  template:
    metadata:
      labels:
        app: frontend-pod
    spec:
      containers:
      # ---- Shell MFE (port 3001) ----
      - name: shell
        image: registry.local/pawradise-shell:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        env:
        - name: BACKEND_URL
          value: http://backend-pod.pawradise.svc.cluster.local
        - name: ENV
          value: "production"
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
      # ---- Shop MFE (port 3002) ----
      - name: shop
        image: registry.local/pawradise-shop:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3002
        env:
        - name: BACKEND_URL
          value: http://backend-pod.pawradise.svc.cluster.local
        - name: ENV
          value: "production"
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 3002
          initialDelaySeconds: 5
          periodSeconds: 10
      # ---- Product Detail MFE (port 3003) ----
      - name: product-detail
        image: registry.local/pawradise-product-detail:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3003
        env:
        - name: BACKEND_URL
          value: http://backend-pod.pawradise.svc.cluster.local
        - name: ENV
          value: "production"
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 3003
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 3003
          initialDelaySeconds: 5
          periodSeconds: 10
      # ---- Community MFE (port 3004) ----
      - name: community
        image: registry.local/pawradise-community:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3004
        env:
        - name: BACKEND_URL
          value: http://backend-pod.pawradise.svc.cluster.local
        - name: ENV
          value: "production"
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 3004
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 3004
          initialDelaySeconds: 5
          periodSeconds: 10
      # ---- Account MFE (port 3005) ----
      - name: account
        image: registry.local/pawradise-account:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3005
        env:
        - name: BACKEND_URL
          value: http://backend-pod.pawradise.svc.cluster.local
        - name: ENV
          value: "production"
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 3005
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 3005
          initialDelaySeconds: 5
          periodSeconds: 10
      # ---- Checkout MFE (port 3006) ----
      - name: checkout
        image: registry.local/pawradise-checkout:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3006
        env:
        - name: BACKEND_URL
          value: http://backend-pod.pawradise.svc.cluster.local
        - name: ENV
          value: "production"
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 3006
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 3006
          initialDelaySeconds: 5
          periodSeconds: 10
      # ---- Auth MFE (port 3007) ----
      - name: auth
        image: registry.local/pawradise-auth:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3007
        env:
        - name: BACKEND_URL
          value: http://backend-pod.pawradise.svc.cluster.local
        - name: ENV
          value: "production"
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 3007
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 3007
          initialDelaySeconds: 5
          periodSeconds: 10
      # ---- Admin MFE (port 3008) ----
      - name: admin
        image: registry.local/pawradise-admin-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3008
        env:
        - name: BACKEND_URL
          value: http://backend-pod.pawradise.svc.cluster.local
        - name: ENV
          value: "production"
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 3008
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 3008
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-pod
  namespace: pawradise
spec:
  ports:
  - name: shell
    port: 3001
    targetPort: 3001
  - name: shop
    port: 3002
    targetPort: 3002
  - name: product-detail
    port: 3003
    targetPort: 3003
  - name: community
    port: 3004
    targetPort: 3004
  - name: account
    port: 3005
    targetPort: 3005
  - name: checkout
    port: 3006
    targetPort: 3006
  - name: auth
    port: 3007
    targetPort: 3007
  - name: admin
    port: 3008
    targetPort: 3008
  selector:
    app: frontend-pod
  type: ClusterIP
