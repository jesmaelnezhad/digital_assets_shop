apiVersion: v1
kind: Namespace
metadata:
  name: database
  labels:
    name: database
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: database
type: Opaque
stringData:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: store4bots_db_password_2026
  POSTGRES_DB: store4bots
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: database
data:
  init-logical-dbs.sql: |
    -- Identity Service
    CREATE DATABASE appdb_identity_staging;
    CREATE DATABASE appdb_identity_production;
    -- Product Service
    CREATE DATABASE appdb_product_staging;
    CREATE DATABASE appdb_product_production;
    -- Commerce Service
    CREATE DATABASE appdb_commerce_staging;
    CREATE DATABASE appdb_commerce_production;
    -- Community Service
    CREATE DATABASE appdb_community_staging;
    CREATE DATABASE appdb_community_production;
    -- Review Service
    CREATE DATABASE appdb_review_staging;
    CREATE DATABASE appdb_review_production;
    -- Payment Service
    CREATE DATABASE appdb_payment_staging;
    CREATE DATABASE appdb_payment_production;
    -- Admin Service
    CREATE DATABASE appdb_admin_staging;
    CREATE DATABASE appdb_admin_production;
    -- Media Service
    CREATE DATABASE appdb_media_staging;
    CREATE DATABASE appdb_media_production;
    -- Grant access to app user for all logical databases
    DO $$
    DECLARE
        r RECORD;
    BEGIN
        FOR r IN SELECT datname FROM pg_database WHERE datname LIKE 'appdb_%' LOOP
            EXECUTE format('GRANT ALL PRIVILEGES ON DATABASE %I TO app', r.datname);
        END LOOP;
    END $$;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: docker.io/library/postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "app"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "app"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: init-scripts
        configMap:
          name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: database
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
  type: ClusterIP
