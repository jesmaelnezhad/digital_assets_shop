apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: store4bots
  labels:
    app: admin-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      containers:
      - name: admin-service
        image: registry.local/store4bots-admin-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8087
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: store4bots-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: store4bots-config
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: store4bots-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: store4bots-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          value: "admin_db"
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: store4bots-config
              key: REDIS_HOST
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: store4bots-secrets
              key: ADMIN_TOKEN
        - name: IDENTITY_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: store4bots-config
              key: IDENTITY_SERVICE_URL
        - name: PRODUCT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: store4bots-config
              key: PRODUCT_SERVICE_URL
        - name: COMMERCE_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: store4bots-config
              key: COMMERCE_SERVICE_URL
        - name: COMMUNITY_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: store4bots-config
              key: COMMUNITY_SERVICE_URL
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: store4bots-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8087
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8087
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: store4bots
spec:
  ports:
  - port: 8087
    targetPort: 8087
  selector:
    app: admin-service
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: admin-service-hpa
  namespace: store4bots
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: admin-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
