apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: store4bots
  labels:
    app: media-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
    spec:
      containers:
      - name: media-service
        image: registry.local/store4bots-media-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8088
        env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: store4bots-config
              key: REDIS_HOST
        - name: PRODUCT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: store4bots-config
              key: PRODUCT_SERVICE_URL
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: store4bots-config
              key: LOG_LEVEL
        volumeMounts:
        - name: media-storage
          mountPath: /data
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8088
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8088
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: media-storage
        persistentVolumeClaim:
          claimName: media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: store4bots
spec:
  ports:
  - port: 8088
    targetPort: 8088
  selector:
    app: media-service
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: media-service-hpa
  namespace: store4bots
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: media-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-pvc
  namespace: store4bots
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
