apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pawradise-ingress
  namespace: pawradise
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/rate-limit: "100"
spec:
  rules:
  - host: pawradise.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: shell-mfe
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pawradise-ingress-api
  namespace: pawradise
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: api.pawradise.local
    http:
      paths:
      - path: /identity
        pathType: Prefix
        backend:
          service:
            name: identity-service
            port:
              number: 8081
      - path: /products
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 8082
      - path: /orders
        pathType: Prefix
        backend:
          service:
            name: commerce-service
            port:
              number: 8083
      - path: /cart
        pathType: Prefix
        backend:
          service:
            name: commerce-service
            port:
              number: 8083
      - path: /community
        pathType: Prefix
        backend:
          service:
            name: community-service
            port:
              number: 8084
      - path: /reviews
        pathType: Prefix
        backend:
          service:
            name: review-service
            port:
              number: 8085
      - path: /payments
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 8086
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: admin-service
            port:
              number: 8087
      - path: /media
        pathType: Prefix
        backend:
          service:
            name: media-service
            port:
              number: 8088
