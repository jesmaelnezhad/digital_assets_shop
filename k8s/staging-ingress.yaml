apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-staging
  namespace: staging
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: $1
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # Identity Service (8081)
      - path: /staging(/api/v1/register.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: identity-service
            port:
              number: 80
      - path: /staging(/api/v1/login.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: identity-service
            port:
              number: 80
      - path: /staging(/api/v1/logout.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: identity-service
            port:
              number: 80
      - path: /staging(/api/v1/me.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: identity-service
            port:
              number: 80
      - path: /staging(/api/v1/profile.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: identity-service
            port:
              number: 80
      - path: /staging(/api/v1/referrals.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: identity-service
            port:
              number: 80
      - path: /staging(/api/v1/commissions.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: identity-service
            port:
              number: 80
      - path: /staging(/api/v1/referrals/track.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: identity-service
            port:
              number: 80
      - path: /staging(/api/v1/commissions/record.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: identity-service
            port:
              number: 80
      # Product Service (8082)
      - path: /staging(/api/v1/products.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: product-service
            port:
              number: 80
      - path: /staging(/api/v1/categories.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: product-service
            port:
              number: 80
      - path: /staging(/api/v1/bundles.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: product-service
            port:
              number: 80
      - path: /staging(/api/v1/recommendations.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: product-service
            port:
              number: 80
      # Commerce Service (8083)
      - path: /staging(/api/v1/guest-orders.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: commerce-service
            port:
              number: 80
      - path: /staging(/api/v1/coupons.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: commerce-service
            port:
              number: 80
      - path: /staging(/api/v1/orders.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: commerce-service
            port:
              number: 80
      - path: /staging(/api/v1/cart.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: commerce-service
            port:
              number: 80
      - path: /staging(/api/v1/cart/items.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: commerce-service
            port:
              number: 80
      - path: /staging(/api/v1/wishlist.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: commerce-service
            port:
              number: 80
      - path: /staging(/api/v1/wishlist/toggle.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: commerce-service
            port:
              number: 80
      - path: /staging(/api/v1/recently-viewed.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: commerce-service
            port:
              number: 80
      - path: /staging(/api/v1/compare.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: commerce-service
            port:
              number: 80
      - path: /staging(/api/v1/compare/toggle.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: commerce-service
            port:
              number: 80
      # Community Service (8084)
      - path: /staging(/api/v1/community/.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: community-service
            port:
              number: 80
      # Review Service (8085)
      - path: /staging(/api/v1/reviews.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: review-service
            port:
              number: 80
      # Payment Service (8086)
      - path: /staging(/api/v1/exchange-rates.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: payment-service
            port:
              number: 80
      - path: /staging(/api/v1/payments/.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: payment-service
            port:
              number: 80
      - path: /staging(/api/v1/settings.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: payment-service
            port:
              number: 80
      # Admin Service (8087)
      - path: /staging(/api/v1/admin/.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: admin-service
            port:
              number: 80
      # Media Service (8088)
      - path: /staging(/api/v1/media/.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: media-service
            port:
              number: 80
      # Health check
      - path: /staging(/api/v1/health.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: identity-service
            port:
              number: 80
