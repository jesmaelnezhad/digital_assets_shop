      paths:
      # Production routes (no rewrite)
      - path: /api/v1/register(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: identity-service
            port:
              number: 80
          namespace: production
      - path: /api/v1/login(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: identity-service
            port:
              number: 80
          namespace: production
      - path: /api/v1/logout(/|$)(.*)
