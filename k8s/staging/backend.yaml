apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: registry.local/pawradise-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          value: "postgres://app:app_password@postgres.database:5432/appdb_staging?sslmode=disable"
        - name: JWT_SECRET
          value: "staging-secret-key-change-in-production"
        - name: ADMIN_ENABLED
          value: "true"
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      dnsConfig:
        searches:
        - database.svc.cluster.local
        - svc.cluster.local
        - cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: staging
spec:
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30083
  selector:
    app: backend
  type: NodePort
