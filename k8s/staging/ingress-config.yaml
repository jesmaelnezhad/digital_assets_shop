apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-nginx-config
  namespace: staging
data:
  default.conf: |
    upstream backend_staging {
      server backend.staging.svc.cluster.local:8080;
    }
    upstream backend_production {
      server backend.production.svc.cluster.local:8080;
    }
    upstream frontend_staging {
      server frontend.staging.svc.cluster.local:80;
    }
    upstream frontend_production {
      server frontend.production.svc.cluster.local:80;
    }
    server {
      listen 80 default_server;
      listen [::]:80 default_server;
      server_name _;

      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;

      # Production frontend
      location / {
        root /usr/share/nginx/prod;
        try_files $uri $uri/ /index.html;
      }

      # Production API
      location /api/v1/ {
        proxy_pass http://backend_production/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
      }

      # Production Admin API
      location /api/v1/admin/ {
        proxy_pass http://backend_production/api/v1/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
      }

      # Production Admin UI
      location = /admin {
        root /usr/share/nginx/prod;
        try_files /admin.html =404;
      }

      # Staging prefix
      location /staging/ {
        rewrite ^/staging/(.*) /$1 break;
        proxy_pass http://frontend_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      # Staging API
      location /staging/api/v1/ {
        rewrite ^/staging/api/v1/(.*) /api/v1/$1 break;
        proxy_pass http://backend_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
      }

      # Staging Admin API
      location /staging/api/v1/admin/ {
        rewrite ^/staging/api/v1/admin/(.*) /api/v1/admin/$1 break;
        proxy_pass http://backend_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
      }

      # Staging Admin UI
      location = /staging/admin {
        rewrite ^/staging/admin(.*) /admin.html break;
        proxy_pass http://frontend_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location = /health {
        return 200 "OK";
        add_header Content-Type text/plain;
      }
    }
