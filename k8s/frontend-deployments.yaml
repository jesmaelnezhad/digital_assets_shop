# Frontend K8s Manifests
# One Deployment + Service per MFE, per namespace (production + staging)

---
# Auth MFE - Production
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-mfe
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-mfe
      namespace: production
  template:
    metadata:
      labels:
        app: auth-mfe
        namespace: production
    spec:
      containers:
      - name: auth-mfe
        image: server-ad5ae8ea-5132-4cd3-b11f-5cb0f43bdc53.eu-west1-a.arvancompute.ir/store4bots/auth-mfe:latest
        ports:
        - containerPort: 80
        env:
        - name: API_BASE
          value: "/api/v1"
        - name: IS_STAGING
          value: "false"
        - name: ENV_NAME
          value: "production"
        resources:
          limits:
            cpu: 50m
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-mfe
  namespace: production
spec:
  selector:
    app: auth-mfe
    namespace: production
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP

---
