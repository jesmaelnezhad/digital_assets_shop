apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
      - name: identity-service
        image: 130.185.123.156:30099/pawradise/identity-service:latest
        ports:
        - containerPort: 8081
        env:
        - name: PORT
          value: "8081"
        - name: DB_HOST
          value: "130.185.123.156"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "app"
        - name: DB_PASSWORD
          value: "CHANGE_ME_IN_PRODUCTION"
        - name: DB_NAME
          value: "appdb_identity_staging"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: pawradise-secrets
              key: JWT_SECRET
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: staging
spec:
  selector:
    app: identity-service
  ports:
  - port: 8081
    targetPort: 8081
  type: ClusterIP
---
