            port:
              number: 8084
      # === Review Service ===
      - path: /api/v1/reviews
        pathType: Prefix
        backend:
          service:
            name: review-service
            port:
              number: 8085
      # === Payment Service ===
      - path: /api/v1/exchange-rates
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 8086
      - path: /api/v1/payments
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 8086
      - path: /api/v1/settings
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 8086
      # === Admin Service ===
      - path: /api/v1/admin
        pathType: Prefix
        backend:
          service:
            name: admin-service
            port:
              number: 8087
      # === Media Service ===
      - path: /api/v1/media
        pathType: Prefix
