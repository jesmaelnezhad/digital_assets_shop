apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-pod
  namespace: staging
  labels:
    app: backend-pod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-pod
  template:
    metadata:
      labels:
        app: backend-pod
    spec:
      containers:
      # ---- Identity Service (port 8081) ----
      - name: identity-service
        image: 194.5.206.106:30099/pawradise-identity-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
        - name: PORT
          value: "8081"
        - name: DB_HOST
          value: postgres.database.svc.cluster.local
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: app
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: DB_NAME
          value: "appdb_identity_staging"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: pawradise-secrets
              key: JWT_SECRET
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: pawradise-secrets
              key: ADMIN_TOKEN
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
      # ---- Product Service (port 8082) ----
      - name: product-service
        image: 194.5.206.106:30099/pawradise-product-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
        env:
        - name: PORT
          value: "8082"
        - name: DB_HOST
          value: postgres.database.svc.cluster.local
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: app
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: DB_NAME
          value: "appdb_product_staging"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: pawradise-secrets
              key: JWT_SECRET
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: pawradise-secrets
              key: ADMIN_TOKEN
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 10
