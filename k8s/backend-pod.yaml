apiVersion: v1
kind: Service
metadata:
  name: backend-pod
  namespace: staging
spec:
  ports:
  - name: identity
    port: 8081
    targetPort: 8081
  - name: product
    port: 8082
    targetPort: 8082
  - name: commerce
    port: 8083
    targetPort: 8083
  - name: community
    port: 8084
    targetPort: 8084
  - name: review
    port: 8085
    targetPort: 8085
  - name: payment
    port: 8086
    targetPort: 8086
  - name: admin
    port: 8087
    targetPort: 8087
  - name: media
    port: 8088
    targetPort: 8088
  selector:
    app: backend-pod
  type: ClusterIP
