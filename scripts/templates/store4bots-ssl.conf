# Rendered by scripts/install-host-nginx.sh from config/site.env.
# Installed on RED as /etc/nginx/sites-available/store4bots-ssl.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ${STAGING_HOST} ${PRODUCTION_HOST};
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Staging — proxy ALL traffic to ingress-nginx (including /assets/, /registry, /v2).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${STAGING_HOST};

    ssl_certificate     /etc/letsencrypt/live/${STAGING_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${STAGING_HOST}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_connect_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:${INGRESS_HTTP_NODEPORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
    }
}

# Production — app via ingress; optional disk /assets/.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${PRODUCTION_HOST};

    ssl_certificate     /etc/letsencrypt/live/${PRODUCTION_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${PRODUCTION_HOST}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 32m;

    location /assets/ {
        alias /var/www/production/assets/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:${INGRESS_HTTP_NODEPORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
