<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAWRADISE — Account</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0a0a0f; --surface:#14141f; --surface2:#1a1a2a;
    --border:#2a2a3a; --text:#e0e0e0; --text2:#8888aa;
    --cyan:#00d4ff; --magenta:#ff0066; --green:#00ff88;
    --mono:Consolas,'Courier New',monospace;
    --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; line-height:1.6; }
  .header {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 24px; background:var(--surface);
    border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100;
    box-shadow:0 0 20px rgba(0,212,255,0.05);
  }
  .logo {
    font-family:var(--mono); font-size:20px; font-weight:bold;
    color:var(--cyan); letter-spacing:2px; text-decoration:none;
    text-shadow:0 0 10px rgba(0,212,255,0.5);
  }
  .logo span { color:var(--magenta); text-shadow:0 0 10px rgba(255,0,102,0.5); }
  .header nav { display:flex; gap:24px; align-items:center; }
  .header nav a {
    color:var(--text2); text-decoration:none; font-size:13px;
    font-family:var(--mono); transition:color 0.2s; letter-spacing:1px;
  }
  .header nav a:hover { color:var(--cyan); text-shadow:0 0 8px rgba(0,212,255,0.5); }
  .header nav a.active { color:var(--cyan); }
  .auth-btn {
    background:transparent; border:1px solid var(--cyan); color:var(--cyan);
    font-family:var(--mono); font-size:12px; padding:6px 14px;
    border-radius:4px; cursor:pointer; letter-spacing:1px; transition:all 0.2s;
  }
  .auth-btn:hover { background:var(--cyan); color:var(--bg); }
  .terminal-line {
    font-family:var(--mono); font-size:11px; color:var(--text2);
    padding:8px 16px; border-bottom:1px solid var(--border); background:var(--surface);
  }
  .terminal-line .prompt { color:var(--cyan); }
  .container { max-width:960px; margin:0 auto; padding:32px 24px; }
  .tabs { display:flex; gap:4px; margin-bottom:24px; flex-wrap:wrap; }
  .tab {
    padding:10px 18px; background:var(--surface); border:1px solid var(--border);
    color:var(--text2); font-family:var(--mono); font-size:11px; cursor:pointer;
    border-radius:4px; transition:all 0.2s; letter-spacing:1px;
  }
  .tab:hover { color:var(--text); }
  .tab.active { background:var(--cyan); color:var(--bg); font-weight:bold; border-color:var(--cyan); }
  .profile-card {
    background:var(--surface); border:1px solid var(--border); border-radius:6px;
    padding:24px; margin-bottom:24px;
  }
  .profile-avatar {
    width:64px; height:64px; border-radius:50%; background:var(--surface2);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:24px; color:var(--cyan); margin-bottom:16px;
  }
  .profile-info { display:grid; grid-template-columns:auto 1fr; gap:8px 16px; align-items:center; }
  .profile-info .label { font-family:var(--mono); font-size:11px; color:var(--text2); text-transform:uppercase; letter-spacing:1px; }
  .profile-info .value { font-size:14px; color:var(--text); }
  .profile-info .edit { font-size:11px; color:var(--cyan); cursor:pointer; font-family:var(--mono); }
  .profile-info .edit:hover { text-decoration:underline; }
  .section { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:20px; margin-bottom:16px; }
  .section-title { font-family:var(--mono); font-size:11px; color:var(--cyan); text-transform:uppercase; letter-spacing:2px; margin-bottom:16px; padding-bottom:8px; border-bottom:1px solid var(--border); }
  table { width:100%; border-collapse:collapse; font-family:var(--sans); }
  th { font-family:var(--mono); font-size:11px; color:var(--text2); text-align:left; padding:8px 12px; border-bottom:1px solid var(--border); text-transform:uppercase; letter-spacing:1px; }
  td { padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; }
  tr:hover { background:var(--surface2); }
  .status-badge { font-family:var(--mono); font-size:10px; padding:2px 8px; border-radius:3px; border:1px solid; letter-spacing:1px; }
  .status-badge.completed { color:var(--green); border-color:var(--green); }
  .status-badge.pending { color:var(--cyan); border-color:var(--cyan); }
  .status-badge.failed { color:var(--magenta); border-color:var(--magenta); }
  .actions { font-family:var(--mono); font-size:11px; color:var(--cyan); cursor:pointer; }
  .actions:hover { text-decoration:underline; }
  .empty-state { text-align:center; padding:40px 0; color:var(--text2); font-family:var(--mono); font-size:12px; }
  .footer { border-top:1px solid var(--border); padding:16px; text-align:center; font-size:11px; color:var(--text2); font-family:var(--mono); }
  .error-msg { color:var(--magenta); font-family:var(--mono); font-size:12px; padding:10px 12px; background:rgba(255,0,102,0.08); border:1px solid var(--magenta); border-radius:4px; margin-bottom:12px; }
  @media (max-width:768px) { .container { padding:16px; } }
</style>
</head>
<body>

<div class="terminal-line"><span class="prompt">user@pawradise</span>:<span>~</span>$ ./account --view<span class="cursor"></span></div>

<header class="header">
  <a href="/" class="logo">PAW<span>RADISE</span></a>
  <nav style="margin-right:24px;">
    <a href="/" data-nav="shop">SHOP</a>
    <a href="/community" data-nav="community">COMMUNITY</a>
    <a href="/account" data-nav="account" class="active">ACCOUNT</a>
  </nav>
</header>

<div class="container">
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="profile" onclick="switchTab('profile')">PROFILE</button>
    <button class="tab" data-tab="orders" onclick="switchTab('orders')">ORDERS</button>
    <button class="tab" data-tab="downloads" onclick="switchTab('downloads')">DOWNLOADS</button>
  </div>

  <div id="panelProfile" class="panel">
    <div class="profile-card">
      <div class="profile-avatar" id="avatarInitial">?</div>
      <div class="profile-info">
        <span class="label">name</span>
        <span class="value" id="uName">—</span>
        <span class="label">email</span>
        <span class="value" id="uEmail">—</span>
        <span class="label">member since</span>
        <span class="value" id="uSince">—</span>
        <span class="label">wallet address</span>
        <span class="value" id="uWallet" style="font-family:var(--mono);font-size:11px;">—</span>
      </div>
      <button class="auth-btn" style="margin-top:16px;" onclick="logout()">LOGOUT</button>
    </div>
  </div>

  <div id="panelOrders" class="panel" style="display:none;">
    <div class="section">
      <div class="section-title">ORDER HISTORY</div>
      <div id="ordersTable">
        <table id="ordersRows">
          <thead>
            <tr><th>ORDER</th><th>DATE</th><th>TOTAL</th><th>STATUS</th><th>ACTIONS</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="noOrders" class="empty-state" style="display:none;">no orders yet</div>
    </div>
  </div>

  <div id="panelDownloads" class="panel" style="display:none;">
    <div class="section">
      <div class="section-title">DOWNLOADS</div>
      <div id="downloadsList"></div>
      <div id="noDownloads" class="empty-state" style="display:none;">no downloads yet</div>
    </div>
  </div>
</div>

<div class="footer">PAWRADISE &copy; 2026</div>

<script>
(function() {
  var path = window.location.pathname;
  var isStaging = path.startsWith('/staging');
  var API_BASE = isStaging ? '/staging/api/v1' : '/api/v1';
  var currentTab = 'profile';

  // Auth button in header
  document.getElementById('authBtn').textContent = 'LOGOUT';
  document.getElementById('authBtn').onclick = function() { logout(); };

  function getToken() { return localStorage.getItem('pawradise_token') || ''; }
  function isLoggedIn() { return !!getToken(); }

  function escapeHtml(t) { var d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

  function logout() {
    localStorage.removeItem('pawradise_token');
    window.location.href = '/';
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.dataset.tab === tab); });
    document.getElementById('panelProfile').style.display = tab === 'profile' ? 'block' : 'none';
    document.getElementById('panelOrders').style.display = tab === 'orders' ? 'block' : 'none';
    document.getElementById('panelDownloads').style.display = tab === 'downloads' ? 'block' : 'none';
    if (tab === 'orders') loadOrders();
    if (tab === 'downloads') loadDownloads();
  }

  window.switchTab = switchTab;

  async function loadProfile() {
    try {
      var res = await fetch(API_BASE + '/users/me', {
        headers: { 'Authorization': 'Bearer ' + getToken() }
      });
      if (res.status === 401) { logout(); return; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var user = await res.json();

      document.getElementById('uName').textContent = user.name || '—';
      document.getElementById('uEmail').textContent = user.email || '—';
      document.getElementById('uWallet').textContent = user.wallet_address || '—';
      var since = user.created_at || '';
      document.getElementById('uSince').textContent = since ? new Date(since).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) : '—';

      if (user.name && user.name.trim()) {
        document.getElementById('avatarInitial').textContent = user.name.charAt(0).toUpperCase();
      } else {
        document.getElementById('avatarInitial').textContent = user.email ? (user.email.charAt(0).toUpperCase() || '?') : '?';
      }

      document.body.setAttribute('data-user', user.email || '');
    } catch (e) {
      logout();
    }
  }

  async function loadOrders() {
    var tbody = document.querySelector('#ordersRows tbody');
    var noOrders = document.getElementById('noOrders');
    var table = document.getElementById('ordersTable');
    tbody.innerHTML = '';
    noOrders.style.display = 'none';
    table.style.display = 'table';

    try {
      var res = await fetch(API_BASE + '/orders?per_page=50', {
        headers: { 'Authorization': 'Bearer ' + getToken() }
      });
      if (res.status === 401) { logout(); return; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      var orders = data.orders || [];

      if (orders.length === 0) {
        noOrders.style.display = 'block';
        table.style.display = 'none';
        return;
      }

      tbody.innerHTML = orders.map(function(o) {
        var statusClass = o.status === 'completed' ? 'completed' : (o.status === 'pending' ? 'pending' : 'failed');
        var action = (o.status === 'completed') ?
          '<span class="actions" onclick="viewOrder(' + o.id + ')">VIEW</span>' :
          '<span class="actions" onclick="retryOrder(' + o.id + ')">RETRY</span>';
        return '<tr>' +
          '<td>#' + o.id + '</td>' +
          '<td>' + (o.created_at ? new Date(o.created_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '') + '</td>' +
          '<td>$' + (o.total_usd || 0).toFixed(2) + '</td>' +
          '<td><span class="status-badge ' + statusClass + '">' + o.status + '</span></td>' +
          '<td>' + action + '</td>' +
        '</tr>';
      }).join('');
    } catch (e) {
      console.error(e);
    }
  }

  function viewOrder(id) {
    window.location.href = '/checkout?order=' + id;
  }

  function retryOrder(id) {
    // just reload — retry is handled server-side
    loadOrders();
  }

  async function loadDownloads() {
    var list = document.getElementById('downloadsList');
    var noD = document.getElementById('noDownloads');
    list.innerHTML = '';
    noD.style.display = 'none';

    try {
      var res = await fetch(API_BASE + '/orders/downloadables', {
        headers: { 'Authorization': 'Bearer ' + getToken() }
      });
      if (res.status === 401) { logout(); return; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      var items = data.downloadables || [];

      if (items.length === 0) {
        noD.style.display = 'block';
        return;
      }

      list.innerHTML = items.map(function(d) {
        var canDownload = d.is_available && (d.download_count < d.max_downloads || d.max_downloads === 0);
        var statusNote = d.max_downloads > 0 ? ('downloaded ' + d.download_count + '/' + d.max_downloads + ' times') : 'unlimited';
        return '' +
          '<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);">' +
            '<span style="font-family:var(--mono);font-size:10px;color:var(--cyan);min-width:60px;">' + (d.order_id || '—') + '</span>' +
            '<div style="flex:1;">' +
              '<div style="font-size:13px;font-weight:600;">' + escapeHtml(d.product_name) + '</div>' +
              '<div style="font-size:11px;color:var(--text2);font-family:var(--mono);">' + statusNote + '</div>' +
            '</div>' +
            (canDownload ? '<a href="' + API_BASE + '/orders/download/' + d.id + '" style="color:var(--green);font-family:var(--mono);font-size:11px;">DOWNLOAD</a>' :
                          '<span style="color:var(--text2);font-family:var(--mono);font-size:11px;">max downloads used</span>') +
          '</div>';
      }).join('');
    } catch (e) {
      console.error(e);
    }
  }

  window.viewOrder = viewOrder;
  window.retryOrder = retryOrder;

  loadProfile();
})();
</script>
</body>
</html>
