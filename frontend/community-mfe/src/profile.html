<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile — Pawradise</title>
    <script>window.SITE_PAGE="community";</script>
  <link rel="icon" href="/assets/favicon.svg" sizes="any" />
  <link rel="stylesheet" href="/assets/theme.css?v=9" />
  <script src="/env.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="page" id="root"></main>
  <footer id="site-footer"></footer>
    <script src="/assets/api.js"></script>
  <script src="/assets/ui.js"></script>
  <script src="/assets/events.js"></script>
  <script src="/assets/chrome.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    if (!params.get('id')) { const m = location.pathname.match(/\/profile\/(\d+)/); if (m) params.set('id', m[1]); }
    let tab = params.get("tab") || "posts";
    const api = Pawradise.api;
    const PER = 10;
    let page = 1;
    let items = [];
    let total = 0;
    let me = null;
    let u = null;

    function more() {
      return PawUI.moreBtn("more-tab", items.length < total);
    }

    async function loadTab(reset) {
      if (reset !== false) { page = 1; items = []; }
      const box = document.getElementById("tab-body");
      if (!box || !u) return;
      if (tab === "followers") {
        const res = await api.community.getFollowers(u.id, { page, per_page: PER });
        const batch = res.users || [];
        total = res.total || batch.length;
        items = page === 1 ? batch : items.concat(batch);
        box.innerHTML = (items.map((x) => PawUI.personRow(x, me && me.id)).join("") || '<p class="note">No followers yet.</p>') + more();
      } else if (tab === "following") {
        const res = await api.community.getFollowing(u.id, { page, per_page: PER });
        const batch = res.users || [];
        total = res.total || batch.length;
        items = page === 1 ? batch : items.concat(batch);
        box.innerHTML = (items.map((x) => PawUI.personRow(x, me && me.id)).join("") || '<p class="note">Not following anyone.</p>') + more();
      } else {
        const feed = await api.community.getPosts({ user_id: u.id, page, per_page: PER });
        const batch = feed.posts || [];
        total = feed.total || batch.length;
        items = page === 1 ? batch : items.concat(batch);
        box.innerHTML = `<div class="feed">${items.map((p) => PawUI.postCard(p, me && me.id)).join("") || '<p class="note">No posts yet.</p>'}</div>` + more();
      }
      const btn = document.getElementById("more-tab");
      if (btn) btn.onclick = () => { page += 1; loadTab(false); };
      PawUI.bindFollow(box, () => loadTab(true));
    }

    async function render() {
      const root = document.getElementById("root");
      try { me = await api.auth.getProfile(); } catch (e) { me = null; }
      let id = params.get("id");
      if (!id) {
        if (me) { location.replace("/profile/" + me.id + (tab !== "posts" ? "?tab=" + encodeURIComponent(tab) : "")); return; }
        root.innerHTML = PawUI.communityNav("people") + '<p class="note">Pick someone in <a href="/people">People</a>, or <a href="' + PawUI.loginHref() + '">log in</a> to open your profile.</p>';
        return;
      }
      try { u = await api.community.getProfile(id); }
      catch (e) { root.innerHTML = PawUI.communityNav("people", me && me.id) + '<p class="note">Profile not found. <a href="/people">People</a></p>'; return; }
      document.title = u.name + " — Pawradise";
      const self = !!(me && me.id === u.id);
      const followBtn = self || !me
        ? (me ? `<a class="btn" href="/account">Account settings</a>` : `<a class="btn btn-accent" href="${PawUI.loginHref()}">Log in to follow</a>`)
        : PawUI.followControl(u, me.id);
      const avatarUrl = u.avatar_url || "";
      const avatarField = avatarUrl.indexOf("data:") === 0 ? "" : avatarUrl;
      const photoForm = self ? `<form id="photo" class="buy" style="margin-top:16px;max-width:360px">
          ${PawUI.avatarFields(avatarField)}
          <p class="form-error"></p>
          <button class="btn">Save picture</button>
        </form>` : "";
      root.innerHTML = PawUI.communityNav(self ? "profile" : "people", me && me.id) + `
        <div class="profile-hero">
          ${PawUI.avatar(u, "lg")}
          <div>
            <div class="kicker">Community</div>
            <h1 class="page-title" style="margin:4px 0 8px">${PawUI.esc(u.name)} ${PawUI.relationPills(u, me && me.id)}</h1>
            <p>${PawUI.esc(u.bio || "")}</p>
            ${u.wallet_address ? `<p style="color:var(--mute);font-size:13px;margin-top:8px">Wallet ${PawUI.esc(u.wallet_address)}</p>` : ""}
            ${photoForm}
          </div>
          <div>${followBtn}</div>
        </div>
        <nav class="profile-tabs" aria-label="Profile sections">
          <a class="${tab === "posts" ? "is-on" : ""}" href="/profile/${u.id}?tab=posts"><b>${u.post_count || 0}</b> Posts</a>
          <a class="${tab === "followers" ? "is-on" : ""}" href="/profile/${u.id}?tab=followers"><b>${u.follower_count || 0}</b> Followers</a>
          <a class="${tab === "following" ? "is-on" : ""}" href="/profile/${u.id}?tab=following"><b>${u.following_count || 0}</b> Following</a>
        </nav>
        <div id="tab-body"></div>`;
      PawUI.bindFollow(root, render);
      const photo = document.getElementById("photo");
      if (photo) photo.onsubmit = async (e) => {
        e.preventDefault();
        try {
          const uploaded = await PawUI.readAvatarFromForm(e.target);
          const payload = {};
          if (uploaded) payload.avatar_url = uploaded;
          else if (avatarUrl.indexOf("data:") !== 0) payload.avatar_url = new FormData(e.target).get("avatar_url") || "";
          if (payload.avatar_url === undefined) { PawUI.toast("Choose a file or paste a URL"); return; }
          await api.auth.updateProfile(payload);
          PawUI.toast("Picture saved");
          PawChrome.mount();
          render();
        } catch (ex) { e.target.querySelector(".form-error").textContent = ex.message; }
      };
      await loadTab(true);
    }
    render();
  </script>
</body>
</html>
