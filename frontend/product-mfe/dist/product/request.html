<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawradise — Request Custom</title>
    <meta name="description" content="Request custom digital assets">
    <link rel="icon" href="/assets/favicon.svg" sizes="any">
    <link rel="stylesheet" href="/assets/theme.css">
    <script src="/env.js"></script>
    <script src="/assets/api.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #0a0e14; color: #c7d0dc; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background-color: #10151d; border-bottom: 1px solid #1e2530; padding: 12px 20px; }
        .header-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; font-weight: bold; color: #4dd6c9; text-decoration: none; }
        .nav { display: flex; gap: 20px; }
        .nav a { color: #c7d0dc; text-decoration: none; font-size: 0.9rem; padding: 6px 12px; border-radius: 6px; transition: color 0.15s ease; }
        .nav a:hover { color: #4dd6c9; }
        main { flex: 1; max-width: 800px; margin: 0 auto; padding: 40px 20px; width: 100%; }
        h1 { font-size: 2rem; margin-bottom: 8px; color: #4dd6c9; }
        .subtitle { color: #7c8896; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.875rem; color: #7c8896; margin-bottom: 6px; }
        input, textarea, select { width: 100%; padding: 10px 14px; background-color: #10151d; border: 1px solid #1e2530; border-radius: 8px; color: #c7d0dc; font-size: 0.95rem; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #4dd6c9; }
        textarea { min-height: 120px; resize: vertical; }
        .btn { padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.95rem; font-weight: 500; transition: all 0.15s ease; }
        .btn-primary { background-color: #4dd6c9; color: #0a0e14; }
        .btn-primary:hover { background-color: #5ee6d9; }
        .footer { background-color: #10151d; border-top: 1px solid #1e2530; padding: 20px; text-align: center; color: #7c8896; font-size: 0.8rem; font-family: 'JetBrains Mono', monospace; }
        .success-msg { background-color: rgba(95,214,138,0.1); border: 1px solid #5fd68a; color: #5fd68a; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .error-msg { background-color: rgba(224,111,111,0.1); border: 1px solid #e06f6f; color: #e06f6f; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; display: none; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">/pawradise</a>
            <nav class="nav">
                <a href="/">Shop</a>
                <a href="/category">Categories</a>
                <a href="/product/bundle.html">Bundles</a>
                <a href="/product/request.html">Request</a>
                <a href="/community">Community</a>
                <a href="/account">Account</a>
            </nav>
        </div>
    </header>

    <main x-data="{
        title: '',
        description: '',
        category: '',
        budget: '',
        email: '',
        loading: false,
        success: false,
        error: '',
        async submit() {
            this.loading = true;
            this.error = '';
            this.success = false;
            try {
                const res = await fetch(`${window.__PAWRADISE_ENV__?.apiBase || '/api/v1'}/product-requests`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: this.title,
                        description: this.description,
                        category: this.category,
                        budget_usd: parseFloat(this.budget) || null,
                        email: this.email
                    })
                });
                if (!res.ok) {
                    const body = await res.json().catch(() => ({}));
                    throw new Error(body.error || 'Request failed');
                }
                this.success = true;
                this.title = ''; this.description = ''; this.category = ''; this.budget = ''; this.email = '';
            } catch (err) {
                this.error = err.message || 'Failed to submit request';
            } finally {
                this.loading = false;
            }
        }
    }">
        <h1>Request Custom Assets</h1>
        <p class="subtitle">Can't find what you need? Tell us what you're looking for.</p>

        <div class="success-msg" x-show="success" style="display: none;">
            Request submitted successfully! We'll review it and get back to you.
        </div>
        <div class="error-msg" x-show="error" x-text="error" style="display: none;"></div>

        <form @submit.prevent="submit()">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" x-model="title" placeholder="e.g., Fantasy Character Pack" required>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" x-model="category">
                    <option value="">Select a category</option>
                    <option value="2d-art">2D Art</option>
                    <option value="3d-models">3D Models</option>
                    <option value="textures">Textures</option>
                    <option value="ui-kits">UI Kits</option>
                    <option value="icons">Icons</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" x-model="description" placeholder="Describe what you need in detail..." required></textarea>
            </div>
            <div class="form-group">
                <label for="budget">Budget (USD)</label>
                <input type="number" id="budget" x-model="budget" placeholder="e.g., 50" min="1" step="0.01">
            </div>
            <div class="form-group">
                <label for="email">Email (optional)</label>
                <input type="email" id="email" x-model="email" placeholder="For updates on your request">
            </div>
            <button type="submit" class="btn btn-primary" :disabled="loading">
                <span x-show="!loading">Submit Request</span>
                <span x-show="loading">Submitting...</span>
            </button>
        </form>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Pawradise — Digital Assets Marketplace</p>
    </footer>

    <script src="/assets/alpine.min.js"></script>
</body>
</html>
