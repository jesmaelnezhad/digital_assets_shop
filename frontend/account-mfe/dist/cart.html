<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawradise — Cart</title>
    <meta name="description" content="Your shopping cart">
    <link rel="stylesheet" href="/assets/theme.css?v=9">
    <script src="/env.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-sans); background-color: var(--color-bg); color: var(--color-text); min-height: 100vh; display: flex; flex-direction: column; }
        .header { background-color: var(--color-bg-elevated); border-bottom: 1px solid var(--color-border); padding: var(--space-sm) var(--space-lg); }
        .header-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); }
        .logo { font-family: var(--font-mono); font-size: 1.25rem; font-weight: bold; color: var(--color-accent-primary); text-decoration: none; }
        .nav { display: flex; gap: var(--space-md); }
        .nav a { color: var(--color-text); text-decoration: none; font-size: 0.9rem; padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-sm); transition: color 0.15s ease; }
        .nav a:hover, .nav a.active { color: var(--color-accent-primary); }
        main { flex: 1; max-width: 1280px; margin: 0 auto; padding: var(--space-lg); width: 100%; }
        .page-title { font-family: var(--font-mono); font-size: 1.5rem; margin-bottom: var(--space-lg); }
        .cart-item { display: flex; align-items: center; gap: var(--space-md); background-color: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-md); margin-bottom: var(--space-sm); }
        .cart-item img { width: 80px; height: 80px; object-fit: cover; border-radius: var(--radius-sm); }
        .cart-item .info { flex: 1; }
        .cart-item .title { font-family: var(--font-mono); font-size: 1rem; margin-bottom: var(--space-xs); }
        .cart-item .meta { font-size: 0.8rem; color: var(--color-text-muted); }
        .cart-item .price { font-family: var(--font-mono); font-size: 1.1rem; color: var(--color-accent-primary); font-weight: 600; }
        .cart-item .remove { color: var(--color-danger); cursor: pointer; font-size: 0.85rem; }
        .cart-summary { background-color: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-lg); margin-top: var(--space-lg); }
        .cart-summary .total { font-family: var(--font-mono); font-size: 1.5rem; color: var(--color-accent-primary); font-weight: 600; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: var(--space-sm) var(--space-md); font-size: 0.9rem; border: none; border-radius: var(--radius-sm); cursor: pointer; text-decoration: none; transition: all 0.15s ease; }
        .btn-primary { background-color: var(--color-accent-primary); color: var(--color-bg); font-weight: 600; padding: var(--space-md) var(--space-xl); font-size: 1rem; }
        .btn-primary:hover { box-shadow: var(--glow-hover); }
        .btn-secondary { background-color: transparent; border: 1px solid var(--color-border); color: var(--color-text); }
        .btn-secondary:hover { border-color: var(--color-accent-primary); color: var(--color-accent-primary); }
        .empty-state { text-align: center; padding: var(--space-xl); color: var(--color-text-muted); }
        .footer { background-color: var(--color-bg-elevated); border-top: 1px solid var(--color-border); padding: var(--space-lg); text-align: center; color: var(--color-text-muted); font-size: 0.8rem; font-family: var(--font-mono); }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--color-border); border-top-color: var(--color-accent-primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 640px) { .nav { display: none; } .cart-item { flex-wrap: wrap; } }
    </style>
    <!-- CHROME_HEADER -->
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">/pawradise</a>
            <nav class="nav">
                <a href="/">Shop</a>
                <a href="/category">Categories</a>
                <a href="/product/bundle.html">Bundles</a>
                <a href="/product/request.html">Request</a>
                <a href="/community">Community</a>
                <a href="/account">Account</a>
            </nav>
        </div>
    </header>

    <main x-data="{
        cart: { items: [], total: 0 },
        loading: true,
        async load() {
            this.loading = true;
            try {
                const res = await fetch(`${window.__PAWRADISE_ENV__?.apiBase || '/api/v1'}/cart`, {
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (res.status === 401) { window.location.href = '/login?next=/cart'; return; }
                if (!res.ok) throw new Error('Failed to load cart');
                this.cart = await res.json();
            } catch (e) {
                console.error(e);
            } finally {
                this.loading = false;
            }
        },
        async removeItem(itemId) {
            try {
                const res = await fetch(`${window.__PAWRADISE_ENV__?.apiBase || '/api/v1'}/cart/items/${itemId}`, {
                    method: 'DELETE',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (res.ok) this.load();
            } catch (e) {
                console.error(e);
            }
        }
    }" x-init="load()">
        
        <h1 class="page-title">Cart</h1>

        <div x-show="loading" class="empty-state"><div class="spinner"></div><p style="margin-top:var(--space-sm)">Loading cart...</p></div>

        <div x-show="!loading && cart.items?.length === 0" class="empty-state">
            <h2 style="font-family:var(--font-mono);margin-bottom:var(--space-sm)">Your cart is empty</h2>
            <p>Add some products to get started.</p>
            <a href="/" class="btn btn-primary" style="margin-top:var(--space-md)">Browse Products</a>
        </div>

        <div x-show="!loading && cart.items?.length > 0">
            <template x-for="item in cart.items" :key="item.id">
                <div class="cart-item">
                    <img :src="item.preview_image_url" :alt="item.product_title" x-show="item.preview_image_url">
                    <div class="info">
                        <div class="title" x-text="item.product_title"></div>
                        <div class="meta">Qty: <span x-text="item.quantity"></span></div>
                    </div>
                    <div class="price" x-text="'$' + (item.unit_price_usd * item.quantity).toFixed(2)"></div>
                    <div class="remove" @click="removeItem(item.id)">Remove</div>
                </div>
            </template>

            <div class="cart-summary">
                <div style="display:flex;justify-content:space-between;align-items:center">
                    <span>Total:</span>
                    <span class="total" x-text="'$' + (cart.total || 0).toFixed(2)"></span>
                </div>
                <a href="/checkout" class="btn btn-primary" style="width:100%;margin-top:var(--space-md)">Proceed to Checkout</a>
            </div>
        </div>
    </main>

    <footer class="footer">// pawradise.ir — digital assets marketplace</footer>

    <script src="/assets/alpine.min.js" defer></script>
    <script src="/assets/api.js"></script>
    <!-- CHROME_FOOTER -->
</body>
</html>
