<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawradise — My Account</title>
    <meta name="description" content="Manage your Pawradise account">
    <link rel="stylesheet" href="/assets/theme.css">
    <script src="/env.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-sans); background-color: var(--color-bg); color: var(--color-text); min-height: 100vh; display: flex; flex-direction: column; }
        .header { background-color: var(--color-bg-elevated); border-bottom: 1px solid var(--color-border); padding: var(--space-sm) var(--space-lg); }
        .header-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); }
        .logo { font-family: var(--font-mono); font-size: 1.25rem; font-weight: bold; color: var(--color-accent-primary); text-decoration: none; }
        .nav { display: flex; gap: var(--space-md); }
        .nav a { color: var(--color-text); text-decoration: none; font-size: 0.9rem; padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-sm); transition: color 0.15s ease; }
        .nav a:hover, .nav a.active { color: var(--color-accent-primary); }
        main { flex: 1; max-width: 1280px; margin: 0 auto; padding: var(--space-lg); width: 100%; }
        .page-title { font-family: var(--font-mono); font-size: 1.5rem; margin-bottom: var(--space-lg); }
        .profile-grid { display: grid; grid-template-columns: 300px 1fr; gap: var(--space-lg); }
        .sidebar { background-color: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-md); }
        .sidebar .user-info { text-align: center; padding-bottom: var(--space-md); border-bottom: 1px solid var(--color-border); margin-bottom: var(--space-md); }
        .sidebar .avatar { width: 80px; height: 80px; background-color: var(--color-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 2rem; color: var(--color-accent-primary); margin: 0 auto var(--space-sm); }
        .sidebar .user-name { font-family: var(--font-mono); font-size: 1rem; }
        .sidebar .user-email { font-size: 0.8rem; color: var(--color-text-muted); }
        .sidebar-nav { display: flex; flex-direction: column; gap: var(--space-xs); }
        .sidebar-nav a { display: block; padding: var(--space-sm) var(--space-md); color: var(--color-text); text-decoration: none; border-radius: var(--radius-sm); font-size: 0.9rem; transition: background-color 0.15s ease; }
        .sidebar-nav a:hover, .sidebar-nav a.active { background-color: var(--color-bg); color: var(--color-accent-primary); }
        .content { background-color: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-lg); }
        .field { margin-bottom: var(--space-md); }
        .field label { display: block; font-size: 0.85rem; color: var(--color-text-muted); margin-bottom: var(--space-xs); }
        .field input, .field textarea, .field select { width: 100%; padding: var(--space-sm) var(--space-md); background-color: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-sm); color: var(--color-text); font-size: 0.95rem; font-family: var(--font-sans); }
        .field input:focus, .field textarea:focus { outline: none; border-color: var(--color-accent-primary); box-shadow: var(--glow-focus); }
        .field .error { color: var(--color-danger); font-size: 0.8rem; margin-top: var(--space-xs); }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: var(--space-sm) var(--space-md); font-size: 0.9rem; border: none; border-radius: var(--radius-sm); cursor: pointer; text-decoration: none; transition: all 0.15s ease; }
        .btn-primary { background-color: var(--color-accent-primary); color: var(--color-bg); font-weight: 600; }
        .btn-primary:hover { box-shadow: var(--glow-hover); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-secondary { background-color: transparent; border: 1px solid var(--color-border); color: var(--color-text); }
        .btn-secondary:hover { border-color: var(--color-accent-primary); color: var(--color-accent-primary); }
        .orders-table { width: 100%; border-collapse: collapse; }
        .orders-table th, .orders-table td { padding: var(--space-sm) var(--space-md); text-align: left; border-bottom: 1px solid var(--color-border); font-size: 0.9rem; }
        .orders-table th { font-family: var(--font-mono); font-size: 0.8rem; color: var(--color-text-muted); }
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 0.75rem; }
        .status-pending { background-color: rgba(224, 184, 77, 0.15); color: var(--color-warning); }
        .status-paid { background-color: rgba(95, 214, 138, 0.15); color: var(--color-success); }
        .status-processing { background-color: rgba(77, 214, 201, 0.15); color: var(--color-accent-primary); }
        .status-shipped { background-color: rgba(77, 214, 201, 0.15); color: var(--color-accent-primary); }
        .status-delivered { background-color: rgba(95, 214, 138, 0.15); color: var(--color-success); }
        .status-cancelled { background-color: rgba(224, 111, 111, 0.15); color: var(--color-danger); }
        .status-refunded { background-color: rgba(224, 111, 111, 0.15); color: var(--color-danger); }
        .empty-state { text-align: center; padding: var(--space-xl); color: var(--color-text-muted); }
        .footer { background-color: var(--color-bg-elevated); border-top: 1px solid var(--color-border); padding: var(--space-lg); text-align: center; color: var(--color-text-muted); font-size: 0.8rem; font-family: var(--font-mono); }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--color-border); border-top-color: var(--color-accent-primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .banner { padding: var(--space-sm) var(--space-md); border-radius: var(--radius-sm); margin-bottom: var(--space-md); font-size: 0.85rem; display: none; }
        .banner.success { background-color: rgba(95, 214, 138, 0.1); border: 1px solid var(--color-success); color: var(--color-success); }
        .banner.error { background-color: rgba(224, 111, 111, 0.1); border: 1px solid var(--color-danger); color: var(--color-danger); }
        .banner.visible { display: block; }
        @media (max-width: 640px) { .profile-grid { grid-template-columns: 1fr; } .nav { display: none; } }
    </style>
    <!-- CHROME_HEADER -->
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">/pawradise</a>
            <nav class="nav">
                <a href="/">Shop</a>
                <a href="/category">Categories</a>
                <a href="/product/bundle.html">Bundles</a>
                <a href="/product/request.html">Request</a>
                <a href="/community">Community</a>
                <a href="/account">Account</a>
            </nav>
        </div>
    </header>

    <main x-data="{
        user: null,
        profile: null,
        orders: [],
        loading: true,
        saving: false,
        error: '',
        success: '',
        activeTab: 'profile',
        editForm: { name: '', bio: '', wallet_address: '', preferred_currency: 'USD', newsletter_enabled: true },
        async load() {
            this.loading = true;
            try {
                const res = await fetch(`${window.__PAWRADISE_ENV__?.apiBase || '/api/v1'}/me`, {
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (res.status === 401) { window.location.href = '/login?next=/account'; return; }
                if (!res.ok) throw new Error('Failed to load profile');
                const data = await res.json();
                this.user = data;
                this.profile = data.profile || {};
                this.editForm = {
                    name: data.name || '',
                    bio: this.profile.bio || '',
                    wallet_address: this.profile.wallet_address || '',
                    preferred_currency: this.profile.preferred_currency || 'USD',
                    newsletter_enabled: this.profile.newsletter_enabled !== false
                };
                this.loadOrders();
            } catch (e) {
                this.error = e.message;
            } finally {
                this.loading = false;
            }
        },
        async loadOrders() {
            try {
                const res = await fetch(`${window.__PAWRADISE_ENV__?.apiBase || '/api/v1'}/orders?page=1&per_page=20`, {
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (res.ok) {
                    const data = await res.json();
                    this.orders = data.orders || [];
                }
            } catch (e) {}
        },
        async saveProfile() {
            this.saving = true;
            this.error = '';
            this.success = '';
            try {
                const res = await fetch(`${window.__PAWRADISE_ENV__?.apiBase || '/api/v1'}/me`, {
                    method: 'PUT',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.editForm)
                });
                if (!res.ok) {
                    const body = await res.json().catch(() => ({}));
                    throw new Error(body.error || 'Failed to save profile');
                }
                this.success = 'Profile updated successfully';
                this.user = { ...this.user, ...this.editForm };
            } catch (e) {
                this.error = e.message;
            } finally {
                this.saving = false;
            }
        }
    }" x-init="load()">
        
        <h1 class="page-title">My Account</h1>

        <div x-show="loading" class="empty-state"><div class="spinner"></div><p style="margin-top:var(--space-sm)">Loading...</p></div>

        <div x-show="!loading && user" class="profile-grid">
            <div class="sidebar">
                <div class="user-info">
                    <div class="avatar" x-text="(user.name || '?')[0].toUpperCase()"></div>
                    <div class="user-name" x-text="user.name"></div>
                    <div class="user-email" x-text="user.email"></div>
                </div>
                <nav class="sidebar-nav">
                    <a href="#" :class="{ active: activeTab === 'profile' }" @click.prevent="activeTab = 'profile'">Profile</a>
                    <a href="#" :class="{ active: activeTab === 'orders' }" @click.prevent="activeTab = 'orders'">Order History</a>
                    <a href="/cart">Cart</a>
                    <a href="/wishlist">Wishlist</a>
                    <a href="/referrals">Referrals</a>
                </nav>
            </div>

            <div class="content">
                <div class="banner success" :class="{ visible: success }" x-text="success"></div>
                <div class="banner error" :class="{ visible: error }" x-text="error"></div>

                <div x-show="activeTab === 'profile'">
                    <h2 style="font-family:var(--font-mono);margin-bottom:var(--space-md)">Edit Profile</h2>
                    <form @submit.prevent="saveProfile">
                        <div class="field">
                            <label>Name</label>
                            <input type="text" x-model="editForm.name" required>
                        </div>
                        <div class="field">
                            <label>Bio</label>
                            <textarea x-model="editForm.bio" rows="3" placeholder="Tell us about yourself"></textarea>
                        </div>
                        <div class="field">
                            <label>Wallet Address (BSC)</label>
                            <input type="text" x-model="editForm.wallet_address" placeholder="0x...">
                        </div>
                        <div class="field">
                            <label>Preferred Currency</label>
                            <select x-model="editForm.preferred_currency">
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="GBP">GBP</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>
                                <input type="checkbox" x-model="editForm.newsletter_enabled" style="width:auto;margin-right:var(--space-xs)">
                                Subscribe to newsletter
                            </label>
                        </div>
                        <button type="submit" class="btn btn-primary" :disabled="saving">
                            <span x-show="!saving">Save Changes</span>
                            <span x-show="saving">Saving...</span>
                        </button>
                    </form>
                </div>

                <div x-show="activeTab === 'orders'">
                    <h2 style="font-family:var(--font-mono);margin-bottom:var(--space-md)">Order History</h2>
                    <div x-show="orders.length === 0" class="empty-state">
                        <p>No orders yet.</p>
                        <a href="/" class="btn btn-primary" style="margin-top:var(--space-sm)">Start Shopping</a>
                    </div>
                    <table class="orders-table" x-show="orders.length > 0">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Date</th>
                                <th>Total</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="order in orders" :key="order.id">
                                <tr>
                                    <td x-text="'#' + order.id"></td>
                                    <td x-text="new Date(order.created_at).toLocaleDateString()"></td>
                                    <td x-text="'$' + order.total_usd.toFixed(2)"></td>
                                    <td><span class="status-badge" :class="'status-' + order.status" x-text="order.status"></span></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">// pawradise.ir — digital assets marketplace</footer>

    <script src="/assets/alpine.min.js" defer></script>
    <script src="/assets/api.js"></script>
    <!-- CHROME_FOOTER -->
</body>
</html>
