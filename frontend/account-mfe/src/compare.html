<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compare — Store4bots</title>
    <script>window.SITE_PAGE="account";</script>
  <link rel="icon" href="/assets/favicon.svg" sizes="any" />
  <link rel="stylesheet" href="/assets/theme.css?v=11" />
  <script src="/env.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="page" id="root"></main>
  <footer id="site-footer"></footer>
    <script src="/assets/api.js"></script>
  <script src="/assets/ui.js"></script>
  <script src="/assets/events.js"></script>
  <script src="/assets/chrome.js"></script>
  <script>
    async function render() {
      const root = document.getElementById("root");
      try {
        await PawUI.lists.refresh();
        await PawUI.catalog.load();
        const products = await PawUI.catalog.byIdsAsync([...PawUI.lists.compare]);
        if (!products.length) {
          root.innerHTML = PawUI.accountNav("compare") + '<p class="note">Add assets from the shop to compare.</p>';
          return;
        }
        root.innerHTML = PawUI.accountNav("compare") + `<div class="kicker">Account</div><h1 class="page-title">Compare</h1>` +
          PawUI.compareBoard(products);
        root.querySelectorAll("[data-rm]").forEach((b) => b.onclick = async () => {
          await Store4bots.api.compare.toggle(Number(b.dataset.rm));
          PawChrome.mount();
          render();
        });
      } catch (e) {
        root.innerHTML = e.status === 401
          ? PawUI.authGate("Log in to compare.")
          : `<p class="note">${PawUI.esc(e.message)}</p>`;
      }
    }
    render();
  </script>
</body>
</html>
