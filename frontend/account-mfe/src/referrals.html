<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Referrals — Store4bots</title>
    <script>window.SITE_PAGE="account";</script>
  <link rel="icon" href="/assets/favicon.svg" sizes="any" />
  <link rel="stylesheet" href="/assets/theme.css?v=11" />
  <script src="/env.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="page" id="root"></main>
  <footer id="site-footer"></footer>
    <script src="/assets/api.js"></script>
  <script src="/assets/ui.js"></script>
  <script src="/assets/events.js"></script>
  <script src="/assets/chrome.js"></script>
  <script>
    async function render() {
      const root = document.getElementById("root");
      try {
        const r = await Store4bots.api.referrals.get();
        const earn = await Store4bots.api.referrals.getEarnings();
        const code = r.referral_link || r.code || "";
        const link = location.origin + location.pathname.replace(/[^/]+$/, "") + "..//register?ref=" + encodeURIComponent(code);
        const people = r.referrals || r.referred_users || [];
        const rows = earn.earnings || [];
        root.innerHTML = PawUI.accountNav("referrals") + `
          <div class="kicker">Account</div>
          <h1 class="page-title">Referrals</h1>
          <p class="desc">Share your link. When someone registers with it and later buys, you earn the site commission percent on that order.</p>
          <div class="stats" style="display:flex;gap:12px;flex-wrap:wrap;margin:18px 0">
            <div class="stat"><span>Referred</span><b>${r.total_referrals || people.length || 0}</b></div>
            <div class="stat"><span>Earned</span><b>${PawUI.money(r.total_earnings || 0)}</b></div>
          </div>
          <p class="note">Code <span class="mono">${PawUI.esc(code)}</span></p>
          <p style="margin:12px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <input id="share" readonly value="${PawUI.esc(link)}" style="flex:1;min-width:220px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)" />
            <button class="btn btn-accent" id="copy" type="button">Copy link</button>
          </p>
          <h2 style="font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:24px 0 12px">Referred people</h2>
          <div class="table-wrap"><table class="table"><thead><tr><th>User</th><th>When</th></tr></thead>
          <tbody>${people.map((x) => `<tr>
            <td>${x.referred_user_id ? `<a href="..//profile/${x.referred_user_id}">${PawUI.esc(x.name || ("User #" + x.referred_user_id))}</a>` : PawUI.esc(x.name || x.email || "—")}</td>
            <td>${x.created_at ? new Date(x.created_at).toLocaleDateString() : "—"}</td>
          </tr>`).join("") || "<tr><td colspan=2>Nobody has used your link yet. Copy it above.</td></tr>"}</tbody></table></div>
          <h2 style="font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:24px 0 12px">Earnings</h2>
          <div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Amount</th></tr></thead>
          <tbody>${rows.map((e) => `<tr><td>#${e.order_id}</td><td class="price">${PawUI.money(e.amount)}</td></tr>`).join("") || "<tr><td colspan=2>None yet. Earnings appear after a referred buyer pays.</td></tr>"}</tbody></table></div>`;
        document.getElementById("copy").onclick = async () => {
          try { await navigator.clipboard.writeText(link); PawUI.toast("Copied"); }
          catch (e) { PawUI.toast("Copy failed"); }
        };
      } catch (e) {
        root.innerHTML = (e.status === 401)
          ? PawUI.authGate("Log in to see your referral link, referred people, and earnings.")
          : `<p class="note">${PawUI.esc(e.message)}</p>`;
      }
    }
    render();
  </script>
</body>
</html>
