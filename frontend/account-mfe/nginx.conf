server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location = /account { try_files /account.html =404; }
    location = /cart { try_files /cart.html =404; }
    location = /wishlist { try_files /wishlist.html =404; }
    location = /referrals { try_files /referrals.html =404; }
    location /assets/ { expires 7d; }
}
