<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Pawradise</title>
    <script>window.SITE_PAGE="admin";</script>
  <link rel="icon" href="/assets/favicon.svg" sizes="any" />
  <link rel="stylesheet" href="/assets/theme.css?v=9" />
  <script src="/env.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="page">
    <div class="kicker">Desk</div>
    <h1 class="page-title">Admin</h1>
    <div id="gate"></div>
    <div id="desk" hidden>
      <div class="tabs" id="tabs"></div>
      <div id="panel"></div>
    </div>
  </main>
  <div class="modal" id="modal"><div class="modal-card wide" id="modal-card"></div></div>
  <footer id="site-footer"></footer>
    <script src="/assets/api.js"></script>
  <script src="/assets/ui.js"></script>
  <script src="/assets/events.js"></script>
  <script src="/assets/chrome.js"></script>
  <script>
    const api = Pawradise.api;
    const SEO_KEYS = ["site_title", "site_description", "site_keywords", "og_image", "canonical_host", "robots_index"];
    const SETTING_KEYS = ["referral_commission_percent", "payment_address", "site_name", "download_policy", "default_currency"];
    const ALL_TABS = ["Stats", "Users", "Products", "Banner", "Categories", "Bundles", "Coupons", "Orders", "Steps", "Guest", "Community", "Referrals", "Rates", "Settings", "SEO", "Export", "Requests", "Appearance", "Events"];
    let on = "Stats";
    let cats = [];
    let catalog = [];
    let meUser = null;
    let orderFilter = "";
    let orderQ = "";

    function token() {
      return sessionStorage.getItem("admin_token") || localStorage.getItem("pawradise_admin_token") || "";
    }
    function setToken(t) {
      sessionStorage.setItem("admin_token", t);
      localStorage.setItem("pawradise_admin_token", t);
    }
    function clearToken() {
      sessionStorage.removeItem("admin_token");
      localStorage.removeItem("pawradise_admin_token");
    }
    function staffTabsOf(u) {
      const raw = u && (u.staff_tabs || u.staffTabs);
      if (Array.isArray(raw)) return raw;
      return String(raw || "").split(",").map((s) => s.trim()).filter(Boolean);
    }
    function deskTabs() {
      if (!meUser) return [];
      if (meUser.role === "admin") return ALL_TABS.concat(["Access"]);
      const allow = staffTabsOf(meUser);
      return ALL_TABS.filter((t) => allow.indexOf(t) >= 0);
    }
    function openModal(html) {
      document.getElementById("modal-card").innerHTML = html;
      document.getElementById("modal").classList.add("open");
    }
    function closeModal() { document.getElementById("modal").classList.remove("open"); }
    document.getElementById("modal").onclick = (e) => { if (e.target.id === "modal") closeModal(); };

    function gateView(kind) {
      document.getElementById("desk").hidden = true;
      const login = PawUI.loginHref(location.pathname + location.search);
      let body = "";
      if (kind === "customer") {
        body = `<p class="note">This desk is for staff and admins. You are signed in as a customer.</p>
          <p><a class="btn" href="/account">Back to account</a></p>`;
      } else if (kind === "empty") {
        body = `<p class="note">Your staff account has no admin sections yet. Ask an admin to assign tabs.</p>`;
      } else {
        body = `<p class="note" style="margin:0 0 16px">Log in as staff or admin to open the desk. Staff only need an account. Admins also enter the operator token on the Access tab to change roles.</p>
          <p><a class="btn btn-accent" href="${login}">Log in</a></p>
          <p class="note" style="margin-top:16px">Demo admin: nia@example.com / nia · staff: leo@example.com / leo</p>`;
      }
      document.getElementById("gate").innerHTML = `<div class="auth-card">${body}</div>`;
    }

    function showDesk() {
      const vis = deskTabs();
      document.getElementById("gate").innerHTML = `<p class="note" style="margin:0 0 16px">${PawUI.esc(meUser.role)} desk${meUser.role === "admin" && token() ? " · operator unlocked" : ""}.</p>`;
      document.getElementById("desk").hidden = false;
      document.getElementById("tabs").innerHTML = vis.map((t) => `<button class="tab${t === on ? " is-on" : ""}" data-t="${t}">${t}</button>`).join("");
      render();
    }

    async function panel() {
      try { cats = (await api.admin.categories()).categories || []; }
      catch (e) { cats = (await api.products.getCategories()).categories || []; }
      if (on === "Stats") {
        const s = await api.admin.stats();
        const days = s.revenue_daily || [];
        const max = Math.max(1, ...days.map((d) => d.revenue));
        const conv = s.conversions || {};
        const funnel = [
          ["Views", conv.views, conv.views],
          ["Carts", conv.carts, conv.views],
          ["Checkouts", conv.checkouts, conv.views],
          ["Purchases", conv.purchases, conv.views]
        ];
        return `<div class="stat-grid">
          <div class="stat"><span>Users</span><b>${s.total_users}</b></div>
          <div class="stat"><span>Products</span><b>${s.total_products}</b></div>
          <div class="stat"><span>Orders</span><b>${s.total_orders}</b></div>
          <div class="stat"><span>Revenue USD</span><b>${PawUI.money(s.total_revenue)}</b></div>
          <div class="stat"><span>Active</span><b>${s.active_products}</b></div>
          <div class="stat"><span>Pinned</span><b>${s.pinned_products}</b></div>
          <div class="stat"><span>Categories</span><b>${s.total_categories || cats.length}</b></div>
          <div class="stat"><span>Downloads</span><b>${s.total_downloads || 0}</b></div>
        </div>
        <h2 style="font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)">Revenue · 14 days</h2>
        <div class="spark">${days.map((d) => `<i title="${d.date} ${d.revenue}" style="height:${Math.round((d.revenue / max) * 100)}%"></i>`).join("")}</div>
        <h2 style="font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:20px">Conversion funnel</h2>
        <div class="funnel">${funnel.map(([l, n, den]) => `<div class="funnel-row"><span>${l}</span><div class="track"><span style="width:${Math.round((n / (den || 1)) * 100)}%"></span></div><b>${n || 0}</b></div>`).join("")}
          <p class="note" style="margin:8px 0">View→cart ${conv.view_to_cart || 0}% · cart→checkout ${conv.cart_to_checkout || 0}% · checkout→purchase ${conv.checkout_to_purchase || 0}%</p>
        </div>
        <h2 style="font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)">Top products</h2>
        <table class="table"><thead><tr><th>Title</th><th>Units</th><th>Revenue</th></tr></thead>
        <tbody>${(s.top_products || []).map((p) => `<tr><td>${PawUI.esc(p.title)}</td><td>${p.units}</td><td class="price">${PawUI.money(p.revenue)}</td></tr>`).join("") || "<tr><td colspan='3'>No paid sales yet.</td></tr>"}</tbody></table>
        <h2 style="font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:20px">Orders by step</h2>
        <div class="step-chips">${(s.order_by_step || []).map((x) => `<button type="button" class="step-chip" data-jump-step="${PawUI.esc(x.slug)}"><b>${x.count || 0}</b><span>${PawUI.esc(x.label || x.slug)}</span></button>`).join("") || "<p class='note'>No pipeline counts yet.</p>"}</div>`;
      }
      if (on === "Users") {
        const users = (await api.admin.users()).users || [];
        return `<div class="access-toolbar">
            <p class="note" style="margin:0">${users.length} accounts</p>
            <label class="field-col access-search">Search
              <input id="user-q" type="search" placeholder="Name, email, or role" autocomplete="off" />
            </label>
          </div>
          <table class="table"><thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Joined</th><th></th></tr></thead><tbody>
          ${users.map((u) => `<tr data-hay="${PawUI.esc([u.name, u.email, u.role || "customer"].join(" ").toLowerCase())}"><td>${PawUI.esc(u.email)}</td><td>${PawUI.esc(u.name)}</td>
            <td>${PawUI.esc(u.role || "customer")}</td>
            <td>${u.created_at ? new Date(u.created_at).toLocaleDateString() : ""}</td>
            <td><button class="btn" data-reset="${u.id}">Reset pw</button>
            <button class="btn" data-delu="${u.id}">Delete</button></td></tr>`).join("")}</tbody></table>
          <p class="note" id="user-empty" hidden>No matching accounts.</p>`;
      }
      if (on === "Products") {
        const res = await api.admin.products();
        catalog = res.products || [];
        return `<div class="admin-toolbar">
          <button class="btn btn-accent" id="np">New product</button>
          <select id="bulk-status"><option value="">Bulk status…</option><option>active</option><option>draft</option><option>archived</option></select>
          <select id="bulk-cat"><option value="">Bulk category…</option>${cats.map((c) => `<option value="${c.id}">${PawUI.esc(c.name)}</option>`).join("")}</select>
          <button class="btn" id="bulk-go">Apply to selected</button>
        </div>
        <table class="table"><thead><tr><th></th><th>Title</th><th>Category</th><th>Price</th><th>Status</th><th>PWYW</th><th></th></tr></thead>
        <tbody>${catalog.map((p) => `<tr>
          <td><input type="checkbox" data-pick="${p.id}" /></td>
          <td>${PawUI.esc(p.title)}${p.pinned ? " · pinned" : ""}</td>
          <td>${PawUI.esc(p.category_name)}</td>
          <td class="price">${PawUI.money(p.price_usd)}</td>
          <td>${PawUI.esc(p.status)}</td>
          <td>${p.pwyw_enabled ? "min " + PawUI.money(p.pwyw_min_price) : ""}</td>
          <td>
            <button class="btn" data-editp="${p.id}">Edit</button>
            <button class="btn" data-pin="${p.id}">${p.pinned ? "On banner / unpin" : "Pin"}</button>
            <button class="btn" data-prev="${p.id}">Previews</button>
            <button class="btn" data-delp="${p.id}">Delete</button>
          </td>
        </tr>`).join("")}</tbody></table>`;
      }
      if (on === "Banner") {
        await PawUI.catalog.load();
        const shop = (await api.products.list({ per_page: 200 })).products || [];
        const slides = (await api.products.list({ banner: 1, per_page: 24 })).products || [];
        const slideIds = slides.map((p) => p.id);
        const rest = shop.filter((p) => slideIds.indexOf(p.id) < 0);
        return `<p class="note" style="margin:0 0 16px">Homepage banner slider. Order here is the slide order. Save writes <code>PUT /products/banner</code> on the shop catalog.</p>
          <ol id="banner-list" class="feed" style="max-width:720px">${slides.map((p, i) => `<li data-bid="${p.id}" style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
            <img src="${PawUI.img(p)}" alt="" style="width:72px;height:48px;object-fit:cover;border-radius:8px" />
            <strong style="flex:1">${PawUI.esc(p.title)}</strong>
            <button class="btn" data-bup="${p.id}" ${i === 0 ? "disabled" : ""}>Up</button>
            <button class="btn" data-bdown="${p.id}">Down</button>
            <button class="btn" data-bdel="${p.id}">Remove</button>
          </li>`).join("") || "<p class='note'>No banner slides yet.</p>"}</ol>
          <div class="admin-toolbar">
            <select id="banner-add"><option value="">Add a product…</option>${rest.map((p) => `<option value="${p.id}">${PawUI.esc(p.title)}</option>`).join("")}</select>
            <button class="btn btn-accent" id="banner-save">Save banner</button>
          </div>`;
      }
      if (on === "Categories") {
        const byId = {};
        cats.forEach((c) => { byId[c.id] = c; });
        return `<div class="admin-toolbar">
          <button class="btn btn-accent" id="ncat">New category</button>
        </div>
        <p class="note" style="margin:0 0 16px">Public shop and request forms only list active categories. Rename retargets products; delete is blocked while products or child categories remain.</p>
        <table class="table"><thead><tr><th>Name</th><th>Slug</th><th>Parent</th><th>Sort</th><th>Products</th><th>Public</th><th></th></tr></thead>
        <tbody>${cats.map((c) => `<tr>
          <td>${PawUI.esc(c.name)}</td>
          <td>${PawUI.esc(c.slug)}</td>
          <td>${c.parent_id && byId[c.parent_id] ? PawUI.esc(byId[c.parent_id].name) : "—"}</td>
          <td>${c.sort_order || ""}</td>
          <td>${c.product_count || 0}</td>
          <td>${c.is_active ? "yes" : "hidden"}</td>
          <td>
            <button class="btn" data-editcat="${c.id}">Edit</button>
            <button class="btn" data-delcat="${c.id}">Delete</button>
          </td>
        </tr>`).join("") || "<tr><td colspan='7'>No categories.</td></tr>"}</tbody></table>`;
      }
      if (on === "Bundles") {
        const b = (await api.admin.bundles()).bundles || [];
        const products = (await api.admin.products()).products || [];
        catalog = products;
        return `<button class="btn btn-accent" id="nb" style="margin-bottom:16px">New bundle</button>
          <table class="table"><thead><tr><th>Title</th><th>Price</th><th>Items</th><th>Status</th><th></th></tr></thead>
          <tbody>${b.map((x) => `<tr>
            <td>${PawUI.esc(x.title)}</td>
            <td class="price">${PawUI.money(x.price_usd)}</td>
            <td>${PawUI.esc(x.items || "")}</td>
            <td>${x.status}</td>
            <td><button class="btn" data-editb="${x.id}">Edit</button>
                <button class="btn" data-delb="${x.id}">Delete</button></td>
          </tr>`).join("")}</tbody></table>`;
      }
      if (on === "Coupons") {
        const c = (await api.admin.coupons()).coupons || [];
        catalog = (await api.admin.products()).products || [];
        return `<button class="btn btn-accent" id="nc" style="margin-bottom:16px">New coupon</button>
          <table class="table"><thead><tr><th>Code</th><th>Type</th><th>Value</th><th>Min</th><th>Used</th><th>Expires</th><th>Active</th><th></th></tr></thead>
          <tbody>${c.map((x) => `<tr>
            <td>${PawUI.esc(x.code)}</td><td>${x.discount_type}</td><td>${x.discount_value}</td>
            <td>${x.min_purchase_usd}</td><td>${x.times_used}/${x.usage_limit}</td>
            <td>${x.expires_at ? String(x.expires_at).slice(0, 10) : ""}</td>
            <td>${x.is_active ? "yes" : "no"}</td>
            <td><button class="btn" data-editc="${x.id}">Edit</button>
                <button class="btn" data-delc="${x.id}">Delete</button></td>
          </tr>`).join("")}</tbody></table>`;
      }
      if (on === "Orders") {
        const steps = (await api.admin.orderSteps()).steps || [];
        const res = await api.admin.orders({ status: orderFilter, q: orderQ });
        const o = res.orders || [];
        const by = res.by_step || [];
        const opts = (cur) => steps.map((s) => `<option value="${PawUI.esc(s.slug)}"${s.slug === cur ? " selected" : ""}>${PawUI.esc(s.label)}</option>`).join("");
        return `<div class="step-chips" id="order-filters">
            <button type="button" class="step-chip${orderFilter === "" ? " is-on" : ""}" data-of="">All <b>${res.total || o.length}</b></button>
            ${by.map((x) => `<button type="button" class="step-chip${orderFilter === x.slug ? " is-on" : ""}" data-of="${PawUI.esc(x.slug)}">${PawUI.esc(x.label)} <b>${x.count || 0}</b></button>`).join("")}
          </div>
          <div class="admin-toolbar">
            <label class="field-col">Search
              <input id="order-q" type="search" value="${PawUI.esc(orderQ)}" placeholder="Order id or email" />
            </label>
            <label class="field-col">Move selected
              <select id="bulk-step"><option value="">Choose step…</option>${steps.map((s) => `<option value="${PawUI.esc(s.slug)}">${PawUI.esc(s.label)}</option>`).join("")}</select>
            </label>
            <button class="btn" id="bulk-move" type="button">Move</button>
          </div>
          <table class="table"><thead><tr><th></th><th>ID</th><th>Email</th><th>Step</th><th>Total</th><th>Date</th><th></th></tr></thead>
          <tbody>${o.map((x) => `<tr>
            <td><input type="checkbox" data-oid="${x.id}" /></td>
            <td>#${x.id}</td><td>${PawUI.esc(x.user_email || x.email || "")}</td>
            <td><span class="step-pill">${PawUI.esc(x.status_label || x.status)}</span></td>
            <td class="price">${PawUI.money(x.total_usd)}</td>
            <td>${x.created_at ? new Date(x.created_at).toLocaleDateString() : ""}</td>
            <td><button class="btn" data-ordo="${x.id}">Detail</button>
              <select data-st="${x.id}">${opts(x.status)}</select></td>
          </tr>`).join("") || "<tr><td colspan='7'>No orders in this view.</td></tr>"}</tbody></table>`;
      }
      if (on === "Steps") {
        const steps = (await api.admin.orderSteps()).steps || [];
        return `<p class="note" style="margin:0 0 16px">Pipeline order is top to bottom. System steps can be renamed or reordered but not deleted. Custom steps sit after Paid (seeded: Preparation, Delivered).</p>
          <ol id="step-list" class="step-list">${steps.map((s, i) => `<li data-sid="${s.id}" data-slug="${PawUI.esc(s.slug)}" data-sys="${s.is_system ? 1 : 0}">
            <span class="step-pill">${PawUI.esc(s.label)}</span>
            <code>${PawUI.esc(s.slug)}</code>
            ${s.is_system ? "<em>system</em>" : ""}
            ${s.is_terminal ? "<em>terminal</em>" : ""}
            <button class="btn" type="button" data-sup="${s.id}" ${i === 0 ? "disabled" : ""}>Up</button>
            <button class="btn" type="button" data-sdown="${s.id}">Down</button>
            <button class="btn" type="button" data-sren="${s.id}">Rename</button>
            ${s.is_system ? "" : `<button class="btn" type="button" data-sdel="${s.id}">Delete</button>`}
          </li>`).join("")}</ol>
          <form id="new-step" class="admin-toolbar">
            <label class="field-col">New step <input name="label" required placeholder="Packaging" /></label>
            <button class="btn btn-accent" type="submit">Add step</button>
          </form>`;
      }
      if (on === "Guest") {
        const g = (await api.admin.guestOrders()).orders || [];
        return `<p class="note" style="margin:0 0 16px">Guest checkouts (no JWT). Spec: GET /admin/guest-orders.</p>
          <table class="table"><thead><tr><th>ID</th><th>Email</th><th>Status</th><th>Total</th></tr></thead>
          <tbody>${g.map((x) => `<tr><td>#${x.id}</td><td>${PawUI.esc(x.email)}</td><td>${x.status}</td>
            <td class="price">${PawUI.money(x.total_usd)}</td></tr>`).join("") || "<tr><td colspan='4'>No guest orders yet.</td></tr>"}</tbody></table>`;
      }
      if (on === "Community") {
        const posts = (await api.admin.communityPosts()).posts || [];
        return `<table class="table"><thead><tr><th>User</th><th>Content</th><th>Likes</th><th></th></tr></thead>
          <tbody>${posts.map((p) => `<tr><td>${p.user_id}</td><td>${PawUI.esc(p.content)}</td>
            <td>${p.like_count || 0}</td>
            <td><button class="btn" data-delpost="${p.id}">Delete</button></td></tr>`).join("")}</tbody></table>`;
      }
      if (on === "Referrals") {
        const r = (await api.admin.referrals()).referrals || [];
        return `<table class="table"><thead><tr><th>Code</th><th>User</th><th>Count</th><th>Commission</th></tr></thead>
          <tbody>${r.map((x) => `<tr><td>${PawUI.esc(x.code)}</td><td>${PawUI.esc(x.email)}</td>
            <td>${x.referral_count}</td><td class="price">${PawUI.money(x.total_commission)}</td></tr>`).join("")}</tbody></table>`;
      }
      if (on === "Rates") {
        const r = (await api.admin.rates()).rates || [];
        return `<form id="nr" class="split" style="margin-bottom:16px">
          <div>
            <label class="field-col">Chain <input name="chain" required /></label>
            <label class="field-col">Symbol <input name="symbol" required /></label>
            <label class="field-col">Rate to USD <input name="rate_to_usd" type="number" step="0.0001" required /></label>
          </div>
          <div><button class="btn btn-accent">Set rate</button></div>
        </form>
        <table class="table"><thead><tr><th>Chain</th><th>Symbol</th><th>USD</th><th></th></tr></thead>
        <tbody>${r.map((x) => `<tr><td>${x.chain}</td><td>${x.symbol}</td><td>${x.rate_to_usd}</td>
          <td><button class="btn" data-delr="${PawUI.esc(x.chain)}">Delete</button></td></tr>`).join("")}</tbody></table>`;
      }
      if (on === "Settings") {
        const s = (await api.admin.settings()).settings || [];
        const map = {};
        s.forEach((x) => { map[x.key] = x.value; });
        return `<form id="set-form">
          ${SETTING_KEYS.map((k) => `<label class="field-col">${k}
            <input name="${k}" value="${PawUI.esc(map[k] || "")}" /></label>`).join("")}
          <button class="btn btn-accent">Save settings</button>
        </form>
        <p class="note" style="margin-top:16px">SEO fields live in the SEO tab. Other keys still save via PUT /admin/settings/:key.</p>`;
      }
      if (on === "SEO") {
        const s = (await api.admin.settings()).settings || [];
        const map = {};
        s.forEach((x) => { map[x.key] = x.value; });
        return `<p class="note" style="margin:0 0 16px">Site-wide meta, Open Graph defaults, robots, and canonical host. Per-product title/description/OG are on the product editor. Sitemap: <a href="..//sitemap.xml">//sitemap.xml</a> · <a href="../robots.txt">/robots.txt</a></p>
          <form id="seo-form">
            ${SEO_KEYS.map((k) => `<label class="field-col">${k}
              <input name="${k}" value="${PawUI.esc(map[k] || "")}" /></label>`).join("")}
            <button class="btn btn-accent">Save SEO</button>
          </form>`;
      }
      if (on === "Export") {
        catalog = (await api.admin.products()).products || [];
        return `<form id="ex" class="split">
          <div>
            <label class="field-col">From <input type="date" name="from" /></label>
            <label class="field-col">To <input type="date" name="to" /></label>
            <label class="field-col">Category
              <select name="category"><option value="">Any</option>${cats.map((c) => `<option value="${c.slug}">${PawUI.esc(c.name)}</option>`).join("")}</select>
            </label>
            <label class="field-col">Product
              <select name="product_id"><option value="">Any</option>${catalog.map((p) => `<option value="${p.id}">${PawUI.esc(p.title)}</option>`).join("")}</select>
            </label>
          </div>
          <div><button class="btn btn-accent">Export JSON</button></div>
        </form>
        <div id="ex-out"></div>`;

        const pick = (kind, items, current) => `<div class="theme-pick">${items.map((x) => `
          <button type="button" class="theme-card${x.id === current ? " is-on" : ""}" data-theme-kind="${kind}" data-theme-id="${x.id}">
            ${x.swatch ? `<span class="swatch">${x.swatch.map((c) => `<i style="background:${c}"></i>`).join("")}</span>` : ""}
            <strong>${PawUI.esc(x.name)}</strong>

        return `<p class="note" style="margin:0 0 16px">These tokens apply to every public page. Palette, type, corners, density, icons, contrast, grain, glow, motion, and tracking.</p>
          <h2 style="font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)">Palette</h2>
          ${pick("palette", PawUI.THEME.palettes, t.palette)}
          <h2 style="font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)">Type</h2>
          ${pick("font", PawUI.THEME.fonts, t.font)}
          <h2 style="font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)">Corners</h2>
          ${pick("radius", PawUI.THEME.radii, t.radius)}
          <h2 style="font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)">Density</h2>
          ${pick("density", PawUI.THEME.densities, t.density)}
          <h2 style="font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)">Icons</h2>
          ${pick("icons", PawUI.THEME.icons, t.icons)}
          <h2 style="font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)">Contrast</h2>
          ${pick("contrast", PawUI.THEME.contrasts, t.contrast)}
          <h2 style="font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)">Grain</h2>
          ${pick("grain", PawUI.THEME.grains, t.grain)}
          <h2 style="font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)">Glow</h2>
          ${pick("glow", PawUI.THEME.glows, t.glow)}
          <h2 style="font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)">Motion</h2>
          ${pick("motion", PawUI.THEME.motions, t.motion)}
          <h2 style="font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)">Tracking</h2>
          ${pick("tracking", PawUI.THEME.trackings, t.tracking)}`;
      }
      if (on === "Events") {
        const ttl = await api.admin.eventsTtl().catch(() => ({ seconds: 3600, hours: 1 }));
        const pack = await api.admin.events({ limit: 25 }).catch(() => ({ events: [], total: 0 }));
        const rows = pack.events || [];
        return `<p class="note" style="margin:0 0 16px">Frontend collector writes <code>product_view</code> and <code>checkout_click</code> into MongoDB. Funnel charts still use the old stats path; this tab is the event utility.</p>
          <form id="ttl-form" class="admin-toolbar">
            <label class="field-col">TTL hours
              <input name="hours" type="number" min="0.02" step="0.1" value="${ttl.hours || (ttl.seconds / 3600) || 1}" />
            </label>
            <button class="btn btn-accent">Save TTL</button>
          </form>
          <p class="note">Stored now: ${pack.total || rows.length}. Default TTL is 1 hour.</p>
          <div class="table-wrap"><table class="table"><thead><tr><th>When</th><th>Name</th><th>Path</th><th>Session</th></tr></thead>
            <tbody>${rows.map((e) => `<tr>
              <td>${PawUI.esc(e.received_at || e.occurred_at || "")}</td>
              <td>${PawUI.esc(e.name)}</td>
              <td>${PawUI.esc(e.path || "")}</td>
              <td class="mono">${PawUI.esc((e.session_id || "").slice(0, 12))}</td>
            </tr>`).join("") || "<tr><td colspan='4'>No events yet. Open a product, then click Checkout in the cart.</td></tr>"}</tbody></table></div>`;
      }
      if (on === "Access") {
        if (!token()) {
          return `<form id="unlock" class="auth-card">
            <p class="note" style="margin:0 0 16px">Changing roles and staff tabs needs the operator token in addition to your admin login.</p>
            <label class="field-col">Operator token
              <input name="token" placeholder="admin_secret_staging_2026" autocomplete="off" />
            </label>
            <p class="form-error"></p>
            <button class="btn btn-accent">Unlock Access</button>
          </form>`;
        }
        const users = (await api.admin.users()).users || [];
        return `<div class="access-toolbar">
            <p class="note" style="margin:0">Operator unlocked. Role changes apply on the user's next login. <button class="btn" id="lock">Lock operator</button></p>
            <label class="field-col access-search">Search people
              <input id="access-q" type="search" placeholder="Name, email, or role" autocomplete="off" />
            </label>
          </div>
          <div class="access-grid">${users.map((u) => {
            const tabs = staffTabsOf(u);
            const hay = [u.name, u.email, u.role || "customer", tabs.join(" ")].join(" ").toLowerCase();
            return `<form class="access-form access-card" data-uid="${u.id}" data-hay="${PawUI.esc(hay)}">

                <select name="role">
                  <option value="customer"${u.role === "customer" ? " selected" : ""}>customer</option>
                  <option value="staff"${u.role === "staff" ? " selected" : ""}>staff</option>
                  <option value="admin"${u.role === "admin" ? " selected" : ""}>admin</option>

              <button class="btn btn-accent">Save access</button>
            </form>`;
          }).join("")}</div>
          <p class="note" id="access-empty" hidden>No matching accounts.</p>`;
      }
      return "";
    }

    function bundleForm(b) {

      return `<form id="bf">
        <h2 style="margin-bottom:8px">${b.id ? "Edit bundle" : "Create bundle"}</h2>
        <label class="field-col">Title <input name="title" required value="${PawUI.esc(b.title || "")}" /></label>
        <label class="field-col">Description <textarea name="description">${PawUI.esc(b.description || "")}</textarea></label>

    function couponForm(c) {

      return `<form id="cf">

        <label class="field-col">Code <input name="code" required value="${PawUI.esc(c.code || "")}" /></label>
        <label class="field-col">Type <select name="discount_type"><option value="percentage" ${c.discount_type === "percentage" ? "selected" : ""}>percentage</option><option value="fixed" ${c.discount_type === "fixed" ? "selected" : ""}>fixed</option></select></label>
        <label class="field-col">Value <input name="discount_value" required value="${c.discount_value || ""}" /></label>
        <label class="field-col">Min purchase USD <input name="min_purchase_usd" type="number" step="0.01" value="${c.min_purchase_usd || 0}" /></label>
        <label class="field-col">Usage limit <input name="usage_limit" type="number" value="${c.usage_limit || 100}" /></label>
        <label class="field-col">Expires <input name="expires_at" type="date" value="${c.expires_at ? String(c.expires_at).slice(0, 10) : ""}" /></label>
        <label class="field-col">Product (optional)
          <select name="product_id"><option value="">Cart-wide</option>${catalog.map((p) => `<option value="${p.id}" ${Number(c.product_id) === p.id ? "selected" : ""}>${PawUI.esc(p.title)}</option>`).join("")}</select>

        <button class="btn btn-accent">${c.id ? "Save" : "Create"}</button>
        <button type="button" class="btn" id="cancel-m">Cancel</button>

    async function productEditor(p) {
      let tiers = [];
      let images = [];
      try { tiers = (await api.products.getTiers(p.id)).tiers || []; } catch (e) {}
      try { images = ((await api.products.get(p.slug)).images) || []; } catch (e) {}
      openModal(productForm(p) + `
        <hr style="margin:18px 0;border-color:var(--line)" />
        <h3 style="font-size:14px">Tiers</h3>
        <table class="table">${tiers.map((t) => `<tr><td>${PawUI.esc(t.tier_name)}</td><td>${PawUI.money(t.price_usd)}</td>
          <td><button class="btn" data-delt="${t.id}">Delete</button></td></tr>`).join("")}</table>
        <form id="tf" class="admin-toolbar">
          <input name="tier_name" placeholder="Tier name" required />
          <input name="price_usd" type="number" step="0.01" placeholder="Price" required />
          <button class="btn">Add tier</button>
        </form>
        <h3 style="font-size:14px">Gallery</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${images.map((im) => `<div><img src="${im.url}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:8px" /><br><button class="btn" data-deli="${im.id}">Remove</button></div>`).join("")}</div>
        <form id="imf" class="admin-toolbar">
          <input name="url" placeholder="Image filename or URL (p12.jpg)" required />
          <button class="btn">Add image</button>
        </form>`);
      bindProductModal(p);
    }

    function bindProductModal(p) {
      const card = document.getElementById("modal-card");
      card.querySelector("#cancel-m").onclick = closeModal;
      card.querySelector("#pf").onsubmit = async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const body = {
          title: f.get("title"),
          slug: f.get("slug"),
          description: f.get("description"),
          category_id: Number(f.get("category_id")),
          price_usd: Number(f.get("price_usd")),
          status: f.get("status"),
          digital_formats: f.get("digital_formats"),
          pwyw_enabled: !!f.get("pwyw_enabled"),
          pwyw_min_price: Number(f.get("pwyw_min_price")),
          seo_title: f.get("seo_title"),
          seo_description: f.get("seo_description"),
          og_image: f.get("og_image")
        };
        if (p && p.id) await api.admin.updateProduct(p.id, body);
        else await api.admin.createProduct(body);
        PawUI.catalog.invalidate();
        closeModal();
        render();
      };
      if (!p || !p.id) return;
      const tf = card.querySelector("#tf");
      if (tf) tf.onsubmit = async (e) => {
        e.preventDefault();
        const f = new FormData(tf);
        await api.admin.addTier(p.id, { tier_name: f.get("tier_name"), price_usd: Number(f.get("price_usd")) });
        const fresh = ((await api.admin.products()).products || []).find((x) => x.id === p.id);
        productEditor(fresh);
      };
      const imf = card.querySelector("#imf");
      if (imf) imf.onsubmit = async (e) => {
        e.preventDefault();
        await api.admin.addImage(p.id, { url: new FormData(imf).get("url") });
        const fresh = ((await api.admin.products()).products || []).find((x) => x.id === p.id);
        productEditor(fresh);
      };
      card.querySelectorAll("[data-delt]").forEach((b) => b.onclick = async () => {
        await api.admin.deleteTier(p.id, b.dataset.delt);
        const fresh = ((await api.admin.products()).products || []).find((x) => x.id === p.id);
        productEditor(fresh);
      });
      card.querySelectorAll("[data-deli]").forEach((b) => b.onclick = async () => {
        await api.admin.deleteImage(p.id, b.dataset.deli);
        const fresh = ((await api.admin.products()).products || []).find((x) => x.id === p.id);
        productEditor(fresh);
      });
    }

    async function render() {
      document.getElementById("tabs").innerHTML = deskTabs().map((t) =>
        `<button class="${t === on ? "is-on" : ""}" data-t="${t}">${t}</button>`
      ).join("");
      try {
        document.getElementById("panel").innerHTML = await panel();
      } catch (e) {
        document.getElementById("panel").innerHTML = `<p class="note">${PawUI.esc(e.message)}</p>`;
        return;
      }
      document.getElementById("panel").querySelectorAll("table.table").forEach((t) => {
        if (t.parentElement && t.parentElement.classList.contains("table-wrap")) return;
        const w = document.createElement("div");
        w.className = "table-wrap";
        t.parentNode.insertBefore(w, t);
        w.appendChild(t);
      });
      bindPanel();
    }

    function catBody(f) {
      const name = String(f.get("name") || "").trim();
      const slug = String(f.get("slug") || "").trim() || name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      return {
        name,
        slug,
        description: f.get("description"),
        parent_id: Number(f.get("parent_id")) || 0,
        sort_order: Number(f.get("sort_order")) || 0,
        image_url: f.get("image_url"),
        is_active: !!f.get("is_active")
      };
    }

    function selectedIds() {
      return [...document.querySelectorAll("[data-pick]:checked")].map((x) => Number(x.dataset.pick));
    }

    function bindPanel() {
      const p = document.getElementById("panel");
      p.querySelectorAll("[data-reset]").forEach((b) => b.onclick = async () => {
        const r = await api.admin.resetPassword(b.dataset.reset);
        PawUI.toast(r.new_password);
      });
      p.querySelectorAll("[data-delu]").forEach((b) => b.onclick = async () => { await api.admin.deleteUser(b.dataset.delu); render(); });
      p.querySelectorAll("[data-pin]").forEach((b) => b.onclick = async () => {
        const row = catalog.find((x) => x.id === Number(b.dataset.pin));
        if (row && row.pinned) await api.admin.unpin(b.dataset.pin);
        else await api.admin.pin(b.dataset.pin);
        PawUI.catalog.invalidate();
        render();
      });
      function bannerIds() {
        return [...p.querySelectorAll("#banner-list [data-bid]")].map((el) => Number(el.dataset.bid));
      }
      function bindBannerMoves() {
        p.querySelectorAll("[data-bdel]").forEach((b) => { b.onclick = () => { const li = b.closest("[data-bid]"); if (li) li.remove(); }; });
        p.querySelectorAll("[data-bup]").forEach((b) => { b.onclick = () => { const li = b.closest("[data-bid]"); if (li && li.previousElementSibling) li.parentNode.insertBefore(li, li.previousElementSibling); }; });
        p.querySelectorAll("[data-bdown]").forEach((b) => { b.onclick = () => { const li = b.closest("[data-bid]"); if (li && li.nextElementSibling) li.parentNode.insertBefore(li.nextElementSibling, li); }; });
      }
      bindBannerMoves();
      const bsave = p.querySelector("#banner-save");
      if (bsave) bsave.onclick = async () => {
        await api.products.setBanner(bannerIds());
        PawUI.catalog.invalidate();
        PawUI.toast("Banner saved");
        render();
      };
      const badd = p.querySelector("#banner-add");
      if (badd) badd.onchange = () => {
        const id = Number(badd.value);
        if (!id) return;
        const opt = badd.selectedOptions[0];
        const list = p.querySelector("#banner-list");
        if (list && !list.querySelector(`[data-bid="${id}"]`)) {
          if (list.querySelector(".note")) list.innerHTML = "";
          const li = document.createElement("li");
          li.dataset.bid = String(id);
          li.style.cssText = "display:flex;gap:10px;align-items:center;margin-bottom:10px";
          li.innerHTML = `<strong style="flex:1">${PawUI.esc(opt.textContent)}</strong>
            <button class="btn" data-bup="${id}">Up</button>
            <button class="btn" data-bdown="${id}">Down</button>
            <button class="btn" data-bdel="${id}">Remove</button>`;
          list.appendChild(li);
        }
        badd.value = "";
        bindBannerMoves();
      };
      p.querySelectorAll("[data-delp]").forEach((b) => b.onclick = async () => { await api.admin.deleteProduct(b.dataset.delp); PawUI.catalog.invalidate(); render(); });
      p.querySelectorAll("[data-prev]").forEach((b) => b.onclick = async () => { await api.admin.generatePreviews(b.dataset.prev); PawUI.toast("Previews generated"); });
      p.querySelectorAll("[data-editp]").forEach((b) => b.onclick = () => {
        const row = catalog.find((x) => x.id === Number(b.dataset.editp));
        productEditor(row);
      });
      const np = p.querySelector("#np");
      if (np) np.onclick = () => { openModal(productForm({})); bindProductModal(null); };
      const bulk = p.querySelector("#bulk-go");
      if (bulk) bulk.onclick = async () => {
        const ids = selectedIds();
        if (!ids.length) { PawUI.toast("Select products"); return; }
        const status = document.getElementById("bulk-status").value;
        const category_id = document.getElementById("bulk-cat").value;
        const body = { ids };
        if (status) body.status = status;
        if (category_id) body.category_id = Number(category_id);
        await api.admin.bulkProducts(body);
        PawUI.catalog.invalidate();
        render();
      };
      const ncat = p.querySelector("#ncat");
      if (ncat) ncat.onclick = () => {
        openModal(categoryForm({}));
        document.getElementById("cancel-m").onclick = closeModal;
        document.getElementById("catf").onsubmit = async (e) => {
          e.preventDefault();
          try {
            await api.admin.createCategory(catBody(new FormData(e.target)));
            PawUI.catalog.invalidate();
            closeModal(); render();
          } catch (ex) { PawUI.toast(ex.message); }
        };
      };
      p.querySelectorAll("[data-editcat]").forEach((b) => b.onclick = () => {
        const row = cats.find((x) => x.id === Number(b.dataset.editcat));
        openModal(categoryForm(row));
        document.getElementById("cancel-m").onclick = closeModal;
        document.getElementById("catf").onsubmit = async (e) => {
          e.preventDefault();
          try {
            await api.admin.updateCategory(row.id, catBody(new FormData(e.target)));
            PawUI.catalog.invalidate();
            closeModal(); render();
          } catch (ex) { PawUI.toast(ex.message); }
        };
      });
      p.querySelectorAll("[data-delcat]").forEach((b) => b.onclick = async () => {
        try {
          await api.admin.deleteCategory(b.dataset.delcat);
          PawUI.catalog.invalidate();
          render();
        } catch (ex) { PawUI.toast(ex.message); }
      });
      const nb = p.querySelector("#nb");
      if (nb) nb.onclick = () => {
        openModal(bundleForm({}));
        document.getElementById("cancel-m").onclick = closeModal;
        document.getElementById("bf").onsubmit = async (e) => {
          e.preventDefault();
          const f = new FormData(e.target);
          await api.admin.createBundle({
            title: f.get("title"),
            description: f.get("description"),
            price_usd: Number(f.get("price_usd")),
            status: f.get("status"),
            product_ids: f.getAll("pid").map(Number)
          });
          closeModal(); render();
        };
      };
      p.querySelectorAll("[data-editb]").forEach((b) => b.onclick = async () => {
        const bundles = (await api.admin.bundles()).bundles || [];
        const row = bundles.find((x) => x.id === Number(b.dataset.editb));
        openModal(bundleForm(row));
        document.getElementById("cancel-m").onclick = closeModal;
        document.getElementById("bf").onsubmit = async (e) => {
          e.preventDefault();
          const f = new FormData(e.target);
          await api.admin.updateBundle(row.id, {
            title: f.get("title"),
            description: f.get("description"),
            price_usd: Number(f.get("price_usd")),
            status: f.get("status"),
            product_ids: f.getAll("pid").map(Number)
          });
          closeModal(); render();
        };
      });
      p.querySelectorAll("[data-delb]").forEach((b) => b.onclick = async () => { await api.admin.deleteBundle(b.dataset.delb); render(); });
      const nc = p.querySelector("#nc");
      if (nc) nc.onclick = () => {
        openModal(couponForm({}));
        document.getElementById("cancel-m").onclick = closeModal;
        document.getElementById("cf").onsubmit = async (e) => {
          e.preventDefault();
          const f = new FormData(e.target);
          await api.admin.createCoupon({
            code: f.get("code"),
            discount_type: f.get("discount_type"),
            discount_value: Number(f.get("discount_value")),
            min_purchase_usd: Number(f.get("min_purchase_usd")),
            usage_limit: Number(f.get("usage_limit")),
            expires_at: f.get("expires_at"),
            product_id: f.get("product_id") ? Number(f.get("product_id")) : null,
            is_active: !!f.get("is_active")
          });
          closeModal(); render();
        };
      };
      p.querySelectorAll("[data-editc]").forEach((b) => b.onclick = async () => {
        const coupons = (await api.admin.coupons()).coupons || [];
        const row = coupons.find((x) => x.id === Number(b.dataset.editc));
        openModal(couponForm(row));
        document.getElementById("cancel-m").onclick = closeModal;
        document.getElementById("cf").onsubmit = async (e) => {
          e.preventDefault();
          const f = new FormData(e.target);
          await api.admin.updateCoupon(row.id, {
            code: f.get("code"),
            discount_type: f.get("discount_type"),
            discount_value: Number(f.get("discount_value")),
            min_purchase_usd: Number(f.get("min_purchase_usd")),
            usage_limit: Number(f.get("usage_limit")),
            expires_at: f.get("expires_at"),
            product_id: f.get("product_id") ? Number(f.get("product_id")) : null,
            is_active: !!f.get("is_active")
          });
          closeModal(); render();
        };
      });
      p.querySelectorAll("[data-delc]").forEach((b) => b.onclick = async () => { await api.admin.deleteCoupon(b.dataset.delc); render(); });
      p.querySelectorAll("[data-delpost]").forEach((b) => b.onclick = async () => { await api.admin.deletePost(b.dataset.delpost); render(); });
      p.querySelectorAll("[data-jump-step]").forEach((b) => b.onclick = () => {
        orderFilter = b.dataset.jumpStep || "";
        if (deskTabs().indexOf("Orders") >= 0) { on = "Orders"; showDesk(); }
      });
      p.querySelectorAll("[data-of]").forEach((b) => b.onclick = () => { orderFilter = b.dataset.of || ""; render(); });
      const oq = p.querySelector("#order-q");
      if (oq) {
        oq.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); orderQ = oq.value.trim(); render(); } };
        oq.onchange = () => { orderQ = oq.value.trim(); render(); };
      }
      const bulkMove = p.querySelector("#bulk-move");
      if (bulkMove) bulkMove.onclick = async () => {
        const slug = (document.getElementById("bulk-step") || {}).value;
        if (!slug) { PawUI.toast("Choose a step"); return; }
        const ids = [...p.querySelectorAll("[data-oid]:checked")].map((i) => i.dataset.oid);
        if (!ids.length) { PawUI.toast("Select orders first"); return; }
        for (const id of ids) await api.admin.setOrderStatus(id, slug);
        render();
      };
      async function persistStepOrder() {
        const rows = [...p.querySelectorAll("#step-list li")].map((li, i) => ({
          id: Number(li.dataset.sid),
          slug: li.dataset.slug,
          label: (li.querySelector(".step-pill") || {}).textContent || li.dataset.slug,
          sort_order: i + 1
        }));
        await api.admin.saveOrderSteps(rows);
        render();
      }
      p.querySelectorAll("[data-sup]").forEach((b) => b.onclick = async () => {
        const li = b.closest("li");
        if (li && li.previousElementSibling) li.parentNode.insertBefore(li, li.previousElementSibling);
        await persistStepOrder();
      });
      p.querySelectorAll("[data-sdown]").forEach((b) => b.onclick = async () => {
        const li = b.closest("li");
        if (li && li.nextElementSibling) li.parentNode.insertBefore(li.nextElementSibling, li);
        await persistStepOrder();
      });
      p.querySelectorAll("[data-sren]").forEach((b) => b.onclick = async () => {
        const li = b.closest("li");
        const cur = (li.querySelector(".step-pill") || {}).textContent || "";
        const label = window.prompt("Rename step", cur);
        if (!label) return;
        await api.admin.renameOrderStep(b.dataset.sren, label);
        render();
      });
      p.querySelectorAll("[data-sdel]").forEach((b) => b.onclick = async () => {
        if (!window.confirm("Delete this step?")) return;
        try { await api.admin.deleteOrderStep(b.dataset.sdel); render(); }
        catch (e) { PawUI.toast(e.message); }
      });
      const ns = p.querySelector("#new-step");
      if (ns) ns.onsubmit = async (e) => {
        e.preventDefault();
        const label = new FormData(ns).get("label");
        try { await api.admin.createOrderStep({ label }); render(); }
        catch (err) { PawUI.toast(err.message); }
      };
      p.querySelectorAll("[data-st]").forEach((s) => s.onchange = async () => {
        try { await api.admin.setOrderStatus(s.dataset.st, s.value); render(); }
        catch (e) { PawUI.toast(e.message); }
      });
      p.querySelectorAll("[data-ordo]").forEach((b) => b.onclick = async () => {
        const d = await api.admin.getOrder(b.dataset.ordo);
        const o = d.order || {};
        const steps = (await api.admin.orderSteps()).steps || [];
        const opts = steps.map((s) => `<option value="${PawUI.esc(s.slug)}"${s.slug === o.status ? " selected" : ""}>${PawUI.esc(s.label)}</option>`).join("");
        openModal(`<h2>Order #${o.id}</h2>
          <p>${PawUI.esc(o.user_email || "")} · <span class="step-pill">${PawUI.esc(d.status_label || o.status)}</span> · ${PawUI.money(o.total_usd)}</p>
          <table class="table">${(d.items || []).map((it) => `<tr><td>${PawUI.esc(it.product_title || ("#" + it.product_id))}</td><td>${it.quantity}</td><td>${PawUI.money(it.unit_price_usd)}</td></tr>`).join("")}</table>
          <label class="field-col" style="margin:16px 0">Move to
            <select id="detail-st">${opts}</select>
          </label>
          <div class="admin-toolbar"><button class="btn btn-accent" id="detail-move" type="button">Save step</button>
          <button class="btn" id="cancel-m" type="button">Close</button></div>`);
        document.getElementById("cancel-m").onclick = closeModal;
        document.getElementById("detail-move").onclick = async () => {
          await api.admin.setOrderStatus(o.id, document.getElementById("detail-st").value);
          closeModal(); render();
        };
      });
      p.querySelectorAll("[data-delr]").forEach((b) => b.onclick = async () => { await api.admin.deleteRate(b.dataset.delr); render(); });
      p.querySelectorAll("[data-req]").forEach((s) => s.onchange = async () => { await api.admin.setRequestStatus(s.dataset.req, s.value); render(); });
      const nr = p.querySelector("#nr");
      if (nr) nr.onsubmit = async (e) => {
        e.preventDefault();
        const f = new FormData(nr);
        await api.admin.setRate(f.get("chain"), { symbol: f.get("symbol"), rate_to_usd: Number(f.get("rate_to_usd")) });
        render();
      };
      const setForm = p.querySelector("#set-form");
      if (setForm) setForm.onsubmit = async (e) => {
        e.preventDefault();
        const f = new FormData(setForm);
        for (const [k, v] of f.entries()) await api.admin.setSetting(k, v);
        PawUI.toast("Saved");
      };
      const seoForm = p.querySelector("#seo-form");
      if (seoForm) seoForm.onsubmit = async (e) => {
        e.preventDefault();
        const f = new FormData(seoForm);
        for (const [k, v] of f.entries()) await api.admin.setSetting(k, v);
        PawUI.toast("SEO saved");
      };
      const ex = p.querySelector("#ex");
      if (ex) ex.onsubmit = async (e) => {
        e.preventDefault();
        const f = new FormData(ex);
        const data = await api.admin.exportEmails({
          from: f.get("from"), to: f.get("to"), category: f.get("category"), product_id: f.get("product_id") ? Number(f.get("product_id")) : undefined
        });
        document.getElementById("ex-out").innerHTML = `<p class="note" style="margin:16px 0">${data.count} emails</p>
          <table class="table"><thead><tr><th>Email</th><th>Name</th><th>Purchases</th></tr></thead>
          <tbody>${(data.users || []).map((u) => `<tr><td>${PawUI.esc(u.email)}</td><td>${PawUI.esc(u.name)}</td><td>${u.total_purchases || ""}</td></tr>`).join("")}</tbody></table>`;
      };
      const ttlForm = p.querySelector("#ttl-form");
      if (ttlForm) ttlForm.onsubmit = async (e) => {
        e.preventDefault();
        const hours = Number(new FormData(ttlForm).get("hours"));
        await api.admin.setEventsTtl({ hours });
        PawUI.toast("Event TTL saved");
        render();
      };
      const unlock = p.querySelector("#unlock");
      if (unlock) unlock.onsubmit = async (e) => {
        e.preventDefault();
        const t = (new FormData(e.target).get("token") || "").trim();
        if (!t) {
          e.target.querySelector(".form-error").textContent = "Token required";
          return;
        }
        setToken(t);
        render();
      };
      const lock = p.querySelector("#lock");
      if (lock) lock.onclick = () => { clearToken(); render(); };
      p.querySelectorAll("[data-theme-kind]").forEach((b) => {
        b.onclick = async () => {
          const cur = Object.assign(PawUI.defaultTheme(), await api.appearance.get().catch(() => ({})));
          cur[b.dataset.themeKind] = b.dataset.themeId;
          const saved = await api.appearance.set(cur);
          PawUI.applyTheme(saved);
          try { localStorage.setItem("pawradise_theme", JSON.stringify(saved)); } catch (e) { /* ignore */ }
          PawUI.toast("Look saved");
          render();
        };
      });
      p.querySelectorAll("form.access-form").forEach((form) => {
        form.onsubmit = async (e) => {
          e.preventDefault();
          const role = form.querySelector("[name=role]").value;
          const staff_tabs = [...form.querySelectorAll("[name=tab]:checked")].map((x) => x.value);
          await api.admin.setUserAccess(form.dataset.uid, { role, staff_tabs });
          PawUI.toast("Access saved");
          render();
        };
      });
      function bindFilter(inputSel, itemSel, emptySel) {
        const input = p.querySelector(inputSel);
        if (!input) return;
        const apply = () => {
          const s = input.value.trim().toLowerCase();
          let n = 0;
          p.querySelectorAll(itemSel).forEach((el) => {
            const hay = (el.dataset.hay || el.textContent || "").toLowerCase();
            const on = !s || hay.indexOf(s) >= 0;
            el.hidden = !on;
            if (on) n++;
          });
          const empty = emptySel && p.querySelector(emptySel);
          if (empty) empty.hidden = n > 0;
        };
        input.oninput = apply;
      }
      bindFilter("#access-q", "form.access-form", "#access-empty");
      bindFilter("#user-q", "tbody tr[data-hay]", "#user-empty");
    }

    document.getElementById("tabs").onclick = (e) => {
      const b = e.target.closest("[data-t]");
      if (!b) return;
      on = b.dataset.t;
      render();
    };

    (async function boot() {
      try { meUser = await api.auth.getProfile(); } catch (e) { meUser = null; }
      if (!meUser) { gateView("login"); return; }
      if (meUser.role !== "admin" && meUser.role !== "staff") { gateView("customer"); return; }
      const vis = deskTabs();
      if (!vis.length) { gateView("empty"); return; }
      if (vis.indexOf(on) < 0) on = vis[0];
      showDesk();
    })();
  </script>
</body>
</html>
