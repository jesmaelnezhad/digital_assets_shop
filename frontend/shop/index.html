<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAWRADISE — Shop</title>
<style>
  /* === SHARED THEME (same across all MFEs) === */
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0a0a0f; --surface:#14141f; --surface2:#1a1a2a;
    --border:#2a2a3a; --text:#e0e0e0; --text2:#8888aa;
    --cyan:#00d4ff; --magenta:#ff0066; --green:#00ff88;
    --mono:Consolas,'Courier New',monospace;
    --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; line-height:1.6; }
  .header {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 24px; background:var(--surface);
    border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100;
    box-shadow:0 0 20px rgba(0,212,255,0.05);
  }
  .logo {
    font-family:var(--mono); font-size:20px; font-weight:bold;
    color:var(--cyan); letter-spacing:2px; text-decoration:none;
    text-shadow:0 0 10px rgba(0,212,255,0.5);
  }
  .logo span { color:var(--magenta); text-shadow:0 0 10px rgba(255,0,102,0.5); }
  .header nav { display:flex; gap:24px; align-items:center; }
  .header nav a {
    color:var(--text2); text-decoration:none; font-size:13px;
    font-family:var(--mono); transition:color 0.2s; letter-spacing:1px;
  }
  .header nav a:hover { color:var(--cyan); text-shadow:0 0 8px rgba(0,212,255,0.5); }
  .header nav a.active { color:var(--cyan); }
  .env-badge {
    font-family:var(--mono); font-size:10px; color:var(--text2);
    margin-left:16px; padding:4px 10px; border-radius:10px;
    border:1px solid var(--border); letter-spacing:1px;
  }
  .auth-btn {
    background:transparent; border:1px solid var(--cyan); color:var(--cyan);
    font-family:var(--mono); font-size:12px; padding:6px 14px;
    border-radius:4px; cursor:pointer; margin-left:12px; letter-spacing:1px;
    transition:all 0.2s;
  }
  .auth-btn:hover { background:var(--cyan); color:var(--bg); }
  .terminal-line {
    font-family:var(--mono); font-size:11px; color:var(--text2);
    padding:8px 16px; border-bottom:1px solid var(--border); background:var(--surface);
    user-select:none;
  }
  .terminal-line .prompt { color:var(--cyan); }
  .terminal-line .cursor {
    display:inline-block; width:8px; height:14px; background:var(--cyan);
    animation:blink 1s step-end infinite; vertical-align:text-bottom; margin-left:2px;
  }
  @keyframes blink { 50% { opacity:0; } }

  .container { max-width:1200px; margin:0 auto; padding:32px 24px; }
  .section-title {
    font-family:var(--mono); font-size:11px; color:var(--cyan);
    text-transform:uppercase; letter-spacing:2px; margin-bottom:16px;
    padding-bottom:8px; border-bottom:1px solid var(--border);
  }
  .controls { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .search-box {
    flex:1; min-width:200px; display:flex; align-items:center;
    background:var(--surface); border:1px solid var(--border);
    border-radius:4px; padding:0 12px;
  }
  .search-box .icon { color:var(--text2); font-family:var(--mono); font-size:13px; margin-right:8px; }
  .search-box input {
    flex:1; background:transparent; border:none; color:var(--text);
    padding:10px 8px; font-size:13px; outline:none; font-family:var(--mono);
  }
  .search-box input:focus { color:var(--cyan); }
  .filter-tabs { display:flex; gap:4px; background:var(--surface); padding:4px; border-radius:4px; border:1px solid var(--border); }
  .filter-tab {
    padding:6px 14px; border:none; background:transparent; color:var(--text2);
    font-family:var(--mono); font-size:11px; cursor:pointer; border-radius:3px;
    transition:all 0.2s; letter-spacing:1px;
  }
  .filter-tab:hover { color:var(--text); }
  .filter-tab.active { background:var(--cyan); color:var(--bg); font-weight:bold; }

  .product-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; margin:16px 0; }
  .product-card {
    background:var(--surface); border:1px solid var(--border); border-radius:6px;
    overflow:hidden; cursor:pointer; transition:border-color 0.2s,transform 0.2s;
    display:flex; flex-direction:column;
  }
  .product-card:hover { border-color:var(--cyan); transform:translateY(-2px); box-shadow:0 4px 20px rgba(0,212,255,0.15); }
  .product-card .image { width:100%; height:140px; background:var(--surface2); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .product-card .image img { width:100%; height:100%; object-fit:cover; }
  .product-card .image .placeholder { font-family:var(--mono); font-size:11px; color:var(--text2); text-align:center; padding:16px; }
  .product-card .body { padding:12px 14px; flex:1; display:flex; flex-direction:column; }
  .product-card .category { font-family:var(--mono); font-size:10px; color:var(--cyan); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
  .product-card .title { font-size:14px; font-weight:600; color:var(--text); margin-bottom:4px; line-height:1.3; }
  .product-card .desc { font-size:12px; color:var(--text2); margin-bottom:8px; flex:1; line-height:1.4; }
  .product-card .footer { display:flex; align-items:center; justify-content:space-between; padding-top:8px; border-top:1px solid var(--border); }
  .price { font-family:var(--mono); font-size:16px; font-weight:bold; color:var(--green); }
  .btn {
    display:inline-block; padding:8px 16px; background:var(--cyan); color:var(--bg);
    border:none; border-radius:4px; font-family:var(--mono); font-size:11px;
    font-weight:bold; letter-spacing:1px; cursor:pointer; text-decoration:none;
    transition:all 0.2s;
  }
  .btn:hover { box-shadow:0 0 16px rgba(0,212,255,0.5); }
  .btn-buy { padding:6px 14px; font-size:11px; }

  .empty-state { text-align:center; padding:48px 0; color:var(--text2); }
  .empty-state .icon { font-size:48px; margin-bottom:12px; opacity:0.3; }
  .footer { border-top:1px solid var(--border); padding:16px; text-align:center; font-size:11px; color:var(--text2); font-family:var(--mono); }
  .loading { text-align:center; padding:64px 0; color:var(--text2); font-family:var(--mono); }
  .loading .spinner { width:24px; height:24px; border:2px solid var(--border); border-top-color:var(--cyan); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 12px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .error-msg { color:var(--magenta); font-family:var(--mono); font-size:12px; padding:12px; background:rgba(255,0,102,0.08); border:1px solid var(--magenta); border-radius:4px; margin:12px 0; }
</style>
</head>
<body>

<div class="terminal-line"><span class="prompt">guest@pawradise</span>:<span>~</span>$ ./shop --browse<span class="cursor"></span></div>

<header class="header">
  <a href="/" class="logo">PAW<span>RADISE</span></a>
  <nav style="margin-right:24px;">
    <a href="/" data-nav="shop" class="active">SHOP</a>
    <a href="/community" data-nav="community">COMMUNITY</a>
    <a href="/account" data-nav="account">ACCOUNT</a>
  </nav>
  <div style="display:flex;align-items:center;">
    <button id="authBtn" class="auth-btn">LOGIN</button>
    <span id="envBadge" class="env-badge"></span>
  </div>
</header>

<div class="container">
  <div class="section-title">DIGITAL <span style="color:var(--magenta)">ASSET</span> SHOP</div>

  <div class="controls">
    <div class="search-box">
      <span class="icon">&gt;_</span>
      <input type="text" id="searchInput" placeholder="search products..." autocomplete="off">
    </div>
    <div class="filter-tabs" id="categoryTabs"></div>
  </div>

  <div id="productGrid" class="product-grid">
    <div class="loading"><div class="spinner"></div><span>fetching products...</span></div>
  </div>

  <div id="errorBox"></div>
</div>

<div class="footer">PAWRADISE &copy; 2026 &mdash; <span id="envText">production</span> environment</div>

<script>
(function() {
  var path = window.location.pathname;
  var isStaging = path.startsWith('/staging');
  var API_BASE = isStaging ? '/staging/api/v1' : '/api/v1';
  var LINK_BASE = isStaging ? '/staging' : '';

  // Env badge
  document.getElementById('envBadge').textContent = isStaging ? 'ENV: staging' : 'ENV: production';
  document.getElementById('envText').textContent = isStaging ? 'staging' : 'production';

  // Auth button
  (function() {
    var b = document.getElementById('authBtn');
    if (!b) return;
    var t = localStorage.getItem('pawradise_token');
    if (t) {
      b.textContent = 'LOGOUT';
      b.onclick = function() { localStorage.removeItem('pawradise_token'); window.location.href = LINK_BASE + '/'; };
    } else {
      b.textContent = 'LOGIN';
      b.onclick = function() { window.location.href = LINK_BASE + '/auth/?redirect=' + encodeURIComponent(window.location.pathname); };
    }
  })();

  // Highlight nav
  (function() {
    var pg = document.body.getAttribute('data-page');
    var el = document.querySelector('[data-nav="' + pg + '"]');
    if (el) el.style.color = 'var(--cyan)';
  })();

  // State
  var products = [];
  var categories = [];
  var currentCategory = '';
  var currentSearch = '';

  // DOM
  var grid = document.getElementById('productGrid');
  var searchInput = document.getElementById('searchInput');
  var categoryTabs = document.getElementById('categoryTabs');
  var errorBox = document.getElementById('errorBox');

  function escapeHtml(text) {
    var d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  function showError(msg) {
    errorBox.innerHTML = '<div class="error-msg">' + escapeHtml(msg) + '</div>';
  }

  function clearError() { errorBox.innerHTML = ''; }

  // Fetch products
  async function fetchProducts(category, search, page) {
    page = page || 1;
    var url = API_BASE + '/products?page=' + page + '&per_page=12';
    if (category) url += '&category=' + encodeURIComponent(category);
    if (search) url += '&search=' + encodeURIComponent(search);

    try {
      var res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      products = data.products || [];
      renderProducts(products);
      return data.total || 0;
    } catch (e) {
      grid.innerHTML = '<div class="empty-state"><div class="icon">!</div><div>Failed to load products. <button class="btn btn-buy" onclick="fetchProducts()">retry</button></div></div>';
      showError('Failed to fetch products: ' + e.message);
    }
  }

  // Fetch categories
  async function fetchCategories() {
    try {
      var res = await fetch(API_BASE + '/categories');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      categories = data.categories || [];

      // Clear existing tabs (keep "ALL")
      Array.from(categoryTabs.querySelectorAll('.filter-tab')).forEach(function(t) {
        if (t.dataset.category !== '') t.remove();
      });

      categories.forEach(function(cat) {
        var btn = document.createElement('button');
        btn.className = 'filter-tab' + (cat.slug === currentCategory ? ' active' : '');
        btn.textContent = cat.name;
        btn.dataset.category = cat.slug;
        btn.onclick = function() {
          Array.from(categoryTabs.querySelectorAll('.filter-tab')).forEach(function(t) { t.classList.remove('active'); });
          btn.classList.add('active');
          currentCategory = cat.slug;
          fetchProducts(currentCategory, currentSearch);
        };
        categoryTabs.appendChild(btn);
      });
    } catch (e) {
      console.error(e);
    }
  }

  // Render products
  function renderProducts(products) {
    if (!products || products.length === 0) {
      var searchNote = currentSearch ? ' for "' + escapeHtml(currentSearch) + '"' : '';
      grid.innerHTML =
        '<div class="empty-state">' +
        '<div class="icon">NO_RESULTS</div>' +
        '<div>no products found' + searchNote + '</div>' +
        '<div style="margin-top:8px;font-size:11px;">try a different search or category</div>' +
        '</div>';
      return;
    }

    grid.innerHTML = products.map(function(p) {
      var primaryImg = (p.images && p.images.length > 0) ? p.images.find(function(i) { return i.is_primary; }) : null;
      var imgHtml;
      if (primaryImg) {
        imgHtml = '<img src="' + primaryImg.url + '" alt="' + escapeHtml(p.title) + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +
          '<div class="placeholder" style="display:none">[' + escapeHtml(p.slug) + ']</div>';
      } else {
        imgHtml = '<div class="placeholder">' + escapeHtml(p.slug) + '</div>';
      }

      return '' +
        '<div class="product-card" onclick="window.location.href=\'' + LINK_BASE + '/product-detail/' + p.slug + '\'">' +
          '<div class="image">' + imgHtml + '</div>' +
          '<div class="body">' +
            '<div class="category">' + escapeHtml(p.category_name || 'uncategorized') + '</div>' +
            '<div class="title">' + escapeHtml(p.title) + '</div>' +
            '<div class="desc">' + escapeHtml(p.description) + '</div>' +
            '<div class="footer">' +
              '<span class="price">$' + p.price_usd + '</span>' +
              '<button class="btn btn-buy" onclick="event.stopPropagation();buyProduct(\'' + p.slug + '\')">BUY</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    }).join('');
  }

  function buyProduct(slug) {
    var token = localStorage.getItem('pawradise_token');
    if (!token) {
      window.location.href = LINK_BASE + '/auth/?redirect=' + encodeURIComponent(LINK_BASE + '/product-detail/' + slug);
      return;
    }
    window.location.href = LINK_BASE + '/product-detail/' + slug;
  }

  // Search with debounce
  var searchTimeout;
  searchInput.addEventListener('input', function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(function() {
      currentSearch = searchInput.value.trim();
      fetchProducts(currentCategory, currentSearch);
    }, 300);
  });

  // Init
  fetchCategories();
  fetchProducts();

  // Expose for inline onclick
  window.fetchProducts = fetchProducts;
  window.buyProduct = buyProduct;
})();
</script>
</body>
</html>
