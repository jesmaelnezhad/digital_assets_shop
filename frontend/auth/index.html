<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAWRADISE — Login</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0a0a0f; --surface:#14141f; --surface2:#1a1a2a;
    --border:#2a2a3a; --text:#e0e0e0; --text2:#8888aa;
    --cyan:#00d4ff; --magenta:#ff0066; --green:#00ff88;
    --mono:Consolas,'Courier New',monospace;
    --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; line-height:1.6; }
  .terminal-line { font-family:var(--mono); font-size:11px; color:var(--text2); padding:8px 16px; border-bottom:1px solid var(--border); background:var(--surface); }
  .terminal-line .prompt { color:var(--cyan); }
  .terminal-line .cursor {
    display:inline-block; width:8px; height:14px; background:var(--cyan);
    animation:blink 1s step-end infinite; vertical-align:text-bottom; margin-left:2px;
  }
  @keyframes blink { 50% { opacity:0; } }

  .page { max-width:420px; margin:0 auto; padding:40px 24px; min-height:100vh; display:flex; flex-direction:column; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:32px; flex:1; }
  .card-title { font-family:var(--mono); font-size:18px; color:var(--text); text-align:center; margin-bottom:24px; letter-spacing:1px; }
  .card-subtitle { font-family:var(--mono); font-size:11px; color:var(--text2); text-align:center; margin-bottom:24px; letter-spacing:1px; }

  .field { margin-bottom:16px; }
  .field label { display:block; font-family:var(--mono); font-size:11px; color:var(--text2); margin-bottom:6px; letter-spacing:1px; }
  .field input {
    width:100%; padding:10px 14px; background:var(--bg); border:1px solid var(--border);
    color:var(--text); font-size:13px; font-family:var(--mono); border-radius:4px; outline:none;
  }
  .field input:focus { border-color:var(--cyan); box-shadow:0 0 8px rgba(0,212,255,0.2); }
  .field input.error { border-color:var(--magenta); }

  .submit-btn {
    width:100%; padding:12px; background:var(--cyan); color:var(--bg); border:none;
    border-radius:4px; font-family:var(--mono); font-size:13px; font-weight:bold;
    letter-spacing:1px; cursor:pointer; transition:all 0.2s; margin-top:8px;
  }
  .submit-btn:hover { box-shadow:0 0 16px rgba(0,212,255,0.5); }
  .submit-btn:disabled { background:var(--surface2); color:var(--text2); cursor:wait; }

  .switch-link { display:block; text-align:center; margin-top:20px; color:var(--text2); font-size:12px; }
  .switch-link a { color:var(--cyan); text-decoration:none; }
  .switch-link a:hover { text-shadow:0 0 8px rgba(0,212,255,0.5); }
  .error-msg { color:var(--magenta); font-family:var(--mono); font-size:11px; padding:10px 12px; background:rgba(255,0,102,0.08); border:1px solid var(--magenta); border-radius:4px; margin-bottom:12px; }
  .success-msg { color:var(--green); font-family:var(--mono); font-size:11px; padding:10px 12px; background:rgba(0,255,136,0.08); border:1px solid var(--green); border-radius:4px; margin-bottom:12px; }

  .footer { text-align:center; padding:16px; font-size:10px; color:var(--text2); font-family:var(--mono); }
  .loading-spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--bg); border-top-color:var(--cyan); border-radius:50%; animation:spin 0.6s linear infinite; margin-left:8px; vertical-align:middle; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="terminal-line"><span class="prompt">guest@pawradise</span>:<span>~</span>$ ./auth --login<span class="cursor"></span></div>

<div class="page">
  <div class="card">
    <div class="card-title" id="pageTitle">LOGIN</div>
    <div class="card-subtitle">authenticating with PAWRADISE</div>

    <div id="messageBox"></div>

    <form id="authForm" onsubmit="return handleSubmit(event)">
      <div id="bodyFields">
        <div class="field">
          <label>EMAIL</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="field">
          <label>PASSWORD</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">SUBMIT</button>
      <a href="#" class="switch-link" id="switchLink">Don't have an account? REGISTER →</a>
    </form>
  </div>
  <div class="footer">PAWRADISE &copy; 2026 — secure authentication</div>
</div>

<script>
(function() {
  var API_BASE = '/api/v1';

  var isLogin = true;
  var redirectTo = getRedirect();

  function getRedirect() {
    var p = new URLSearchParams(window.location.search).get('redirect');
    return p || '/';
  }

  function showForm(bodyHTML, title, subtitle, switchText, switchUrl) {
    document.getElementById('bodyFields').innerHTML = bodyHTML;
    document.getElementById('pageTitle').textContent = title;
    var sub = document.querySelector('.card-subtitle');
    if (sub) sub.textContent = subtitle;
    var link = document.getElementById('switchLink');
    if (switchUrl) {
      link.href = switchUrl;
      link.textContent = switchText;
    }
  }

  window.handleSubmit = function(e) {
    e.preventDefault();
    var form = document.getElementById('authForm');
    var btn = document.getElementById('submitBtn');
    var inputs = form.querySelectorAll('input');
    inputs.forEach(function(i) { i.classList.remove('error'); });
    document.getElementById('messageBox').innerHTML = '';

    if (isLogin) {
      login(inputs[0].value, inputs[1].value, btn);
    } else {
      register(inputs[0].value, inputs[1].value, inputs[2] ? inputs[2].value : '', btn);
    }
  };

  function login(email, password, btn) {
    if (!email || !password) {
      document.getElementById('messageBox').innerHTML = '<div class="error-msg">email and password are required</div>';
      return;
    }
    btn.disabled = true;
    btn.innerHTML = 'SUBMITTING<span class="loading-spinner"></span>';
    fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    }).then(function(r) {
      var d = {};
      try { d = r.json(); } catch(e) {}
      if (r.status === 200) {
        if (d.token) {
          localStorage.setItem('pawradise_token', d.token);
          localStorage.setItem('pawradise_user', JSON.stringify(d.user || {}));
          window.location.href = redirectTo;
        } else {
          document.getElementById('messageBox').innerHTML =
            '<div class="error-msg">login failed: ' + (d.error || 'unknown error') + '</div>';
          btn.disabled = false;
          btn.textContent = 'SUBMIT';
        }
      } else {
        document.getElementById('messageBox').innerHTML =
          '<div class="error-msg">' + (d.error || 'login failed (' + r.status + ')') + '</div>';
        btn.disabled = false;
        btn.textContent = 'SUBMIT';
      }
    }).catch(function() {
      document.getElementById('messageBox').innerHTML = '<div class="error-msg">network error — please try again</div>';
      btn.disabled = false;
      btn.textContent = 'SUBMIT';
    });
  }

  function register(name, email, password, btn) {
    if (password && password.length < 8) {
      document.getElementById('messageBox').innerHTML =
        '<div class="error-msg">password must be at least 8 characters</div>';
      return;
    }
    btn.disabled = true;
    btn.innerHTML = 'CREATING...<span class="loading-spinner"></span>';
    fetch(API_BASE + '/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: name || email.split('@')[0],
        email: email,
        password: password
      })
    }).then(function(r) {
      var d = {};
      try { d = r.json(); } catch(e) {}
      if (r.status === 201) {
        // Auto-login after registration
        if (d.token) {
          localStorage.setItem('pawradise_token', d.token);
          localStorage.setItem('pawradise_user', JSON.stringify(d.user || {}));
          window.location.href = redirectTo;
        } else {
          document.getElementById('messageBox').innerHTML =
            '<div class="success-msg">account created! please log in.</div>';
          showLoginForm();
        }
      } else {
        document.getElementById('messageBox').innerHTML =
          '<div class="error-msg">' + (d.error || 'registration failed (' + r.status + ')') + '</div>';
        btn.disabled = false;
        btn.textContent = 'CREATE ACCOUNT';
      }
    }).catch(function() {
      document.getElementById('messageBox').innerHTML = '<div class="error-msg">network error — please try again</div>';
      btn.disabled = false;
      btn.textContent = 'CREATE ACCOUNT';
    });
  }

  function showLoginForm() {
    isLogin = true;
    showForm(
      '<div class="field"><label>EMAIL</label><input type="email" id="email" placeholder="you@example.com" required autocomplete="email"></div>' +
      '<div class="field"><label>PASSWORD</label><input type="password" id="password" placeholder="••••••••" required autocomplete="current-password"></div>',
      'LOGIN',
      'authenticating with PAWRADISE',
      "Don't have an account? REGISTER →",
      '#?register'
    );
    var switchLink = document.getElementById('switchLink');
    switchLink.onclick = function(e) {
      e.preventDefault();
      showRegisterForm();
    };
  }

  function showRegisterForm() {
    isLogin = false;
    showForm(
      '<div class="field"><label>NAME (optional)</label><input type="text" id="name" placeholder="john doe" autocomplete="name"></div>' +
      '<div class="field"><label>EMAIL</label><input type="email" id="email" placeholder="you@example.com" required autocomplete="email"></div>' +
      '<div class="field"><label>PASSWORD (min 8 chars)</label><input type="password" id="password" placeholder="••••••••" required autocomplete="new-password" minlength="8"></div>',
      'REGISTER',
      'creating your PAWRADISE account',
      "Already have an account? LOGIN →",
      '#?login'
    );
    var switchLink = document.getElementById('switchLink');
    switchLink.onclick = function(e) {
      e.preventDefault();
      showLoginForm();
    };
  }

  // Check if already logged in
  if (localStorage.getItem('pawradise_token')) {
    window.location.href = redirectTo;
  }

  // Handle ?register or ?login query param
  var mode = new URLSearchParams(window.location.search).get('register') ? 'register' : 'login';
  if (mode === 'register') {
    showRegisterForm();
  } else {
    showLoginForm();
  }
})();
</script>
</body>
</html>
