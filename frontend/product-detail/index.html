<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAWRADISE — Product</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0a0a0f; --surface:#14141f; --surface2:#1a1a2a;
    --border:#2a2a3a; --text:#e0e0e0; --text2:#8888aa;
    --cyan:#00d4ff; --magenta:#ff0066; --green:#00ff88;
    --mono:Consolas,'Courier New',monospace;
    --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; line-height:1.6; }
  .header {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 24px; background:var(--surface);
    border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100;
    box-shadow:0 0 20px rgba(0,212,255,0.05);
  }
  .logo {
    font-family:var(--mono); font-size:20px; font-weight:bold;
    color:var(--cyan); letter-spacing:2px; text-decoration:none;
    text-shadow:0 0 10px rgba(0,212,255,0.5);
  }
  .logo span { color:var(--magenta); text-shadow:0 0 10px rgba(255,0,102,0.5); }
  .header nav { display:flex; gap:24px; align-items:center; }
  .header nav a {
    color:var(--text2); text-decoration:none; font-size:13px;
    font-family:var(--mono); transition:color 0.2s; letter-spacing:1px;
  }
  .header nav a:hover { color:var(--cyan); text-shadow:0 0 8px rgba(0,212,255,0.5); }
  .header nav a.active { color:var(--cyan); }
  .env-badge {
    font-family:var(--mono); font-size:10px; color:var(--text2);
    margin-left:16px; padding:4px 10px; border-radius:10px;
    border:1px solid var(--border); letter-spacing:1px;
  }
  .auth-btn {
    background:transparent; border:1px solid var(--cyan); color:var(--cyan);
    font-family:var(--mono); font-size:12px; padding:6px 14px;
    border-radius:4px; cursor:pointer; margin-left:12px; letter-spacing:1px;
    transition:all 0.2s;
  }
  .auth-btn:hover { background:var(--cyan); color:var(--bg); }
  .terminal-line {
    font-family:var(--mono); font-size:11px; color:var(--text2);
    padding:8px 16px; border-bottom:1px solid var(--border); background:var(--surface);
  }
  .terminal-line .prompt { color:var(--cyan); }
  .container { max-width:960px; margin:0 auto; padding:32px 24px; }
  .breadcrumb {
    font-family:var(--mono); font-size:12px; color:var(--text2); margin-bottom:20px;
  }
  .breadcrumb a { color:var(--cyan); text-decoration:none; }
  .detail { display:grid; grid-template-columns:1fr 1fr; gap:32px; }
  .gallery {
    background:var(--surface); border:1px solid var(--border); border-radius:6px;
    overflow:hidden;
  }
  .gallery img { width:100%; display:block; }
  .gallery .placeholder {
    aspect-ratio:3/2; display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); color:var(--cyan); background:var(--surface2);
    font-size:14px;
  }
  .thumbs { display:flex; gap:8px; padding:12px; flex-wrap:wrap; }
  .thumbs img { width:72px; height:48px; object-fit:cover; border-radius:4px; border:1px solid var(--border); cursor:pointer; transition:border-color 0.2s; }
  .thumbs img:hover { border-color:var(--cyan); }
  .thumbs img.active { border-color:var(--cyan); box-shadow:0 0 8px rgba(0,212,255,0.3); }
  .info .category { font-family:var(--mono); font-size:11px; color:var(--magenta); letter-spacing:2px; margin-bottom:8px; }
  .info h1 { font-size:28px; margin-bottom:12px; color:var(--text); }
  .info .desc { color:var(--text2); font-size:14px; margin-bottom:20px; line-height:1.6; }
  .price-box {
    background:var(--surface); border:1px solid var(--border); border-radius:6px;
    padding:20px; margin-bottom:20px;
  }
  .price-usd { font-family:var(--mono); font-size:32px; color:var(--green); }
  .price-note { font-family:var(--mono); font-size:11px; color:var(--text2); margin-top:4px; }
  .btn-buy {
    width:100%; padding:14px; background:var(--cyan); color:var(--bg); border:none;
    border-radius:4px; font-family:var(--mono); font-size:14px; font-weight:bold;
    letter-spacing:1px; cursor:pointer; transition:all 0.2s;
  }
  .btn-buy:hover { box-shadow:0 0 20px rgba(0,212,255,0.5); }
  .btn-buy:disabled { background:var(--surface2); color:var(--text2); cursor:wait; box-shadow:none; }
  .meta { font-family:var(--mono); font-size:11px; color:var(--text2); margin-top:16px; }
  .meta div { margin-bottom:4px; }
  .error-box { text-align:center; padding:64px 0; color:var(--text2); font-family:var(--mono); }
  .error-box .icon { font-size:40px; margin-bottom:12px; opacity:0.3; }
  .footer { text-align:center; padding:24px; color:var(--text2); font-size:11px; font-family:var(--mono); border-top:1px solid var(--border); margin-top:32px; }
  @media (max-width:768px) { .detail { grid-template-columns:1fr; } .container { padding:16px; } }
</style>
</head>
<body data-page="shop">

<div class="terminal-line"><span class="prompt">guest@pawradise</span>:<span>~</span>$ ./inspect --product <span id="termSlug">…</span></div>

<header class="header">
  <a href="/" class="logo">PAW<span>RADISE</span></a>
  <nav style="margin-right:24px;">
    <a href="/" data-nav="shop">SHOP</a>
    <a href="/community" data-nav="community">COMMUNITY</a>
    <a href="/account" data-nav="account">ACCOUNT</a>
  </nav>
  <div style="display:flex;align-items:center;">
    <button id="authBtn" class="auth-btn">LOGIN</button>
    <span id="envBadge" class="env-badge"></span>
  </div>
</header>

<div class="container">
  <div class="breadcrumb"><a id="backLink" href="#">&lt; shop</a> / <span id="crumbSlug">…</span></div>
  <div id="loading" class="error-box"><div class="icon">LOADING</div><div>loading product…</div></div>
  <div id="detail" class="detail" style="display:none;">
    <div class="gallery">
      <div id="mainImage"></div>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <div class="info">
      <div class="category" id="pCategory"></div>
      <h1 id="pTitle"></h1>
      <div class="desc" id="pDesc"></div>
      <div class="price-box">
        <div class="price-usd" id="pPrice"></div>
        <div class="price-note">pay with BNB (BSC) — exact crypto amount shown at checkout</div>
      </div>
      <button class="btn-buy" id="buyBtn" onclick="buyNow()">BUY NOW &gt;_</button>
      <div class="meta" id="pMeta"></div>
    </div>
  </div>
  <div id="notFound" class="error-box" style="display:none;">
    <div class="icon">404</div>
    <div>product not found</div>
    <div style="margin-top:8px;"><a id="backLink2" href="#" style="color:var(--cyan);">back to shop</a></div>
  </div>
</div>

<div class="footer">PAWRADISE &copy; 2026 &mdash; <span id="envText">production</span> environment</div>

<script>
(function() {
  var path = window.location.pathname;
  var isStaging = path.startsWith('/staging');
  var API_BASE = isStaging ? '/staging/api/v1' : '/api/v1';
  var LINK_BASE = isStaging ? '/staging' : '';

  // Env + nav
  document.getElementById('envBadge').textContent = isStaging ? 'ENV: staging' : 'ENV: production';
  document.getElementById('envText').textContent = isStaging ? 'staging' : 'production';
  document.querySelectorAll('[data-link]').forEach(function(a) { a.href = LINK_BASE + a.getAttribute('data-link'); });
  (function() { var pg = document.body.getAttribute('data-page'); var el = document.querySelector('[data-nav="' + pg + '"]'); if(el) el.style.color = 'var(--cyan)'; })();

  document.getElementById('backLink').href = LINK_BASE + '/';
  document.getElementById('backLink2').href = LINK_BASE + '/';

  // Extract slug from URL
  var slug = decodeURIComponent(path.split('/').filter(Boolean).pop() || '');
  document.getElementById('termSlug').textContent = slug;
  document.getElementById('crumbSlug').textContent = slug;
  var productId = null;

  function escapeHtml(t) { var d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

  // Auth button
  (function() {
    var b = document.getElementById('authBtn');
    if (!b) return;
    var t = localStorage.getItem('pawradise_token');
    if (t) {
      b.textContent = 'LOGOUT';
      b.onclick = function() { localStorage.removeItem('pawradise_token'); window.location.href = LINK_BASE + '/'; };
    } else {
      b.textContent = 'LOGIN';
      b.onclick = function() { window.location.href = LINK_BASE + '/auth/?redirect=' + encodeURIComponent(LINK_BASE + '/product/' + slug); };
    }
  })();

  async function loadProduct() {
    try {
      var res = await fetch(API_BASE + '/products/' + encodeURIComponent(slug));
      if (!res.ok) throw new Error('not found');
      var data = await res.json();
      var p = data.product;
      productId = p.id;

      document.getElementById('pCategory').textContent = '// ' + (p.category_name || 'uncategorized');
      document.getElementById('pTitle').textContent = p.title;
      document.getElementById('pDesc').textContent = p.description;
      document.getElementById('pPrice').textContent = '$' + p.price_usd;

      var imgs = data.images || [];
      var main = document.getElementById('mainImage');
      if (imgs.length > 0) {
        var firstImg = imgs.find(function(i) { return i.is_primary; }) || imgs[0];
        main.innerHTML = '<img id="mainImg" src="' + firstImg.url + '" alt="' + escapeHtml(p.title) + '">';
        document.getElementById('thumbs').innerHTML = imgs.map(function(im, i) {
          var cls = (im.id === firstImg.id) ? 'active' : '';
          return '<img src="' + im.url + '" class="' + cls + '" onclick="document.getElementById(\'mainImg\').src=this.src;document.querySelectorAll(\'.thumbs img\').forEach(function(e){e.classList.remove(\'active\')});this.classList.add(\'active\')">';
        }).join('');
      } else {
        main.innerHTML = '<div class="placeholder">[' + escapeHtml(p.slug) + ']</div>';
      }

      document.getElementById('pMeta').innerHTML =
        '<div>id: ' + p.id + ' | slug: ' + escapeHtml(p.slug) + '</div>' +
        '<div>downloads: ' + (p.max_downloads_per_user === 0 ? 'unlimited' : p.max_downloads_per_user + ' per user') + '</div>' +
        '<div>delivery: instant, after on-chain payment confirmation</div>';

      document.getElementById('loading').style.display = 'none';
      document.getElementById('detail').style.display = 'grid';
    } catch (e) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('notFound').style.display = 'block';
    }
  }

  async function buyNow() {
    var token = localStorage.getItem('pawradise_token');
    if (!token) {
      window.location.href = LINK_BASE + '/auth/?redirect=' + encodeURIComponent(LINK_BASE + '/product/' + slug);
      return;
    }
    var btn = document.getElementById('buyBtn');
    btn.disabled = true;
    btn.textContent = 'CREATING ORDER\u2026';
    try {
      var res = await fetch(API_BASE + '/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ items: [{ product_id: productId, quantity: 1 }] })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'order failed');
      var orderId = data.order ? data.order.id : data.order_id;
      window.location.href = LINK_BASE + '/checkout?order=' + orderId;
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'BUY NOW >_';
      alert('order failed: ' + e.message);
    }
  }

  loadProduct();
  window.buyNow = buyNow;
})();
</script>
</body>
</html>
