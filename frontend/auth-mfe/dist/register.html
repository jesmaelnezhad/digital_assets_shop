<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawradise — Sign Up</title>
    <meta name="description" content="Create your Pawradise account">
    <link rel="stylesheet" href="/assets/theme.css">
    <script src="/env.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background-color: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: var(--color-bg-elevated);
            border-bottom: 1px solid var(--color-border);
            padding: var(--space-sm) var(--space-lg);
        }
        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-family: var(--font-mono);
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--color-accent-primary);
            text-decoration: none;
        }
        .nav { display: flex; gap: var(--space-md); }
        .nav a {
            color: var(--color-text);
            text-decoration: none;
            font-size: 0.9rem;
            padding: var(--space-xs) var(--space-sm);
            border-radius: var(--radius-sm);
            transition: color 0.15s ease;
        }
        .nav a:hover { color: var(--color-accent-primary); }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-lg);
        }
        .auth-card {
            background-color: var(--color-bg-elevated);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            width: 100%;
            max-width: 420px;
        }
        .auth-card h1 {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            color: var(--color-accent-primary);
            margin-bottom: var(--space-xs);
        }
        .auth-card .subtitle {
            color: var(--color-text-muted);
            font-size: 0.9rem;
            margin-bottom: var(--space-lg);
        }
        .field { margin-bottom: var(--space-md); }
        .field label {
            display: block;
            font-size: 0.85rem;
            color: var(--color-text-muted);
            margin-bottom: var(--space-xs);
        }
        .field input {
            width: 100%;
            padding: var(--space-sm) var(--space-md);
            background-color: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text);
            font-size: 0.95rem;
            font-family: var(--font-sans);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .field input:focus {
            outline: none;
            border-color: var(--color-accent-primary);
            box-shadow: var(--glow-focus);
        }
        .field .error {
            color: var(--color-danger);
            font-size: 0.8rem;
            margin-top: var(--space-xs);
            display: none;
        }
        .field .error.visible { display: block; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-sm) var(--space-md);
            font-size: 0.9rem;
            font-family: var(--font-sans);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
            width: 100%;
        }
        .btn-primary {
            background-color: var(--color-accent-primary);
            color: var(--color-bg);
            font-weight: 600;
        }
        .btn-primary:hover { box-shadow: var(--glow-hover); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .auth-footer {
            text-align: center;
            margin-top: var(--space-md);
            color: var(--color-text-muted);
            font-size: 0.85rem;
        }
        .auth-footer a {
            color: var(--color-accent-primary);
            text-decoration: none;
        }
        .auth-footer a:hover { text-decoration: underline; }
        .banner {
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-sm);
            margin-bottom: var(--space-md);
            font-size: 0.85rem;
            display: none;
        }
        .banner.error {
            background-color: rgba(224, 111, 111, 0.1);
            border: 1px solid var(--color-danger);
            color: var(--color-danger);
        }
        .banner.success {
            background-color: rgba(95, 214, 138, 0.1);
            border: 1px solid var(--color-success);
            color: var(--color-success);
        }
        .banner.visible { display: block; }
        .footer {
            background-color: var(--color-bg-elevated);
            border-top: 1px solid var(--color-border);
            padding: var(--space-lg);
            text-align: center;
            color: var(--color-text-muted);
            font-size: 0.8rem;
            font-family: var(--font-mono);
        }
    </style>
    <!-- CHROME_HEADER -->
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">/pawradise</a>
            <nav class="nav">
                <a href="/">Shop</a>
                <a href="/category">Categories</a>
                <a href="/product/bundle.html">Bundles</a>
                <a href="/product/request.html">Request</a>
                <a href="/community">Community</a>
                <a href="/account">Account</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="auth-card" x-data="{
            name: '',
            email: '',
            password: '',
            referralCode: '',
            error: '',
            loading: false,
            get isValid() {
                return this.name.length >= 2 && this.email.includes('@') && this.password.length >= 6;
            },
            init() {
                const params = new URLSearchParams(window.location.search);
                this.referralCode = params.get('ref') || '';
            },
            async submit() {
                if (!this.isValid) {
                    this.error = 'Please fill all fields (password 6+ chars)';
                    return;
                }
                this.loading = true;
                this.error = '';
                try {
                    const body = { name: this.name, email: this.email, password: this.password };
                    if (this.referralCode) body.referral_code = this.referralCode;
                    const res = await fetch(`${window.__PAWRADISE_ENV__?.apiBase || '/api/v1'}/register`, {
                        method: 'POST',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    if (!res.ok) {
                        const data = await res.json().catch(() => ({}));
                        throw new Error(data.error || 'Registration failed');
                    }
                    window.location.href = '/account';
                } catch (err) {
                    this.error = err.message || 'Registration failed';
                } finally {
                    this.loading = false;
                }
            }
        }">
            <h1>Sign Up</h1>
            <p class="subtitle">Create an account. Start collecting digital assets.</p>
            
            <div class="banner error" :class="{ visible: error }" x-text="error"></div>
            
            <form @submit.prevent="submit">
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" x-model="name" placeholder="Your name" required>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" x-model="email" placeholder="you@example.com" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" x-model="password" placeholder="6+ characters" required minlength="6">
                </div>
                <div class="field">
                    <label for="referral">Referral Code (optional)</label>
                    <input type="text" id="referral" x-model="referralCode" placeholder="REF-XXXX">
                </div>
                <button type="submit" class="btn btn-primary" :disabled="loading">
                    <span x-show="!loading">Create Account</span>
                    <span x-show="loading">Creating...</span>
                </button>
            </form>
            
            <div class="auth-footer">
                Already have an account? <a href="/login">Log in</a>
            </div>
        </div>
    </main>

    <footer class="footer">// pawradise.ir</footer>

    <script src="/assets/alpine.min.js" defer></script>
    <!-- CHROME_FOOTER -->
</body>
</html>
