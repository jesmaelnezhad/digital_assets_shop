<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout — Store4bots</title>
    <script>window.SITE_PAGE="cart";</script>
  <link rel="icon" href="/assets/favicon.svg" sizes="any" />
  <link rel="stylesheet" href="/assets/theme.css?v=11" />
  <script src="/env.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="page" id="root"></main>
  <div class="modal" id="modal"><div class="modal-card" id="modal-card"></div></div>
  <footer id="site-footer"></footer>
    <script src="/assets/api.js"></script>
  <script src="/assets/ui.js"></script>
  <script src="/assets/events.js"></script>
  <script src="/assets/chrome.js"></script>
  <script>
    const api = Store4bots.api;
    let coupon = null;
    async function render() {
      const root = document.getElementById("root");
      let user = null;
      try { user = await api.auth.getProfile(); } catch (e) {}
      await PawUI.catalog.load();
      let items = [];
      try {
        items = ((await api.cart.get()).items || []).map((i) => {
          const p = PawUI.catalog.byId[i.product_id];
          return Object.assign({}, i, { product: p, unit: p ? p.price_usd : 0 });
        });
      } catch (e) {
        if (!user) {
          root.innerHTML = PawUI.authGate("Log in to check out, or register first. Demo: nia@example.com / nia");
          return;
        }
      }
      if (!items.length) { root.innerHTML = '<p class="note">Nothing to check out.</p>'; return; }
      const sub = items.reduce((n, i) => n + i.unit * i.quantity, 0);
      const discount = PawUI.couponOff(coupon, sub);
      const total = Math.max(0, sub - discount);
      const zero = total <= 0;
      root.innerHTML = `<div class="split">
        <div>
          <div class="kicker">Commerce</div>
          <h1 class="page-title">Checkout</h1>
          <div class="table-wrap"><table class="table">${items.map((i) => `<tr><td>${PawUI.esc((i.product&&i.product.title)||("#"+i.product_id))}</td><td>${i.quantity}</td><td>${PawUI.money(i.unit * i.quantity)}</td></tr>`).join("")}</table></div>
          <form id="coupon" class="field-col">Coupon
            <input name="code" placeholder="SAVE12 · WELCOME · MARBLE" value="${coupon && coupon.code || ""}" />
            <button class="btn">Apply</button>
            <p class="form-error"></p>
          </form>
          ${user ? "" : `<label class="field-col">Guest email <input id="email" type="email" required /></label>`}
        </div>
        <aside class="buy">
          <div>Subtotal ${PawUI.money(sub)}</div>
          <div>Discount ${PawUI.money(discount)}</div>
          <div class="price">Total ${PawUI.money(total)}</div>
          <button class="btn btn-accent" id="pay">${zero ? "Complete order" : "Pay"}</button>
          <p style="margin-top:12px;color:var(--mute);font-size:12px">${zero ? "Amount due is $0 — one click marks the order paid." : "BSC address from create-order (or settings for guests)."}</p>
        </aside>
      </div>`;
      document.getElementById("coupon").onsubmit = async (e) => {
        e.preventDefault();
        const code = new FormData(e.target).get("code");
        try {
          coupon = await api.coupons.validate(code, sub);
          coupon.code = code;
          render();
        } catch (ex) { e.target.querySelector(".form-error").textContent = ex.message; }
      };
      document.getElementById("pay").onclick = async () => {
        try {
          const payload = {
            coupon_code: coupon && coupon.valid ? coupon.code : undefined,
            items: items.map((i) => ({ product_id: i.product_id, quantity: i.quantity, price_usd: i.unit }))
          };
          let created, address, totalUsd, chain, id, status, zeroDue;
          if (user) {
            created = await api.orders.create(payload);
            address = created.payment_address;
            totalUsd = Number(created.total_usd);
            chain = created.crypto_chain;
            id = created.order ? created.order.id : created.id;
            status = created.order && created.order.status;
            zeroDue = !!(created.zero_due || totalUsd <= 0 || zero);
          } else {
            const email = document.getElementById("email").value;
            created = await api.orders.createGuestOrder(email, payload.items);
            const guest = await api.orders.getGuestOrder(created.id, email);
            const setting = await api.settings.get("payment_address").catch(() => ({ value: "" }));
            address = setting.value;
            totalUsd = Number(guest.total_usd);
            chain = "BSC";
            id = created.id;
            zeroDue = totalUsd <= 0 || zero;
          }
          async function finish() {
            if (user && status !== "paid") {
              try { await api.orders.confirm(id); } catch (e) { /* already paid is fine */ }
            }
            location.href = user ? "/account/order.html?id=" + encodeURIComponent(id) : "/";
          }
          if (zeroDue) {
            await finish();
            return;
          }
          const modal = document.getElementById("modal");
          document.getElementById("modal-card").innerHTML = `
            <h2>Send payment</h2>
            <p class="mono">${PawUI.esc(address || "")}</p>
            <p>${PawUI.money(totalUsd)} · ${chain || "BSC"} · memo ${id}</p>
            <button class="btn btn-accent" id="confirm">I've paid</button>`;
          modal.classList.add("open");
          document.getElementById("confirm").onclick = async () => {
            modal.classList.remove("open");
            await finish();
          };
        } catch (ex) { PawUI.toast(ex.message); }
      };
    }
    render();
  </script>
</body>
</html>
