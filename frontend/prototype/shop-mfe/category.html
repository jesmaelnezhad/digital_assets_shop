<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Categories — Pawradise</title>
  <script>window.PROTOTYPE_ROOT="../"; window.PROTOTYPE_PAGE="shop"; window.__PAWRADISE_ENV__={apiBase:"/api/v1",envName:"prototype"};</script>
  <link rel="stylesheet" href="../shared/theme.css" />
</head>
<body>
  <header id="site-header"></header>
  <main class="page" id="root"></main>
  <footer id="site-footer"></footer>
  <script src="../shared/store.js"></script>
  <script src="../shared/mock-api.js"></script>
  <script src="../shared/api-client.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="../shared/events.js"></script>
  <script src="../shared/chrome.js"></script>
  <script>
    Pawradise.api.products.getCategories().then((res) => {
      document.getElementById("root").innerHTML = `<div class="kicker">Shop</div><h1 class="page-title">Categories</h1>
        <div class="cat-grid">${(res.categories || []).map((c) => `
          <a class="cat-card" href="index.html?category=${encodeURIComponent(c.slug)}">
            <h3>${PawUI.esc(c.name)}</h3>
            <p>${PawUI.esc(c.description)}</p>
          </a>`).join("")}</div>`;
      document.title = "Categories — Pawradise";
      let m = document.querySelector('meta[name="description"]');
      if (!m) { m = document.createElement("meta"); m.name = "description"; document.head.appendChild(m); }
      m.content = "Browse Pawradise categories: 3D, UI kits, textures, audio, environments, icons, VFX.";
    });
  </script>
</body>
</html>
